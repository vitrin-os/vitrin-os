name: CI

# Phase-1 pipeline (P1.9.1). Jobs mirror the components the issue names, so
# each acceptance criterion is a visible check on every PR:
#
#   rust          fmt + clippy + workspace tests (debug AND release)
#   codegen-diff  IDL schema validation + regeneration honesty (the P1.1.2
#                 contract: checked-in generated code matches vitrin-v0.xml)
#   shim          the C side, in a container with NO Rust toolchain -- the
#                 checked-in generated header must suffice on its own. The
#                 Meson build activates automatically once shim/meson.build
#                 lands (P1.6.1).
#   sdk           the pure-Python wire client's unit tests (P1.8.x) against
#                 its scripted mock server -- no vitrind involved; the live
#                 pairing is the integration job's business.
#   integration   vitrind --headless + scripted Python SDK tests, suite
#                 hard-capped at 10 minutes. Dormant until
#                 tests/integration/run.sh lands
#                 (needs P1.3.x headless + P1.8.x SDK); later hosts the M1.5
#                 gates: demo job (P1.8.4), goldens (P1.9.2), hostile-client
#                 tests (P1.9.3).
#
# Everything runs on GPU-less Linux runners: pixman rendering + shm buffers
# are mandatory in CI (plan 01-phase-1-mvp.md §6 D3), and nested mode is
# never a CI dependency (§7 R1). Jobs grow with each landing epic -- extend
# this file in the PR that lands the surface a job tests.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Superseded pushes to a PR cancel the in-flight run. Pushes to main are
  # keyed per-sha instead of per-ref: GitHub keeps at most ONE pending run
  # per concurrency group and cancels an older pending run when a newer one
  # queues -- even with cancel-in-progress false -- so a ref-keyed group
  # would silently drop the CI verdict for intermediate main commits. A
  # per-sha group gives every main commit its own group and therefore a
  # complete verdict.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Fail the build on any compiler warning, matching how this workspace is
  # developed and verified locally.
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: rust (fmt, clippy, tests debug+release)
    runs-on: ubuntu-latest
    # Explicit budget (the GitHub default is 360 minutes): a looping proptest
    # regression or a wedged linker should fail in minutes, not hold the
    # job -- and, on main, the concurrency queue -- for hours.
    timeout-minutes: 30
    env:
      # This job has no C toolchain and never builds shim/, so
      # `c_shim_conforms_to_the_real_core` cannot run here. The test refuses
      # to skip itself silently under CI (see its doc comment), so the skip
      # is DECLARED rather than assumed -- which is what makes the
      # `conformance` job below the only place that check is satisfied, and
      # makes its removal a red build rather than a quiet loss of coverage.
      VITRIN_C_SHIM_CONFORMANCE_SKIP: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (pinned toolchain + components from rust-toolchain.toml)
        # rust-toolchain.toml is the single source of truth for the version
        # AND the component set (rustfmt is a runtime dependency of the
        # codegen; clippy is the lint gate below). Installing from the file
        # -- rather than a toolchain action with its own version/components
        # inputs -- means bumping the pin never needs a matching ci.yml
        # edit, and CI cannot silently run a different toolchain (or a
        # different clippy lint set) than contributors do.
        run: rustup toolchain install && rustup show active-toolchain

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install native link deps (libxkbcommon + libpixman for the vitrind Smithay backends)
        # vitrin-core's Smithay backends link two system libraries the runner
        # image lacks the -dev packages for: the nested winit backend links
        # libxkbcommon, and the headless backend's pixman software renderer
        # links libpixman-1 (P1.3.2, the GPU-less compositing path). Without
        # either -dev package cargo test/clippy would fail to link vitrind
        # ("unable to find library -lxkbcommon" / "-lpixman-1"). wayland and
        # libinput are dlopen'd at runtime, so no -dev package is needed to
        # link here.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxkbcommon-dev libpixman-1-dev

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy (all targets)
        # --all-targets type-checks every lib/bin/test/bench target, so this
        # step doubles as the "workspace builds" gate; the explicit
        # -D warnings keeps the clippy gate intact even if the global
        # RUSTFLAGS env ever changes.
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test --workspace
        run: cargo test --workspace

      - name: cargo test --workspace --release
        # Not redundant with the debug run: assertion-related bugs are
        # release-only by nature (this crate's first shipped bug was a
        # debug_assert! compiled out in release), so the suite must pass in
        # exactly the mode where such a regression would hide.
        run: cargo test --workspace --release

      - name: vitrin-ipc dependency-light client slice
        # The workspace default feature for vitrin-ipc is `server` (the
        # calloop event-loop glue), so every step above exercises it. This
        # step guards the *other* slice: the `client`-only transport the Rust
        # SDK links must keep building and passing with no calloop pulled in,
        # or the "SDK links no compositor deps" guarantee (P1.2.2) rots
        # unnoticed. Kept scoped to the one crate that has the feature split.
        run: cargo test -p vitrin-ipc --no-default-features --features client

      - name: vitrin-core gpu-tests slice (compile-check only)
        # The real-GPU dmabuf tests (P1.3.5, the M1.5 zero-copy acceptance)
        # hide behind the `gpu-tests` feature and can never RUN on these
        # GPU-less runners — they stay env-gated on developer machines
        # (VITRIN_GPU_TESTS=1, see crates/vitrin-core/Cargo.toml). But
        # nothing else compiles that cfg combination, so without this step a
        # refactor of dmabuf/shim/mock-shim internals could land green and
        # rot the acceptance harness unnoticed. clippy type-checks without
        # linking, so the runner needs no libgbm/EGL (gbm-sys links only at
        # final-binary link time, which check/clippy skip).
        run: cargo clippy -p vitrin-core --all-targets --features gpu-tests -- -D warnings

  codegen-diff:
    name: codegen-diff (IDL schema + regeneration honesty)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate IDL against the RELAX NG schema
        # The scanner parses with roxmltree and performs its own semantic
        # checks, but structural/dialect validation is xmllint's job
        # (CLAUDE.md names this as the protocol validation command); without
        # it, a schema-invalid vitrin-v0.xml that roxmltree tolerates would
        # land green.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
          xmllint --noout --relaxng protocol/vitrin-v0.rng protocol/vitrin-v0.xml

      - name: Install Rust (pinned toolchain + components from rust-toolchain.toml)
        # Installed from rust-toolchain.toml for the reasons documented on
        # the rust job's install step (single source of truth for version
        # and components; the codegen shells out to the pinned rustfmt).
        run: rustup toolchain install && rustup show active-toolchain

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo xtask codegen --check
        # Regenerates into a scratch dir and diffs against the checked-in
        # crates/vitrin-protocol/src/generated + shim/include/vitrin-protocol.h.
        # Fails when generated code drifts from protocol/vitrin-v0.xml.
        run: cargo xtask codegen --check

  shim:
    name: shim (C header, golden frames, Meson; no Rust)
    runs-on: ubuntu-latest
    # A plain distro container, not the runner image: hosted runners ship a
    # Rust toolchain, so only a clean container can prove the acceptance
    # criterion that the shim side builds WITHOUT Rust -- i.e. the
    # checked-in generated header is sufficient on its own (the P1.1.2
    # contract). The container tag also pins the C dependency set at the
    # distro level. Once the shim exists and pins its wlroots API target,
    # this becomes a GHCR-hosted image with that exact wlroots prebuilt
    # (Dockerfile in-repo, rebuilt when it changes) -- decision recorded in
    # P1.9.1, deferred until P1.6.1 fixes the version.
    container: ubuntu:24.04
    timeout-minutes: 15
    steps:
      - name: Install C toolchain and git
        # git first, so the checkout step clones instead of falling back to
        # a tarball download.
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq gcc git ca-certificates

      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert no Rust toolchain is present
        # Machine-checks the "shim job has no Rust toolchain installed"
        # acceptance criterion instead of trusting the container to stay
        # Rust-free by accident.
        run: |
          if command -v cargo >/dev/null 2>&1 || command -v rustc >/dev/null 2>&1; then
            echo "::error::a Rust toolchain is on PATH; the shim job must build from the checked-in header alone"
            exit 1
          fi
          echo "OK: no cargo/rustc on PATH"

      - name: C header compiles standalone (shim/include/vitrin-protocol.h)
        run: gcc -std=c11 -Wall -Werror -I shim/include -c shim/tests/test_header_compiles.c -o /dev/null

      - name: C golden-frame test (Rust and C pinned to the same bytes)
        run: |
          gcc -std=c11 -Wall -Werror -I shim/include shim/tests/test_golden_frames.c -o "${RUNNER_TEMP}/golden"
          "${RUNNER_TEMP}/golden"

      # ---- Meson build: activates the moment shim/meson.build lands ------
      # (P1.6.1 is in flight on a sibling branch; step-level hashFiles
      # guards keep main green both before and after it merges. The
      # dependency list lives in shim/ci/install-deps.sh -- a file the
      # landing PR owns and must adjust to its vendored wlroots subproject's
      # exact build deps, per D11. See the header of that script.)

      - name: Guard against shim gate drift
        # If shim sources land without shim/meson.build, the Meson steps
        # below would skip silently and this job would stay green while
        # never building the shim. Fail loudly instead.
        run: |
          if [ -d shim/src ] && [ ! -f shim/meson.build ]; then
            echo "::error::shim/src exists but shim/meson.build does not -- the Meson CI steps are gated on shim/meson.build and would silently skip. Land meson.build with the sources (P1.6.1)."
            exit 1
          fi

      - name: Install Meson + wlroots subproject build dependencies
        if: hashFiles('shim/meson.build') != ''
        run: bash shim/ci/install-deps.sh

      - name: Re-assert no Rust toolchain after dependency install
        # The first assert proves the header/golden steps ran Rust-free on
        # the clean container; this one re-checks AFTER apt has installed
        # the Meson dependency set, so a future package whose dependency
        # chain drags in rustc/cargo cannot silently void the acceptance
        # criterion for the steps that actually build the shim.
        if: hashFiles('shim/meson.build') != ''
        run: |
          if command -v cargo >/dev/null 2>&1 || command -v rustc >/dev/null 2>&1; then
            echo "::error::the Meson dependency install pulled a Rust toolchain onto PATH; the shim job must build from the checked-in header alone (fix shim/ci/install-deps.sh)"
            exit 1
          fi
          echo "OK: still no cargo/rustc on PATH after dependency install"

      - name: Meson build + tests
        if: hashFiles('shim/meson.build') != ''
        run: |
          meson setup "${RUNNER_TEMP}/shim-build" shim
          meson compile -C "${RUNNER_TEMP}/shim-build"
          # --suite vitrin-shim: only this project's tests, not the vendored
          # subprojects' suites (the wlroots wrap pulls in pixman/libliftoff,
          # whose slow exhaustive tests otherwise run here and time out).
          meson test -C "${RUNNER_TEMP}/shim-build" --suite vitrin-shim --print-errorlogs

      - name: Headless acceptance (exact globals + weston-terminal blind)
        # The P1.6.1 acceptance criteria, machine-checked: wayland-info lists
        # exactly the expected globals and weston-terminal runs blind against
        # the shim without crashing or hanging it. GPU-free (pixman).
        if: hashFiles('shim/meson.build') != ''
        working-directory: shim
        run: SHIM_BIN="${RUNNER_TEMP}/shim-build/vitrin-shim" bash tests/acceptance/shim_globals_and_client.sh

      # NOTE: the name is quoted because it contains ": ", which YAML forbids
      # in a plain scalar -- unquoted, this line makes the WHOLE workflow file
      # unparseable and every job silently stops running.
      - name: "Headless acceptance (upstream link: frames, damage, pacing, backpressure)"
        # The P1.6.2 acceptance criteria, machine-checked against the WIRE by
        # a peer that spawns the shim exactly as the core does (socketpair at
        # fd 3). Deliberately Rust-free, like the rest of this job: the core
        # side of the protocol is reimplemented in C in shim/tests/mock_core.c
        # so the shim's acceptance proof never needs the workspace built.
        #
        # That reimplementation is also this job's blind spot: mock_core.c and
        # the shim were written by the same hand from the same reading of the
        # IDL, so a shared misreading passes here. The `conformance` job is
        # what closes it, by running the same C shim against the REAL Rust
        # core.
        if: hashFiles('shim/tests/acceptance/upstream_frame_path.sh') != ''
        working-directory: shim
        run: BUILD_DIR="${RUNNER_TEMP}/shim-build" bash tests/acceptance/upstream_frame_path.sh

      # NOTE: quoted for the same reason as the step above -- the name contains
      # ": ", which YAML forbids in a plain scalar.
      - name: "Headless acceptance (seat input replay: events, keymap, coordinates, origin tag)"
        # The P1.6.3 acceptance criteria, checked by three witnesses that share
        # no code: the mock core plays a scripted run of `vitrin_shim_seat`
        # events and traces each one, the shim writes its own delivery trace,
        # and a real Wayland client resolves every key through the keymap it
        # was sent. The R5 gate additionally drives a real GtkEntry -- that
        # criterion is about the toolkit's input-method layer, which no keysym
        # stream can stand in for, and the script FAILS rather than skipping it
        # under CI (libgtk-3-dev is installed by shim/ci/install-deps.sh).
        if: hashFiles('shim/tests/acceptance/seat_input_replay.sh') != ''
        working-directory: shim
        run: BUILD_DIR="${RUNNER_TEMP}/shim-build" bash tests/acceptance/seat_input_replay.sh

      # NOTE: quoted because the name contains ": " -- see the two steps above.
      - name: "Headless acceptance (Firefox bring-up: render, scroll, URL bar, globals ledger)"
        # The P1.6.4 acceptance criteria. The script FAILS rather than skipping
        # under CI unless the gap is declared, which is the same rule the
        # `conformance` job's cross-track test applies to itself -- a criterion
        # that only ever reports SKIP on the machine gating merges is a
        # criterion nobody is holding.
        #
        # THE GAP IS DECLARED HERE, DELIBERATELY, AND IT IS A REAL GAP. Firefox
        # is a 75 MB tarball fetched from Mozilla (shim/tests/firefox/fetch-esr.sh)
        # and it needs a system library set this bare ubuntu:24.04 container does
        # not fully carry -- libgtk-3-dev covers most of it, but at least
        # libasound2t64 and libseccomp2 are additionally required, and that list
        # has never been validated in this container. Turning the gate on with an
        # unvalidated dependency list would trade a known, visible gap for an
        # intermittent red nobody can reproduce locally.
        #
        # TO CLOSE IT: add the missing runtime libraries to
        # shim/ci/install-deps.sh, cache shim/.firefox keyed on
        # shim/tests/firefox/firefox-esr.pin, run fetch-esr.sh, and drop the
        # VITRIN_SKIP_FIREFOX_GATE line below. Until then the criteria are held
        # on a developer machine only, and this notice says so on every run
        # rather than letting a green tick imply otherwise.
        if: hashFiles('shim/tests/acceptance/firefox_bringup.sh') != ''
        working-directory: shim
        env:
          VITRIN_SKIP_FIREFOX_GATE: "1"
        run: |
          BUILD_DIR="${RUNNER_TEMP}/shim-build" bash tests/acceptance/firefox_bringup.sh
          echo "::notice title=P1.6.4 Firefox gate declared SKIPPED::the pinned Firefox ESR is not fetched in CI, so the render/scroll/URL-bar/globals-ledger criteria were NOT proved by this run."
          {
            echo "## shim job: P1.6.4 Firefox gate SKIPPED (declared)"
            echo ""
            echo "The pinned Firefox ESR is not fetched in this job, so **none** of"
            echo "\`firefox_bringup.sh\`'s criteria ran. They are held on a developer"
            echo "machine (see \`shim/docs/firefox.md\`). The script refuses to skip"
            echo "silently under CI; this job declares the gap with"
            echo "\`VITRIN_SKIP_FIREFOX_GATE=1\`. See the step's comment for what it"
            echo "would take to hold the gate here."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Meson build DORMANT
        if: hashFiles('shim/meson.build') == ''
        run: |
          echo "::notice title=shim Meson steps dormant::shim/meson.build has not landed yet (P1.6.1) -- the Meson install/build/test steps were skipped, not passed."
          {
            echo "## shim job: Meson steps DORMANT"
            echo ""
            echo "\`shim/meson.build\` has not landed yet (P1.6.1). Only the header-compile,"
            echo "golden-frame, and no-Rust checks ran. The Meson build/test steps activate"
            echo "automatically when \`shim/meson.build\` lands; the landing PR owns"
            echo "\`shim/ci/install-deps.sh\` (see its header, decision D11)."
          } >> "$GITHUB_STEP_SUMMARY"

  conformance:
    name: conformance (real C shim against the real Rust core)
    runs-on: ubuntu-latest
    # The one job that holds BOTH toolchains, and the only reason it exists.
    # Every other check on the shim wire has a peer written by the same hand
    # in the same language: the `rust` job validates the core against
    # vitrin-mock-shim, the `shim` job validates the shim against
    # shim/tests/mock_core.c. Both pass if the two sides misread the IDL
    # identically. This job runs the real C shim, built from the generated
    # header alone, against the real core's ShimServer -- so a shared
    # misreading has nowhere left to hide.
    #
    # Deliberately NOT folded into the `rust` job: Ubuntu ships no
    # wlroots-0.19, so the Meson wrap builds it from source (D11), and that
    # cost has no business sitting in front of fmt/clippy/tests. And
    # deliberately NOT folded into the `shim` job, whose standing acceptance
    # criterion is that no Rust toolchain is on PATH.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (pinned toolchain + components from rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install native link deps (libxkbcommon + libpixman for the vitrind backends)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxkbcommon-dev libpixman-1-dev

      - name: Install Meson + wlroots subproject build dependencies
        # The same list the `shim` job uses, from the same file, so the two
        # builds of the shim can never diverge in their dependency set.
        # `sudo` because that script is written for the shim job's root
        # container; here it runs on a hosted runner.
        run: sudo bash shim/ci/install-deps.sh

      - name: Build the C shim
        run: |
          meson setup "${RUNNER_TEMP}/shim-build" shim
          meson compile -C "${RUNNER_TEMP}/shim-build"

      # No `hashFiles` gate on the three steps above, unlike the `shim`
      # job's: that job predates shim/meson.build and its guards exist to
      # keep main green before P1.6.1 landed. This job is added after, so a
      # missing meson.build is a broken tree, not a not-yet state -- and a
      # step that skips itself into a green result is the exact failure this
      # job was added to fix.

      - name: Cross-track conformance (spawn the C shim from the real core)
        # The real spawn_realm forks this binary onto a real socketpair at
        # fd 3; the real ShimServer applies its F_GET_SEALS probe,
        # geometry-versus-fd-size arithmetic, watermark and bad_order rules
        # to what comes back, and latches a commit into a real Scene. The
        # test's own env allowlist passes the software-rendering WLR_* names
        # through to the shim -- the runners have no GPU.
        env:
          VITRIN_C_SHIM_BIN: ${{ runner.temp }}/shim-build/vitrin-shim
        run: cargo test -p vitrin-core c_shim -- --nocapture

  sdk:
    name: sdk (Python ${{ matrix.python }} wire-client unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The floor (D8: pure Python >= 3.11) and the current latest, so a
        # 3.11-incompatible construct and a deprecation-removal both fail
        # visibly. The suite is mock-server unit tests only -- pure stdlib,
        # no vitrind, no native deps -- so it stays fast and GPU-less.
        python: ["3.11", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install vitrin-os (zero runtime deps) + pytest
        run: python -m pip install './sdk/python[dev]'

      - name: Install Pillow (independent PNG decode verification)
        # Test-only: the SDK never imports Pillow (Frame.to_png is pure
        # stdlib). One matrix leg gets the real decoder so the
        # test_to_png_decodes_with_pillow round-trip runs; the other leg
        # stays Pillow-less and proves the dependency-free path end to end
        # (that one test skips itself there).
        if: matrix.python == '3.13'
        run: python -m pip install pillow

      - name: pytest
        run: python -m pytest sdk/python/tests -q

  integration:
    name: integration (vitrind --headless + SDK tests)
    runs-on: ubuntu-latest
    # The P1.9.1 "< 10 minutes" acceptance criterion is enforced on the
    # suite step below (timeout-minutes: 10). The job-level cap is wider
    # for one reason only: the first activated run builds the workspace
    # cold (Swatinem/rust-cache has nothing saved while the steps are
    # dormant, and by default it only saves on job success), so a 10-minute
    # job cap would time out the cold build, skip the cache save, and leave
    # every retry equally cold -- the activating PR could never go green.
    # The warm-build step plus cache-on-failure below give that first run a
    # warm-up path; steady-state (warm cache) the job lands well under 10.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- Headless integration suite: activates the moment
      # tests/integration/run.sh lands. ---------------------------------
      # Entry-point contract (normative copy: tests/integration/README.md,
      # which the landing PR edits in-place and therefore cannot miss):
      # tests/integration/run.sh (bash, exit 0 = pass) spawns
      # `vitrind --headless` and drives it with the scripted Python SDK
      # tests (runner python3 is 3.12, satisfying the SDK's >=3.11 floor,
      # D8). The guard is the test entry point itself -- NOT
      # crates/vitrin-core -- because the vitrind skeleton (P1.2.x, in
      # flight on a sibling branch) predates --headless and the SDK, and
      # must not activate this job.

      - name: Guard against integration gate drift
        # If integration tests land under any entry point other than
        # tests/integration/run.sh (e.g. bare pytest), every later step
        # would skip silently and this job would stay green while running
        # nothing. Fail loudly instead.
        run: |
          if [ -d tests/integration ] && [ ! -f tests/integration/run.sh ]; then
            extra=$(find tests/integration -type f ! -name 'README.md' | head -5)
            if [ -n "$extra" ]; then
              echo "::error::tests/integration/ contains files but no run.sh -- this job's steps are gated on tests/integration/run.sh and would silently skip. See tests/integration/README.md for the entry-point contract."
              echo "$extra"
              exit 1
            fi
          fi

      - name: Install Rust (pinned toolchain + components from rust-toolchain.toml)
        if: hashFiles('tests/integration/run.sh') != ''
        run: rustup toolchain install && rustup show active-toolchain

      - name: Cache cargo
        if: hashFiles('tests/integration/run.sh') != ''
        uses: Swatinem/rust-cache@v2
        with:
          # The default saves only on job success: a first activated run
          # whose suite step fails (or overruns its 10-minute cap) would
          # save nothing and stay cold forever. cache-on-failure banks the
          # warm build below even across a red first run.
          cache-on-failure: true

      - name: Install native build deps
        # Discharges the TODO this job carried while dormant: vitrind links
        # libxkbcommon (winit backend) and libpixman-1 (headless backend,
        # P1.3.2), so `cargo build --workspace` below cannot link without
        # them ("unable to find library -lxkbcommon" / "-lpixman-1").
        # Mirrors the rust job's step; wayland and libinput are dlopen'd at
        # runtime and need no -dev package here.
        if: hashFiles('tests/integration/run.sh') != ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxkbcommon-dev libpixman-1-dev

      - name: Warm build (workspace)
        # Separates compile time from the suite's 10-minute budget: vitrind
        # is a workspace crate (crates/vitrin-core per the plan layout), so
        # this builds -- and, via the cache step above, banks -- the heavy
        # dependency tree before the timed suite step runs.
        if: hashFiles('tests/integration/run.sh') != ''
        run: cargo build --workspace

      - name: Run headless integration suite
        if: hashFiles('tests/integration/run.sh') != ''
        # The P1.9.1 acceptance criterion, machine-enforced: the suite
        # completes in < 10 minutes or this step fails.
        timeout-minutes: 10
        run: bash tests/integration/run.sh

      - name: Integration suite DORMANT
        if: hashFiles('tests/integration/run.sh') == ''
        run: |
          echo "::notice title=integration job dormant::tests/integration/run.sh has not landed yet (needs P1.3.x headless + P1.8.x SDK) -- the integration steps were skipped, not passed. This green check is vacuous until then."
          {
            echo "## integration job: DORMANT"
            echo ""
            echo "\`tests/integration/run.sh\` has not landed yet (needs P1.3.x headless +"
            echo "P1.8.x SDK), so no integration test ran -- this job's green check is"
            echo "vacuous for now. Do not add it to branch protection until it activates."
            echo "Entry-point contract: \`tests/integration/README.md\`."
          } >> "$GITHUB_STEP_SUMMARY"
