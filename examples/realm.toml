# Vitrin OS realm configuration -- the realm manager's input (P1.5.1).
#
# SPDX-License-Identifier: Apache-2.0
#
# One [[realm]] table per realm this session serves: its wire-visible id,
# and the app it owns. This file is parsed by the same deliberately strict
# TOML subset as principals.toml (see
# `crates/vitrin-core/src/toml_subset.rs` for the dialect and
# `crates/vitrin-core/src/realm.rs` for the schema and every decision
# below): comments, blank lines, [[realm]] headers, `key = "string"` and
# `key = ["a", "b"]`, `key = true` -- nothing else. Every file this subset
# accepts is valid TOML.
#
# HOW MANY TABLES: at least one, at most MAX_REALMS (16), one of them must be
# "realm-0", and at least one must autostart (see `autostart` below). The cap
# is a cardinality rule in the validator, not a format limit -- the file has
# always been an array of tables.
#
# Sixteen is argued rather than chosen by taste, and the argument has been
# re-derived three times because it was wrong twice; the current one is
# MEASURED, and it is MEMORY rather than descriptors. Each realm costs the
# core three permanent descriptors (shim socketpair, realm lock, outbox
# eventfd) plus up to sixteen staged buffer fds -- at most ~304 of the
# customary 1024 soft RLIMIT_NOFILE at the cap -- and, since per-realm scenes
# landed, TWO view-sized RGBA buffers: ~15.9 MiB per realm at 1920x1080 and
# ~31.3 MiB at 2560x1600, measured, so ~586 MiB at the cap on a large panel.
# It also costs 32 processes (one shim and one app each). The full accounting,
# with the measurements and every correction, is at MAX_REALMS in realm.rs.
#
# THE CAP IS ENFORCED IN TWO PLACES, and since WS-E.1.1 the second one is the
# reason it exists: this file is checked at load, and `vitrin_launcher.launch`
# is refused `capacity` when the session already holds MAX_REALMS realms that
# have not exited. Unbounded would make one launch grant an fd-exhaustion,
# memory-exhaustion and process-exhaustion primitive with no protocol
# violation anywhere in the trace.
#
# NOT bounded by this cap: the memory your apps and their shims use, which
# is where nearly all of a realm's real cost is. The core neither measures
# nor limits it.
#
# WHAT MORE THAN ONE REALM BUYS YOU, AND WHAT IT DOES NOT. Each realm gets
# its own shim, its own private runtime tree, its own Wayland socket, its
# own scene, its own capture and its own seat state: an agent's `observe`
# grant returns the pixels of the realm it names, visible or not, and its
# `actuate.*` grants reach that realm's app, visible or not. What the core
# still has is ONE OUTPUT, bound to one realm -- the first to attach -- so
# with several realms running only one is on screen, and the human's own
# keyboard and pointer go to whichever that is. A principal holding
# `layout.focus` moves the binding, and the picture and the human's input
# move together in one act; when the bound realm's shim session ends the
# output falls back to the first still-serving realm in id order, so a death
# does not leave you staring at a cleared scene for the rest of the session.
#
# The two rules are deliberately different and neither moves the other: the
# HUMAN's input follows attention (the bound realm), and an AGENT's follows
# its grant. So an agent can work in a realm nobody is looking at -- which
# is the point of running several -- and a human typing in one realm no
# longer mutes agents in the others. WHAT THAT NARROWS: before this, a hand
# on the keyboard suspended every agent in the session; now it suspends only
# the agents acting on the realm you are in. See docs/book/src/limits.md.
#
# One consequence to know about if you switch realms mid-gesture: a key or
# button you are physically holding when the output moves is RELEASED into
# the realm you left, because your release will be delivered to the realm
# you moved to. The app reads that release as real. The alternative is a
# modifier latched down forever in an app you can no longer see.
#
# AND WHAT IT COSTS. Every realm renders whether or not it is visible: a
# Wayland client throttles on frame callbacks, so a realm that stopped
# being paced would stop repainting and its capture would go stale, which
# the protocol forbids. Budget roughly 2 x width x height x 4 bytes of
# core-side memory per realm (~31 MiB each on a 2560x1600 panel) plus the
# app's own, and expect sixteen realms to composite at the output's rate
# with nobody looking at fifteen of them. A realm a LAUNCH created costs
# exactly the same as one this file declared.
#
# SECURITY -- this file names the program the trusted core will execute, so
# whoever can write it chooses what vitrind spawns. It is refused unless it
# is:
#   - a regular file,
#   - owned by the uid running vitrind, and
#   - not writable by group or other:  chmod go-w realm.toml
# Unlike principals.toml it may be world-READABLE: a command line is not
# secret material.
#
# The same rule is applied to what `command` names, because a hardened
# realm.toml pointing at a program anyone can overwrite protects nothing:
# the program (resolved through symlinks) must be a regular file, and it and
# every directory on its path must be owned by root or by the uid running
# vitrind and not writable by group or other. A world-writable DIRECTORY is
# accepted only with the sticky bit (/tmp-style), which is what stops a
# non-owner from swapping an entry it does not own.
#
# Conventional location: $XDG_CONFIG_HOME/vitrin/realm.toml
# (~/.config/vitrin/realm.toml). Override with `vitrind --realm PATH`.
# Startup FAILS -- loudly, naming this file and the problem -- if it is
# missing or malformed. There is deliberately no silent default: a core
# that came up with a realm nobody described would be running an app
# nobody asked for.

[[realm]]
# Optional; defaults to "realm-0". The realm's stable, wire-visible
# identity: what an agent addresses with
# `vitrin_principal.get_realm("realm-0")`, what the MVP's whole-realm grant
# scope names (`realm:realm-0`), and the directory name of the realm's
# private runtime tree ($XDG_RUNTIME_DIR/vitrin-0/<id>/).
#
# Any id is legal here (at most 64 bytes over [A-Za-z0-9._-], never "." or
# ".."), but ONE OF THE TABLES IN THIS FILE MUST BE "realm-0", and startup
# refuses a file where none is. The protocol -- not this file -- is why:
# the IDL declares "realm-0" the single well-known realm of version 1 and a
# required member at version 2, and the wire still carries no way to
# enumerate the others, so it is the one realm name a conformant client can
# know without being told. A session without it would answer every such
# client's get_realm("realm-0") petition `unavailable`, forever.
#
# One further refusal, and it only exists because ids are free-form: the
# runtime directory is FLAT, and each realm claims two entries in it -- its
# directory <id>/ and, beside it, its lock <id>.lock. So a realm named
# "foo.lock" would own realm "foo"'s lock file, and a realm named
# "core.sock" would own the core's own listener. Startup refuses both,
# naming the two ids that collide.
#
# This file names TEMPLATES; the core names INSTANCES. When
# `vitrin_launcher.launch` starts a realm from a template the core mints
# the instance's id itself (`<template>.<n>`), because uniqueness across a
# session must not be a property of a text file that also names a private
# runtime directory.
#
# That split is ENFORCED here, not merely described, and it costs two further
# refusals on the ids you may write:
#
#   - An id may not have the shape the core mints -- `<something>.<digits>`,
#     with or without a trailing `.lock`. A realm named "foo.1" would own
#     launched realm foo.1's directory, and "foo.1.lock" would own its lock.
#   - An id may be at most 43 bytes, not the wire's 64: the core has to be
#     able to append `.<number>` and still produce a realm id the wire can
#     carry.
#
# Both are refused at startup, naming the id and the reason.
#id = "realm-0"

# REQUIRED. Absolute path of the APP this realm launches, which must exist
# and pass the transitive not-writable check described above. Relative names
# are refused: they would resolve through the core's own $PATH, so what
# actually executed would depend on ambient environment this file cannot show.
#
# The core does NOT exec this program directly. It execs a core-known shim
# binary (its end of the identity socketpair placed at fd 3), and conveys this
# `command` plus `args` to the shim in argv after a `--` separator; the shim
# then serves the app-facing Wayland socket and execs the app. So this file
# names the app, never the shim: the shim is a *core* input (`vitrind --shim
# PATH`, defaulting to a sibling `vitrin-shim` beside `vitrind`) and is audited
# transitively by the same not-writable rule as `command` (issue #103).
command = "/usr/bin/foot"

# Optional (default []). Arguments AFTER argv[0] -- the core supplies
# argv[0] itself from `command`.
#args = ["-e", "bash"]

# Optional (default []). NAMES of environment variables copied from
# vitrind's own environment into the app's. Not name=value pairs: the app
# starts default-deny, and an empty or absent allowlist means it inherits
# NOTHING but what the core injects for it (its own WAYLAND_DISPLAY,
# pointing at the shim's private socket, and its runtime directory). A
# listed name that vitrind's environment does not define is simply not
# passed -- not an error, because config validity must not depend on which
# machine loads it.
#
# These names are refused here, because an app that can reach the host
# display server is not confined and that is not a config decision:
#
#   DISPLAY          addresses the host X server
#   WAYLAND_DISPLAY  addresses a Wayland server; the core injects the
#                    realm's own private socket instead
#   WAYLAND_SOCKET   is an ALREADY-CONNECTED file descriptor, which
#                    libwayland honors before WAYLAND_DISPLAY -- passing it
#                    through would connect the app straight to the host
#                    compositor and the realm's socket would never be used
#   XAUTHORITY       is the credential authenticating a host X connection
#   XDG_RUNTIME_DIR  names the host session's socket directory; the core
#                    injects the realm's own runtime directory instead
#   HOME             names a directory that DOES NOT EXIST inside a confined
#                    realm; the core injects the realm's own private storage
#                    instead. Added by P2.6.2 -- a configuration that
#                    allow-listed HOME (as this example once did) now fails
#                    to load, which is the intended noise: a host $HOME
#                    passed through would name a missing path and every app
#                    that read it would fail in a way that looks like a
#                    vitrin bug.
#env_allow = ["LANG", "XDG_SESSION_TYPE"]

# Optional (default []). Absolute host paths mounted READ-ONLY into the realm
# at the same path, at --isolation=default. Ignored at --isolation=off, where
# the realm can already see the whole filesystem.
#
# You need this when the app's runtime closure lives outside /usr, /etc and
# its own directory -- on NixOS that means /nix; for a vendored application
# tree it means whatever /opt subtree it unpacks into. Without it such an app
# does not start, and the failure looks like a missing shared library.
#
# Two things it is not:
#
#   - It is not a confinement switch. WHETHER a realm is confined is
#     `--isolation`, session-wide, so a copied [[realm]] block cannot weaken
#     one realm quietly. This key only widens what a confined realm can READ.
#   - It is not trusted from this file. Every source is re-audited at the
#     spawn against the same rule `command` gets -- a regular file or
#     directory, owned by root or by the core's uid, not group- or
#     other-writable, and the same for every directory on its resolved path.
#     A bind source holding a library or an interpreter decides what the
#     confined app RUNS, not merely what it reads.
#
# `/` and `/home` are refused outright: binding either hands the realm the
# tree the confinement exists to hide.
#binds = ["/nix/store", "/opt/vendor-app"]

# Optional (default true). Whether STARTUP forks this realm's app.
#
# `autostart = false` makes the realm a TEMPLATE: it is in the registry, it is
# addressable, an agent may petition over it -- and nothing ever runs it until
# a principal holding the `realm_launch` verb calls `vitrin_launcher.launch`,
# which forks one INSTANCE of this table's `command` under a core-minted id.
#
# Two consequences worth knowing before you write it:
#
#   - A template NEVER PAINTS. An `observe` grant over one refuses
#     `no_surface` forever. That is authority over nothing -- inert rather
#     than dangerous -- but it is a shape a confused client can reach.
#   - At least one realm in this file must autostart. A session of nothing but
#     templates comes up with no app, nothing on the output and nothing for a
#     human to look at; startup refuses it.
#
# The key does NOT decide what may be launched: any realm here names a
# program, so a launch grant over a running realm starts a second instance of
# that realm's app. It answers one question only -- does startup fork it.
#autostart = true

# A SECOND REALM is a second table, and nothing else. Every path this realm
# owns is derived from its id, so it gets its own
# $XDG_RUNTIME_DIR/vitrin-0/editor/ tree, its own lock and its own
# wayland-0 -- no extra key, no extra section. Read the cardinality note at
# the top of this file first: with WS-E.1.3 landed, each realm has its own
# scene and its own capture, so a second realm is separately observable.
#
#[[realm]]
#id = "editor"
#command = "/usr/bin/gedit"

# A TEMPLATE is the same table with one more key. Nothing runs this until a
# consented launch grant asks it to, and each launch mints a NEW realm --
# "kiosk.1", "kiosk.2", ... -- because nothing is ever relaunched.
#
#[[realm]]
#id = "kiosk"
#command = "/usr/bin/firefox"
#autostart = false

# ---------------------------------------------------------------------------
# WHAT THIS FILE CANNOT PROMISE YOU (read before trusting the list above)
# ---------------------------------------------------------------------------
#
# Everything above is ENVIRONMENT hygiene. Since P2.6.2 it is no longer the
# only confinement a realm gets -- but which confinement you get depends on a
# flag, so read both halves.
#
# At `--isolation=default`: six namespaces (user, mount, PID, IPC, UTS,
# network), an identity uid/gid map, ZERO capabilities, and a private mount
# table the app cannot reshape because it holds no capability to mount. The
# core verifies every one of those by reading the kernel's answer about the
# child, and REFUSES the spawn when it cannot. An app that ignores
# WAYLAND_DISPLAY and connects to a socket path it already knows now fails,
# because the path is not in its mount table.
#
# Since P2.6.3 the helper also enforces a Landlock ruleset before the shim's
# execve. Its grants are ENUMERATED rather than rooted at the realm root, and
# they are four tiers rather than two -- the earlier version of this comment
# collapsed them and got two paths' rights wrong, so they are spelled out:
#
#   full write (create/delete/rename/truncate)  /run/vitrin, /vitrin/home,
#                                               /tmp, /dev/shm  -- exactly the
#                                               four writable mounts above
#   WRITE_FILE only (write THROUGH an existing  /proc, /dev, /dev/pts, and each
#   file or node; no create, delete, rename or  bound render node. /dev/pts and
#   truncate)                                   the render nodes also get
#                                               IOCTL_DEV; nothing else does.
#   read + execute                              /usr, the /bin-class compat
#                                               names, the shim, the app's own
#                                               directory, every `binds` entry
#                                               below, and /tmp
#   read, NO execute                            /etc and /sys
#
# A `binds` entry naming a FILE gets read + execute WITHOUT the directory-list
# right, because Landlock refuses a rule that names LANDLOCK_ACCESS_FS_READ_DIR
# on a regular file -- the rule is rejected, not merely unused, so granting it
# would take the whole realm down. Same predicate as the mount above: a file
# source is bound onto a file target and a directory onto a directory.
#
# So a write right reaches EIGHT hierarchies, not four -- eight on a host that
# binds ONE render node, and one more for every additional node, since each is
# its own rule; /etc gets no EXECUTE;
# and /proc is read+write rather than read+execute. A `binds` entry is granted
# twice over -- once as a mount, once as a Landlock rule -- and removing it
# removes both.
#
# A REALM ALSO REFUSES NESTED USER NAMESPACES. The helper writes 0 to the
# realm's own /proc/sys/user/max_user_namespaces, so an app's
# unshare(CLONE_NEWUSER) fails ENOSPC. That removes nothing an app could
# otherwise do: a Landlock domain denies EVERY mount-topology change to the
# process and its descendants unconditionally -- it is not an access right, so
# no rule below grants it and no `binds` entry restores it -- and a nested
# namespace that cannot mount is useless. What it changes is WHICH error
# arrives: the conventional userns refusal a sandbox library already handles,
# instead of an unexpected EPERM from a mount deep inside its own setup. The
# cost is real and is published on the limits page: an app that decodes images
# inside a nested sandbox (GTK -> glycin -> bwrap) cannot have one and decodes
# UNSANDBOXED instead.
#
# P2.6.3 was ACCEPTED on 2026-08-19, on its CORRECTED criteria rather than the
# ones its plan row first wrote, so read the acceptance narrowly. The ruleset
# landed, and so did the generated ladder table and its CI staleness gate --
# `cargo
# xtask isolation-matrix` emits docs/book/src/isolation-matrix.md and `--check`
# turns CI red on a stale copy. That table probes no kernel: it states what
# THIS BUILD requires. The PER-KERNEL half landed separately on 2026-08-16 as
# docs/book/src/isolation-kernels.md (issue #281) -- five distribution kernels
# booted under QEMU with the shipped binary, reporting ABI 1, 2, 4, 6 and 7,
# three of them refused below the floor. It is a row per KERNEL and not the
# "one row per ABI actually reported" the original criteria asked for: five
# kernels answered five ABIs, and four of the nine rungs are reported by none
# of them. Every row there is a KERNEL reading taken in a bare initramfs rather
# than a distribution. The per-rung BEHAVIOURAL claims are NOT uniform, and
# docs/book/src/isolation-matrix.md counts which is which rather than leaving it
# to be inferred: rungs 1, 2, 3 and 7 are entered by tests in
# crates/vitrin-realm-init/src/main.rs, which run here and on the CI runner;
# every other rung's behaviour is derived from this build's own source and
# measured against nothing. The VALUES those tests pin were recorded on one box
# on one date.
#
# Since P2.6.4 there IS a seccomp filter, and it is a DENY-LIST -- which is a
# named-class claim and never a completeness one. It closes the
# 13 denied syscall rows that `vitrind --print-seccomp` prints, each naming
# the PRD Doc 2 section 15 escape class it answers and the errno it returns,
# and leaves the rest of the kernel's syscall surface UNENUMERATED. Treat a
# realm as FILESYSTEM-confined and FILTERED AGAINST A NAMED LIST, and not
# SYSCALL-confined. Two costs are stated rather than implied: a realm cannot
# execute a 32-bit binary on a 64-bit host (syscall numbers are per-ABI and a
# foreign ABI is killed rather than passed unfiltered), and the `ptrace` row
# breaks the pinned Firefox's crash reporter -- a path
# `tests/integration/test_real_firefox.py` does not exercise, so its green
# tick is not evidence for that row. There is no `--seccomp=off`: a kernel
# that cannot accept a filter refuses the session instead of running one
# unfiltered.
#
# Three things also survive the namespaces: the invoking user's
# supplementary groups (the kernel gives no window to drop them -- see
# D-037(5)), a read-write GPU render node, and anything a `binds` key below
# hands over.
#
# At `--isolation=off`: every word of the pre-P2.6.2 warning holds unchanged.
# The shim and the app run as vitrind's uid with vitrind's full view of the
# filesystem and the network. It must be named on the command line.
#
# EVERY TABLE YOU ADD STILL MULTIPLIES THE RESIDUE. N realms means N shims,
# and at `--isolation=off` that is N processes with the core's own uid and
# filesystem view. At `default` the multiplication is smaller but not gone:
# N realms is N syscall surfaces, N retained group sets, and N render-node
# handles. The MAX_REALMS cap bounds memory, not this.
#
# AND SINCE WS-E.1.1, N IS NO LONGER YOURS ALONE TO SET. A principal holding
# `realm_launch` over a template can add processes at run time, up to the cap
# and up to its grant's rate ceiling. Every word above applies unchanged to
# what it starts: a launch grant is authority to start a process confined
# exactly as much as this session is -- which at `--isolation=off` means an
# UNCONFINED one with the core's own uid and filesystem view, and at `default`
# means one that is path-confined and filtered against a named list of thirteen
# syscalls, which is not the same as syscall-confined. What bounds it is
# who holds the
# grant (a human approved it, naming this template's program on the card), how
# long (expiry, revocation), how often (max_event_rate) and how many
# (MAX_REALMS) -- not what the launched program may then do.
#
# The sharpest instance is the SESSION D-BUS, and it is a deliberate,
# documented hole:
#
#   - Nothing here advertises the bus: the core injects no
#     DBUS_SESSION_BUS_ADDRESS, and it points XDG_RUNTIME_DIR at the realm's
#     own private directory rather than the host session's, so a well-behaved
#     client finds nothing.
#   - But /run/user/<uid>/bus is still on the filesystem, and any process of
#     this uid can still connect to it directly. Not advertising a socket is
#     not the same as it being unreachable.
#   - Firefox -- the Phase-1 acceptance app -- wants the bus, so running it
#     in practice means adding DBUS_SESSION_BUS_ADDRESS to env_allow above.
#     That is allowed, and it makes an implicit hole an explicit one.
#
# Reaching the session bus is a lateral-escape path (D-Bus activation of a
# privileged helper -- PRD Doc 2 section 15). It is closed by pillar P13 in
# Phase 2: a loopback-only network namespace plus an empty mount namespace,
# so there is nothing to reach rather than nothing advertised. It is not
# closed by this file, and it cannot be.
#
# Full reasoning: crates/vitrin-core/src/spawn.rs and the README's security
# notes.
