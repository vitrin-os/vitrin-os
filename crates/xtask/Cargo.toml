[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
rust-version.workspace = true
description = "cargo xtask codegen [--check] -- regenerate crates/vitrin-protocol/src/generated and shim/include/vitrin-protocol.h from protocol/vitrin-v0.xml"
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow = "1"
vitrin-scanner = { path = "../vitrin-scanner" }
# The `demo` subcommand tears the core down with SIGTERM — the clean-shutdown
# signal the core's ladder runs, which writes the recorder's `run_ended`
# footer; `Child::kill` would SIGKILL and skip it. rustix's `process` feature
# is already the workspace's kill(2) path (vitrin-core, vitrin-ipc), so no new
# crate enters the tree.
rustix = { version = "1", features = ["process"] }
# The sanctioned test skip (issue #288). `skip-census` imports `MARKER` and
# `CLASSES` from the same crate the emitters use, so renaming the marker or
# adding a class cannot silently desynchronise the emitter from the census --
# there is one definition, not two. Dependency-free, and Apache-2.0 like this
# crate, which is why it had to sit on that half of the split.
vitrin-skip = { path = "../vitrin-skip" }
