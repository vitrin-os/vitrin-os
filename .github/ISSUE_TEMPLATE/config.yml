      expect.
  - name: Read the design docs first
    url: https://github.com/vitrin-os/vitrin-os/blob/main/docs/PRD.md
    about: >-
      The PRD is the canonical vision and architecture; docs/plan/ has the
      roadmap and the decision log. Many "why is it like this" questions are
      answered there with the reasoning recorded.

