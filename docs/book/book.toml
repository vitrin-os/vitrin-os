[book]
title = "Vitrin OS"
description = "Getting started with the agent-first display server, from running the demo to writing your own protocol client."
authors = ["The Vitrin OS contributors"]
language = "en"
src = "src"

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/vitrin-os/vitrin-os"
edit-url-template = "https://github.com/vitrin-os/vitrin-os/edit/main/docs/book/{path}"
site-url = "/vitrin-os/docs/"
additional-css = ["theme/vitrin.css"]

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
