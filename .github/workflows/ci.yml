name: CI

# Phase-1 pipeline (P1.9.1). Jobs mirror the components the issue names, so
# each acceptance criterion is a visible check on every PR:
#
#   rust          fmt + clippy + workspace tests (debug AND release), plus
#                 two feature slices: gpu-tests (compile-check only) and
#                 session-keymap (clippy + tests, WS-E.3.1/D-028)
#   codegen-diff  IDL schema validation + regeneration honesty (the P1.1.2
#                 contract: checked-in generated code matches vitrin-v0.xml),
#                 plus the same contract for the generated session app matrix
#                 (WS-E.4.1, issue #221: docs/book/src/session-app-matrix.md
#                 matches what `cargo xtask session-matrix` emits, so a hand
#                 edit to that page is a red build). Note what this does NOT
#                 do: a runner has no DRM device, no seat and no GPU, so CI
#                 cannot run a GUI application and cannot produce a single
#                 cell of that matrix. It checks the page is generated, and
#                 nothing about whether the measurements are current -- that
#                 is the page's own runbook, on the target machine.
#                 It carries a THIRD regeneration diff since P2.6.3 (#187):
#                 `cargo xtask isolation-matrix --check`, holding
#                 docs/book/src/isolation-matrix.md -- the Landlock ABI matrix
#                 of what this build REQUIRES of a kernel. That generator
#                 derives rather than transcribes: it parses the rung ladder
#                 out of crates/vitrin-realm-init/src/landlock.rs and the ABI
#                 floor out of that crate's lib.rs, so moving a right to
#                 another rung or re-tuning the floor without regenerating is
#                 red -- and so is deleting a published sentence the table
#                 cites. It measures no kernel and cannot: the page has to be
#                 byte-identical on a runner reporting Landlock ABI 7 and on
#                 the development box reporting 9.
#                 This job also carries `cargo xtask limits-check`, which is
#                 neither codegen nor a regeneration diff and is here because
#                 it is the other docs-honesty gate: it holds published-claim
#                 drift across docs/book/src/limits.md, README.md and
#                 site/index.html (a claim on one surface and missing from
#                 another is a red build) PLUS the code evidence behind each
#                 claim, so a page that overstates a gap fails too. If you
#                 want the answer to "what keeps the limits page honest?",
#                 it is that step. WS-E.4.4 / issue #224, and EXPLICITLY
#                 TEMPORARY pending issue #172's choice of mechanism. It
#                 holds the claims it has rows for and no others; see
#                 crates/xtask/src/limits.rs.
#   deny          the TCB dependency budget (plan risk R7, issue #201):
#                 `cargo deny check` against the checked-in deny.toml --
#                 advisories, bans (an itemised multiple-versions decision,
#                 not a blanket allow), licences derived from the NOTICE
#                 path map, and sources. Blocking, like codegen-diff.
#   drm-compile-check
#                 COMPILE ONLY: the bare-metal DRM/KMS backend (WS-E.3.2,
#                 issue #218) type-checked with `--features drm-backend`
#                 after installing the graphics dev packages, plus its
#                 device-free unit tests. A runner has no display
#                 controller and no seat, so nothing here says this
#                 backend lights a panel -- that evidence is WS-E.3.4's
#                 runbook on real hardware. Its own job, not a slice of
#                 `rust`, so the other jobs keep installing only
#                 libxkbcommon-dev + libpixman-1-dev and a feature leak
#                 into `default` still fails them loudly.
#   shim          the C side, in a container with NO Rust toolchain -- the
#                 checked-in generated header must suffice on its own. The
#                 Meson build activates automatically once shim/meson.build
#                 lands (P1.6.1).
#   sdk           the pure-Python wire client's unit tests (P1.8.x) against
#                 its scripted mock server -- no vitrind involved; the live
#                 pairing is the integration job's business.
#   integration   vitrind --headless + scripted Python SDK tests, suite
#                 hard-capped at 10 minutes. Dormant until
#                 tests/integration/run.sh lands
#                 (needs P1.3.x headless + P1.8.x SDK); hosts the M1.5
#                 gates: demo job (P1.8.4), goldens (P1.9.2), and (since
#                 P1.9.3, #46) tests/integration/test_hostile_client.py --
#                 a real hostile peer against a live vitrind, auto-picked
#                 up by run.sh's `test_*.py` discovery with no extra
#                 wiring here.
#   fuzz-smoke    P1.9.3 (#46)'s other half: short cargo-fuzz (libFuzzer)
#                 runs of fuzz/'s two targets (vitrin-protocol decode,
#                 vitrin-ipc framing) on every PR, seeded from the
#                 checked-in fuzz/corpus/ so every past regression replays
#                 on every PR. The 24 h pre-M1.5 campaign is a separate,
#                 manual, documented procedure (fuzz/README.md) -- far too
#                 slow to run here.
#   wlcs-advisory advisory xdg-shell + seat WLCS conformance run (P1.9.4,
#                 issue #47) against the GPL-3.0-only shim/wlcs/ bridge --
#                 `continue-on-error: true` AND the runner script itself
#                 always exits 0, so this NEVER gates a PR by design. See
#                 shim/wlcs/README.md for scope, the annotated pass-list,
#                 and why two independent non-blocking mechanisms exist.
#
# Everything runs on GPU-less Linux runners: pixman rendering + shm buffers
# are mandatory in CI (plan 01-phase-1-mvp.md §6 D3), and nested mode is
# never a CI dependency (§7 R1). Jobs grow with each landing epic -- extend
# this file in the PR that lands the surface a job tests.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Superseded pushes to a PR cancel the in-flight run. Pushes to main are
  # keyed per-sha instead of per-ref: GitHub keeps at most ONE pending run
  # per concurrency group and cancels an older pending run when a newer one
  # queues -- even with cancel-in-progress false -- so a ref-keyed group
  # would silently drop the CI verdict for intermediate main commits. A
  # per-sha group gives every main commit its own group and therefore a
  # complete verdict.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Fail the build on any compiler warning, matching how this workspace is
  # developed and verified locally.
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: rust (fmt, clippy, tests debug+release)
    runs-on: ubuntu-latest
    # Explicit budget (the GitHub default is 360 minutes): a looping proptest
    # regression or a wedged linker should fail in minutes, not hold the
    # job -- and, on main, the concurrency queue -- for hours.
    timeout-minutes: 30
    env:
      # This job has no C toolchain and never builds shim/, so
      # `c_shim_conforms_to_the_real_core` cannot run here. The test refuses
      # to skip itself silently under CI (see its doc comment), so the skip
      # is DECLARED rather than assumed -- which is what makes the
      # `conformance` job below the only place that check is satisfied, and
      # makes its removal a red build rather than a quiet loss of coverage.
      VITRIN_C_SHIM_CONFORMANCE_SKIP: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (pinned toolchain + components from rust-toolchain.toml)
        # rust-toolchain.toml is the single source of truth for the version
        # AND the component set (rustfmt is a runtime dependency of the
        # codegen; clippy is the lint gate below). Installing from the file
        # -- rather than a toolchain action with its own version/components
        # inputs -- means bumping the pin never needs a matching ci.yml
        # edit, and CI cannot silently run a different toolchain (or a
        # different clippy lint set) than contributors do.
        run: rustup toolchain install && rustup show active-toolchain

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install native link deps (libxkbcommon + libpixman for the vitrind Smithay backends)
        # vitrin-core's Smithay backends link two system libraries the runner
        # image lacks the -dev packages for: the nested winit backend links
        # libxkbcommon, and the headless backend's pixman software renderer
        # links libpixman-1 (P1.3.2, the GPU-less compositing path). Without
        # either -dev package cargo test/clippy would fail to link vitrind
        # ("unable to find library -lxkbcommon" / "-lpixman-1"). wayland and
        # libinput are dlopen'd at runtime, so no -dev package is needed to
        # link here.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxkbcommon-dev libpixman-1-dev

      - name: Grant unprivileged user namespaces, so the confinement tests RUN
        # Ten tests in crates/vitrin-core/src/spawn.rs spawn a REAL confined
        # realm, and each is guarded by `namespaces_available()` so a host that
        # cannot confine skips rather than fails. On a stock `ubuntu-latest`
        # that guard is always false: `apparmor_restrict_unprivileged_userns=1`
        # permits the unshare and denies the capabilities it should confer, so
        # the realm's first mount answers EACCES.
        #
        # Without this step those ten skip -- and they skip SILENTLY, because
        # the guard reports itself with `eprintln!` and `cargo test` captures
        # stderr for tests that pass. The job then prints `993 passed` while
        # having exercised none of the confinement it was extended to cover.
        # That is issue #229's failure mode exactly: a green number standing in
        # for absent evidence.
        #
        # Same remedy the integration job takes, and the same caveat: after
        # this step the runner is NOT a stock Ubuntu machine, so nothing here
        # may be cited as evidence about default-distribution behaviour.
        # #281's matrix is collected in the integration job, before its sysctl.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy (all targets)
        # --all-targets type-checks every lib/bin/test/bench target, so this
        # step doubles as the "workspace builds" gate; the explicit
        # -D warnings keeps the clippy gate intact even if the global
        # RUSTFLAGS env ever changes.
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test --workspace
        run: cargo test --workspace

      - name: cargo test --workspace --release
        # Not redundant with the debug run: assertion-related bugs are
        # release-only by nature (this crate's first shipped bug was a
        # debug_assert! compiled out in release), so the suite must pass in
        # exactly the mode where such a regression would hide.
        run: cargo test --workspace --release

      - name: vitrin-ipc dependency-light client slice
        # The workspace default feature for vitrin-ipc is `server` (the
        # calloop event-loop glue), so every step above exercises it. This
        # step guards the *other* slice: the `client`-only transport the Rust
        # SDK links must keep building and passing with no calloop pulled in,
        # or the "SDK links no compositor deps" guarantee (P1.2.2) rots
        # unnoticed. Kept scoped to the one crate that has the feature split.
        run: cargo test -p vitrin-ipc --no-default-features --features client

      - name: vitrin-core gpu-tests slice (compile-check only)
        # The real-GPU dmabuf tests (P1.3.5, the M1.5 zero-copy acceptance)
        # hide behind the `gpu-tests` feature and can never RUN on these
        # GPU-less runners — they stay env-gated on developer machines
        # (VITRIN_GPU_TESTS=1, see crates/vitrin-core/Cargo.toml). But
        # nothing else compiles that cfg combination, so without this step a
        # refactor of dmabuf/shim/mock-shim internals could land green and
        # rot the acceptance harness unnoticed. clippy type-checks without
        # linking, so the runner needs no libgbm/EGL (gbm-sys links only at
        # final-binary link time, which check/clippy skip).
        run: cargo clippy -p vitrin-core --all-targets --features gpu-tests -- -D warnings

      - name: vitrin-core session-keymap slice (clippy + tests)
        # The core's own xkb keymap (WS-E.3.1, decision D-028) hides behind
        # the `session-keymap` feature, because linking libxkbcommon into a
        # nested or headless TCB is exactly what the gate exists to prevent
        # -- every step above therefore builds WITHOUT it, and that is the
        # measurement the feature's whole cost argument rests on (`readelf -d
        # target/release/vitrind` must show no NEEDED entry matching `xkb`).
        #
        # But two of issue #217's four required unit tests -- a Shift-held
        # press resolving to `A`, and the resolve-before-update ordering --
        # cannot exist without a keymap, so they would run nowhere at all
        # without this step. Unlike the gpu-tests slice above this one really
        # RUNS the tests: libxkbcommon-dev is already installed for the
        # winit backend, the keymaps are checked-in fixtures, and none of it
        # needs a seat or a device.
        run: |
          cargo clippy -p vitrin-core --all-targets --features session-keymap -- -D warnings
          cargo test -p vitrin-core --features session-keymap

  codegen-diff:
    name: codegen-diff (IDL schema + regeneration honesty)
    # Two generators, one contract: a checked-in artifact must be
    # byte-identical to what its generator emits, so hand-editing a GENERATED
    # file fails the build. They share a job because they share the toolchain
    # install and the cargo cache, and because they fail for the same reason.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate IDL against the RELAX NG schema
        # The scanner parses with roxmltree and performs its own semantic
        # checks, but structural/dialect validation is xmllint's job
        # (CLAUDE.md names this as the protocol validation command); without
        # it, a schema-invalid vitrin-v0.xml that roxmltree tolerates would
        # land green.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
          xmllint --noout --relaxng protocol/vitrin-v0.rng protocol/vitrin-v0.xml

      - name: Install Rust (pinned toolchain + components from rust-toolchain.toml)
        # Installed from rust-toolchain.toml for the reasons documented on
        # the rust job's install step (single source of truth for version
        # and components; the codegen shells out to the pinned rustfmt).
        run: rustup toolchain install && rustup show active-toolchain

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo xtask codegen --check
        # Regenerates into a scratch dir and diffs against the checked-in
        # crates/vitrin-protocol/src/generated + shim/include/vitrin-protocol.h.
        # Fails when generated code drifts from protocol/vitrin-v0.xml.
        run: cargo xtask codegen --check

      - name: cargo xtask session-matrix --check
        # WS-E.4.1 / issue #221 acceptance criterion 1. Re-renders
        # docs/book/src/session-app-matrix.md in memory from the corpus in
        # crates/xtask/src/session_matrix.rs and compares byte-for-byte
        # against the checked-in page, so a hand edit to that page is a red
        # build and the app set cannot widen by assertion.
        #
        # THIS IS THE ONLY PART OF THAT PAGE CI CAN CHECK. A GitHub runner
        # has no DRM device, no seat and no GPU, so it cannot run `vitrind`
        # against a panel and cannot run a GUI application at all -- it
        # cannot produce a single cell. Whether the cells are still TRUE is
        # the target machine's runbook, published on the page itself.
        #
        # The generator's own gates -- above all the non-vacuity test, which
        # feeds it an application nobody executed and asserts no row is
        # emitted -- run in the `rust` job's `cargo test --workspace`,
        # because xtask is a workspace member.
        run: cargo xtask session-matrix --check

      - name: cargo xtask isolation-matrix --check
        # P2.6.3 / issue #187's second deliverable, at the scope the ABI-floor
        # decision narrowed it to. Re-renders docs/book/src/isolation-matrix.md
        # in memory and compares byte-for-byte against the checked-in page.
        #
        # Unlike session-matrix, this one is red for reasons beyond a hand
        # edit, because the generator DERIVES the page instead of transcribing
        # it: the Landlock rung ladder is parsed out of
        # crates/vitrin-realm-init/src/landlock.rs and the ABI floor and
        # ceiling out of that crate's lib.rs. So moving a right to another
        # rung, or re-tuning LANDLOCK_MIN_ABI, without regenerating is a red
        # build -- which is the point: four published surfaces print that
        # number.
        #
        # It also fails when a published sentence the table cites is deleted or
        # reworded on docs/book/src/limits.md, README.md or SECURITY.md, and
        # when a rung row names no claim or a claim is named by no row (issue
        # #187: "a row with a right and no claim, or a claim with no row, fails
        # the generator").
        #
        # THIS DOES NOT MEASURE A KERNEL, and the page says so in its own
        # words. The generator probes nothing -- it could not, and still emit
        # the same bytes on a runner reporting Landlock ABI 7 as on the
        # development box reporting 9. The per-kernel row set the plan's
        # restated criteria ask for is NOT delivered by this step; the plan
        # carries that as Correction 5.
        #
        # The generator's own gates -- including the two non-vacuity tests that
        # feed it a rung with no claim and a claim with no rung -- run in the
        # `rust` job's `cargo test --workspace`, because xtask is a workspace
        # member.
        run: cargo xtask isolation-matrix --check

      - name: cargo xtask limits-check
        # WS-E.4.4 / issue #224 acceptance criterion 1: "Changing a WS-E claim
        # on one surface and not the others FAILS SOMETHING IN CI. This is
        # text, so CI can genuinely enforce it -- unlike most of the rest of
        # this workstream."
        #
        # Three different failures, and the tool's output says which:
        #
        #   SURFACE  -- a claim is missing from one of docs/book/src/limits.md,
        #               README.md, SECURITY.md or site/index.html while the
        #               others carry it. Before this step existed, this file
        #               contained ZERO references to limits.md and nothing
        #               anywhere kept the published surfaces in agreement.
        #               (SECURITY.md joined them with #286, whose limit belongs
        #               on a reporter's triage list as much as on a reader's.)
        #   SET      -- a limit is published on the limits page that no plan
        #               document enumerates, or vice versa. The enumerating
        #               documents are a LIST (see `ENUMERATORS`): a limit's
        #               home is the plan document that owns the work which
        #               created it, and the comparison runs over their union.
        #   EVIDENCE -- a claim no longer matches the code. This is the half
        #               #224 needed and a pure cross-surface check does not
        #               have: on 2026-08-12 an audit found two of #224's own
        #               body items were false of `main` (a clipboard it said
        #               did not exist, a lock screen it said had not shipped),
        #               and three agreeing surfaces would have agreed on both.
        #               A page that OVERSTATES a gap is as dishonest as one
        #               that hides it.
        #
        # EXPLICITLY TEMPORARY. Issue #172 owns the choice of drift mechanism
        # for this repository's honesty surfaces and has not made it; this is
        # its option (b), built narrow, and crates/xtask/src/limits.rs states
        # in its own module docs what replaces it under each of #172's three
        # options. Do not grow it into a docs linter -- #172's scope note is
        # that the claim set is small, known and slow-moving.
        #
        # It reads files and writes nothing. Its own non-vacuity tests -- a
        # claim missing from a surface must fail, a claim the code contradicts
        # must fail in BOTH directions, a claim with no code evidence must be
        # refused outright -- run in the `rust` job's `cargo test --workspace`,
        # because xtask is a workspace member.
        run: cargo xtask limits-check

  deny:
    name: deny (TCB dependency budget - plan risk R7)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Blocking, in the same posture as codegen-diff above, because that is
    # what plan risk R7's mitigation claims and what issue #201 asks for. The
    # accepted cost is stated rather than discovered later: the advisories
    # check reads the RustSec database live, so a newly published advisory
    # against a crate already in the graph can turn `main` red with no PR
    # having touched anything. That is the intended behaviour of a dependency
    # budget -- the alternative is a check that only notices supply-chain
    # problems the day someone happens to edit Cargo.toml -- and the response
    # is an `[advisories] ignore` entry in deny.toml carrying a reachability
    # argument and an exit condition, which is a reviewable decision, or a
    # dependency change, which is a fix.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (pinned toolchain + components from rust-toolchain.toml)
        # Installed from rust-toolchain.toml for the reasons documented on
        # the rust job's install step (single source of truth for version
        # and components).
        run: rustup toolchain install && rustup show active-toolchain

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny (pinned)
        # Built from source with `--locked` rather than pulled from a
        # binary-installer action. Two reasons, both about what this job is:
        # it is the job that guards the trusted core's supply chain, so
        # introducing a new third-party action (and a new binary-download
        # path) to run it would be self-defeating; and `--locked` means the
        # tool's own dependency resolution is the one its authors tested.
        # Swatinem/rust-cache caches ~/.cargo/bin, so the compile is paid on
        # a cache miss, not on every run.
        #
        # The VERSION is pinned on the same reasoning as rust-toolchain.toml
        # and the smithay pin: a cargo-deny minor release can add checks or
        # change config schema, and the resulting red build would have
        # nothing to do with the PR that hit it. What is deliberately NOT
        # pinned is the advisory database -- it is fetched fresh every run,
        # which is the whole point of the advisories check.
        env:
          # The workflow-wide `RUSTFLAGS: -D warnings` is this workspace's
          # standard for OUR code and must not be applied to a third-party
          # tool we merely install: a warning in cargo-deny or in any of its
          # ~200 dependencies would fail this job for a reason that has
          # nothing to do with the dependency budget. Cleared for this step
          # only.
          RUSTFLAGS: ""
        run: cargo install cargo-deny --locked --version 0.20.2

      - name: cargo deny check
        # Runs all four checks (advisories, bans, licenses, sources) against
        # the configuration in deny.toml, which resolves the graph with
        # `all-features = true` for the two Linux targets this project
        # supports. No apt packages are needed and none are installed: this
        # step resolves cargo metadata and never compiles vitrin-core, so the
        # feature-gated system libraries (libgbm/libinput/libudev/libseat
        # under `drm-backend`) are irrelevant here -- unlike the compile-check
        # slices in the `rust` job.
        run: cargo deny check

  drm-compile-check:
    name: drm-compile-check (COMPILE ONLY - no display controller is touched)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # **This job compiles the bare-metal backend and runs its device-free unit
    # tests. It does not, and cannot, exercise it.** A GitHub runner has no DRM
    # device, no seat and no panel, so nothing here says the backend sets a
    # mode, presents a frame, or delivers a key. WS-E.3.2's acceptance is
    # explicit that no green check in this repository will ever prove that; the
    # mock-free evidence is WS-E.3.4's runbook, executed on the target machine
    # and recorded.
    #
    # A separate job rather than a slice of `rust`, and the reason is load
    # bearing: the four system libraries below would otherwise be installed for
    # every step of that job, and the thing that currently makes a `drm-backend`
    # leak into `default` fail LOUDLY is that the other jobs install only
    # libxkbcommon-dev and libpixman-1-dev. Keeping the graphics dev stack in
    # its own job keeps that machine-enforced.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (pinned toolchain + components from rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install the bare-metal dev packages
        # What each is for, because "install five -dev packages" hides that
        # they are needed at three different times:
        #
        #   libseat-dev   libseat-sys/build.rs:30 -- pkg_config().unwrap(),
        #                 so a MISSING .pc file PANICS the build script. Needed
        #                 even for `cargo clippy`, which runs build scripts.
        #   libudev-dev   libudev-sys/build.rs:38 -- the same, and #218's own
        #                 text never names this crate.
        #   libgbm-dev    #[link(name = "gbm")] in gbm-sys (link time), AND the
        #                 header smithay's own build.rs feature-probes with a
        #                 `cc` compile -- see the next step.
        #   libinput-dev  #[link(name = "input")] in input-sys (link time).
        #   libdrm-dev    NOT required by the crate graph: drm-sys ships
        #                 prebuilt bindings and drm-ffi issues its ioctls
        #                 through rustix, so nothing links libdrm. It is here
        #                 because libgbm-dev depends on it, and naming it makes
        #                 that visible rather than surprising.
        #
        # libxkbcommon-dev and libpixman-1-dev come along because `drm-backend`
        # implies `session-keymap` and the crate still contains the headless
        # backend's pixman path.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libdrm-dev libgbm-dev libinput-dev libseat-dev libudev-dev \
            libxkbcommon-dev libpixman-1-dev

      - name: vitrin-core drm-backend slice (compile-check only)
        # Exactly the invocation issue #218's acceptance criterion names. It
        # type-checks every lib/bin/test target with the feature on, which is
        # the whole of what a machine with no display controller can say about
        # this backend.
        run: cargo clippy -p vitrin-core --all-targets --features drm-backend -- -D warnings

      - name: Assert smithay's gbm probe actually ran (it fails SOFT)
        # `smithay/build.rs` feature-probes gbm by COMPILING two C files
        # (`test_gbm_bo_get_fd_for_plane.c`, `test_gbm_bo_create_with_modifiers2.c`)
        # and treats a failure as a `cargo:warning`, not an error. Measured on
        # 2026-08-09 with CC pointing at a nonexistent binary: the build stays
        # GREEN and silently loses both cfgs, selecting an older buffer-
        # allocation path inside the TCB's scanout code. "The build passed" is
        # therefore not evidence that the probe worked, which is why this step
        # exists -- it is the check `crates/vitrin-core/Cargo.toml`'s
        # `drm-backend` block asks #218's CI job to add.
        run: |
          set -euo pipefail
          for cfg in backend_gbm_has_fd_for_plane backend_gbm_has_create_with_modifiers2; do
            if ! grep -qs "cargo:rustc-cfg=feature=\"${cfg}\"" target/debug/build/smithay-*/output; then
              echo "::error::smithay's gbm probe did not set ${cfg}. The build is green anyway"
              echo "::error::because the probe fails soft, but the scanout path just silently"
              echo "::error::selected an older gbm buffer-allocation API. Check that a C"
              echo "::error::compiler and gbm.h are both present on this runner."
              exit 1
            fi
          done
          echo "both gbm probe cfgs are set: the C probe ran and found the modern API"

      - name: vitrin-core drm-backend device-free unit tests
        # The unit tests the backend carries are pure functions and source
        # assertions -- the one-output refusal, the pointer accumulator, the
        # flip-coalescing gate, and two greps that hold `redraw` to
        # `Scheduled` and the capture path off the scanout buffer. They touch
        # no device, open no seat and present nothing. Running them here is
        # the only place they run at all, since the feature is off in every
        # other job.
        #
        # FILTERED, and the filter is the point. An unfiltered run of this
        # binary also drags in `spawn::`, `session::` and
        # `shim::c_shim_conforms_to_the_real_core`, which fork real processes,
        # need a writable XDG_RUNTIME_DIR and need the built C shim -- none of
        # which this job sets up, because none of it has anything to do with a
        # display controller. That is the `rust` and `conformance` jobs' work
        # and they already do it. Unfiltered, 89 of them fail here for reasons
        # that would read as "the DRM backend is broken".
        run: |
          cargo test -p vitrin-core --features drm-backend --bin vitrind \
            -- backend::drm:: the_drm_refusal_table

  shim:
    name: shim (C header, golden frames, Meson; no Rust)
    runs-on: ubuntu-latest
    # A plain distro container, not the runner image: hosted runners ship a
    # Rust toolchain, so only a clean container can prove the acceptance
    # criterion that the shim side builds WITHOUT Rust -- i.e. the
    # checked-in generated header is sufficient on its own (the P1.1.2
    # contract). The container tag also pins the C dependency set at the
    # distro level. Once the shim exists and pins its wlroots API target,
    # this becomes a GHCR-hosted image with that exact wlroots prebuilt
    # (Dockerfile in-repo, rebuilt when it changes) -- decision recorded in
    # P1.9.1, deferred until P1.6.1 fixes the version.
    container: ubuntu:24.04
    timeout-minutes: 15
    steps:
      - name: Install C toolchain and git
        # git first, so the checkout step clones instead of falling back to
        # a tarball download.
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq gcc git ca-certificates

      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert no Rust toolchain is present
        # Machine-checks the "shim job has no Rust toolchain installed"
        # acceptance criterion instead of trusting the container to stay
        # Rust-free by accident.
        run: |
          if command -v cargo >/dev/null 2>&1 || command -v rustc >/dev/null 2>&1; then
            echo "::error::a Rust toolchain is on PATH; the shim job must build from the checked-in header alone"
            exit 1
          fi
          echo "OK: no cargo/rustc on PATH"

      - name: C header compiles standalone (shim/include/vitrin-protocol.h)
        run: gcc -std=c11 -Wall -Werror -I shim/include -c shim/tests/test_header_compiles.c -o /dev/null

      - name: C golden-frame test (Rust and C pinned to the same bytes)
        run: |
          gcc -std=c11 -Wall -Werror -I shim/include shim/tests/test_golden_frames.c -o "${RUNNER_TEMP}/golden"
          "${RUNNER_TEMP}/golden"

      # ---- Meson build: activates the moment shim/meson.build lands ------
      # (P1.6.1 is in flight on a sibling branch; step-level hashFiles
      # guards keep main green both before and after it merges. The
      # dependency list lives in shim/ci/install-deps.sh -- a file the
      # landing PR owns and must adjust to its vendored wlroots subproject's
      # exact build deps, per D11. See the header of that script.)

      - name: Guard against shim gate drift
        # If shim sources land without shim/meson.build, the Meson steps
        # below would skip silently and this job would stay green while
        # never building the shim. Fail loudly instead.
        run: |
          if [ -d shim/src ] && [ ! -f shim/meson.build ]; then
            echo "::error::shim/src exists but shim/meson.build does not -- the Meson CI steps are gated on shim/meson.build and would silently skip. Land meson.build with the sources (P1.6.1)."
            exit 1
          fi

      - name: Install Meson + wlroots subproject build dependencies
        if: hashFiles('shim/meson.build') != ''
        run: bash shim/ci/install-deps.sh

      - name: Re-assert no Rust toolchain after dependency install
        # The first assert proves the header/golden steps ran Rust-free on
        # the clean container; this one re-checks AFTER apt has installed
        # the Meson dependency set, so a future package whose dependency
        # chain drags in rustc/cargo cannot silently void the acceptance
        # criterion for the steps that actually build the shim.
        if: hashFiles('shim/meson.build') != ''
        run: |
          if command -v cargo >/dev/null 2>&1 || command -v rustc >/dev/null 2>&1; then
            echo "::error::the Meson dependency install pulled a Rust toolchain onto PATH; the shim job must build from the checked-in header alone (fix shim/ci/install-deps.sh)"
            exit 1
          fi
          echo "OK: still no cargo/rustc on PATH after dependency install"

      - name: Meson build + tests
        if: hashFiles('shim/meson.build') != ''
        run: |
          meson setup "${RUNNER_TEMP}/shim-build" shim
          meson compile -C "${RUNNER_TEMP}/shim-build"
          # --suite vitrin-shim: only this project's tests, not the vendored
          # subprojects' suites (the wlroots wrap pulls in pixman/libliftoff,
          # whose slow exhaustive tests otherwise run here and time out).
          meson test -C "${RUNNER_TEMP}/shim-build" --suite vitrin-shim --print-errorlogs

      - name: Headless acceptance (exact globals + weston-terminal blind)
        # The P1.6.1 acceptance criteria, machine-checked: wayland-info lists
        # exactly the expected globals and weston-terminal runs blind against
        # the shim without crashing or hanging it. GPU-free (pixman).
        if: hashFiles('shim/meson.build') != ''
        working-directory: shim
        run: SHIM_BIN="${RUNNER_TEMP}/shim-build/vitrin-shim" bash tests/acceptance/shim_globals_and_client.sh

      # NOTE: the name is quoted because it contains ": ", which YAML forbids
      # in a plain scalar -- unquoted, this line makes the WHOLE workflow file
      # unparseable and every job silently stops running.
      - name: "Headless acceptance (upstream link: frames, damage, pacing, backpressure)"
        # The P1.6.2 acceptance criteria, machine-checked against the WIRE by
        # a peer that spawns the shim exactly as the core does (socketpair at
        # fd 3). Deliberately Rust-free, like the rest of this job: the core
        # side of the protocol is reimplemented in C in shim/tests/mock_core.c
        # so the shim's acceptance proof never needs the workspace built.
        #
        # That reimplementation is also this job's blind spot: mock_core.c and
        # the shim were written by the same hand from the same reading of the
        # IDL, so a shared misreading passes here. The `conformance` job is
        # what closes it, by running the same C shim against the REAL Rust
        # core.
        if: hashFiles('shim/tests/acceptance/upstream_frame_path.sh') != ''
        working-directory: shim
        run: BUILD_DIR="${RUNNER_TEMP}/shim-build" bash tests/acceptance/upstream_frame_path.sh

      # NOTE: quoted for the same reason as the step above -- the name contains
      # ": ", which YAML forbids in a plain scalar.
      - name: "Headless acceptance (seat input replay: events, keymap, coordinates, origin tag)"
        # The P1.6.3 acceptance criteria, checked by three witnesses that share
        # no code: the mock core plays a scripted run of `vitrin_shim_seat`
        # events and traces each one, the shim writes its own delivery trace,
        # and a real Wayland client resolves every key through the keymap it
        # was sent. The R5 gate additionally drives a real GtkEntry -- that
        # criterion is about the toolkit's input-method layer, which no keysym
        # stream can stand in for, and the script FAILS rather than skipping it
        # under CI (libgtk-3-dev is installed by shim/ci/install-deps.sh).
        if: hashFiles('shim/tests/acceptance/seat_input_replay.sh') != ''
        working-directory: shim
        run: BUILD_DIR="${RUNNER_TEMP}/shim-build" bash tests/acceptance/seat_input_replay.sh

      # NOTE: quoted because the name contains ": " -- see the two steps above.
      - name: "Shim-only Firefox smoke (mock core: render, scroll, URL bar, globals ledger)"
        # firefox_bringup.sh is a SHIM-IN-ISOLATION unit check: real shim, real
        # Firefox, MOCK core (shim/tests/mock_core.c). Relabelled from a
        # milestone proof by P1.6.6 (issue #106) -- the M1.2 "Shim runs Firefox"
        # render proof is now the REAL-core gate in the `integration` job
        # (tests/integration/test_real_firefox.py), which boots the shipped
        # vitrind and actually fetches the browser. This step stays because it
        # still exercises the shim standalone (and asserts an ordered per-frame
        # colour sequence the poll-based SDK cannot).
        #
        # The script FAILS rather than skipping under CI unless the gap is
        # declared, which is the same rule the `conformance` job's cross-track
        # test applies to itself -- a criterion that only ever reports SKIP on
        # the machine gating merges is a criterion nobody is holding.
        #
        # THE GAP IS DECLARED HERE, DELIBERATELY, AND IT IS A REAL GAP. Firefox
        # is a 75 MB tarball fetched from Mozilla (shim/tests/firefox/fetch-esr.sh)
        # and it needs a system library set this bare ubuntu:24.04 container does
        # not fully carry -- libgtk-3-dev covers most of it, but at least
        # libasound2t64 and libseccomp2 are additionally required, and that list
        # has never been validated in this container. Turning the gate on with an
        # unvalidated dependency list would trade a known, visible gap for an
        # intermittent red nobody can reproduce locally.
        #
        # TO CLOSE IT: add the missing runtime libraries to
        # shim/ci/install-deps.sh, cache shim/.firefox keyed on
        # shim/tests/firefox/firefox-esr.pin, run fetch-esr.sh, and drop the
        # VITRIN_SKIP_FIREFOX_GATE line below. Until then the criteria are held
        # on a developer machine only, and this notice says so on every run
        # rather than letting a green tick imply otherwise.
        if: hashFiles('shim/tests/acceptance/firefox_bringup.sh') != ''
        working-directory: shim
        env:
          VITRIN_SKIP_FIREFOX_GATE: "1"
        run: |
          BUILD_DIR="${RUNNER_TEMP}/shim-build" bash tests/acceptance/firefox_bringup.sh
          echo "::notice title=P1.6.4 Firefox gate declared SKIPPED::the pinned Firefox ESR is not fetched in CI, so the render/scroll/URL-bar/globals-ledger criteria were NOT proved by this run."
          {
            echo "## shim job: P1.6.4 Firefox gate SKIPPED (declared)"
            echo ""
            echo "The pinned Firefox ESR is not fetched in this job, so **none** of"
            echo "\`firefox_bringup.sh\`'s criteria ran. They are held on a developer"
            echo "machine (see \`shim/docs/firefox.md\`). The script refuses to skip"
            echo "silently under CI; this job declares the gap with"
            echo "\`VITRIN_SKIP_FIREFOX_GATE=1\`. See the step's comment for what it"
            echo "would take to hold the gate here."
          } >> "$GITHUB_STEP_SUMMARY"

      # NOTE: quoted because the name contains ": " -- see the steps above.
      - name: "Headless acceptance (app spawn: shim forks the app, isolates it, reaps it)"
        # The P1.6.5 acceptance criteria: the shim ITSELF forks and execs the
        # app the core conveyed after `--` (until now the app was launched
        # externally), so vitrind -> vitrin-shim -> app is one process tree.
        # Machine-checked against the real process tree and the wire: the mock
        # core spawns the shim with `-- weston-terminal`, then the script
        # asserts (a) the terminal is a child of the shim, (b) its frame
        # forwards through the shim, (c) it holds none of the shim's private
        # descriptors (the core socket above all), and (d) killing the shim
        # reaps it. GPU-free (pixman); weston-terminal is installed by
        # shim/ci/install-deps.sh, so a missing binary FAILS here.
        if: hashFiles('shim/tests/acceptance/app_spawn.sh') != ''
        working-directory: shim
        run: BUILD_DIR="${RUNNER_TEMP}/shim-build" bash tests/acceptance/app_spawn.sh

      - name: Meson build DORMANT
        if: hashFiles('shim/meson.build') == ''
        run: |
          echo "::notice title=shim Meson steps dormant::shim/meson.build has not landed yet (P1.6.1) -- the Meson install/build/test steps were skipped, not passed."
          {
            echo "## shim job: Meson steps DORMANT"
            echo ""
            echo "\`shim/meson.build\` has not landed yet (P1.6.1). Only the header-compile,"
            echo "golden-frame, and no-Rust checks ran. The Meson build/test steps activate"
            echo "automatically when \`shim/meson.build\` lands; the landing PR owns"
            echo "\`shim/ci/install-deps.sh\` (see its header, decision D11)."
          } >> "$GITHUB_STEP_SUMMARY"

  wlcs-advisory:
    name: "wlcs-advisory (xdg-shell + seat, ADVISORY: never blocks a PR)"
    runs-on: ubuntu-latest
    # ADVISORY, per issue #47 ("never blocks PRs"), enforced by TWO
    # independent mechanisms on purpose (either alone is one bad rebase
    # away from silently starting to gate merges -- see shim/wlcs/
    # README.md's "Why advisory, and how that's enforced"):
    #   1. continue-on-error here, at the job level.
    #   2. shim/wlcs/run-advisory.sh itself always exits 0.
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "Install wlcs (universe package: runner binary + headers + wlcs.pc)"
        id: install-wlcs
        # `|| true` on the apt-get, not on the whole step: a package that
        # isn't installable (e.g. a future runner image drops the universe
        # pocket) is exactly the "setup failure" this job treats as a
        # skipped step, not a red job -- see the note in shim/wlcs/README.md
        # ("this suite existing at all is strictly additive information").
        run: |
          sudo apt-get update -qq
          if sudo apt-get install -y -qq wlcs; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=wlcs-advisory: wlcs package unavailable::apt could not install wlcs on this runner image; the whole job is skipping itself (this is a SETUP gap, not a test failure -- see shim/wlcs/README.md)."
          fi

      - name: Install Meson + wlroots subproject build dependencies
        # The same list the `shim` and `conformance` jobs use, from the
        # same file, so all three builds of the shim can never diverge in
        # their dependency set.
        if: steps.install-wlcs.outputs.found == 'true'
        run: sudo bash shim/ci/install-deps.sh

      - name: Build the shim + the GPL-3.0-only WLCS bridge module
        # -Dwlcs=enabled: turns a missing wlcs pkg-config dependency into a
        # loud configure error rather than a silent skip, since this job
        # already confirmed the package installed above.
        if: steps.install-wlcs.outputs.found == 'true'
        run: |
          meson setup "${RUNNER_TEMP}/shim-build" shim -Dwlcs=enabled
          meson compile -C "${RUNNER_TEMP}/shim-build"

      - name: Run the advisory WLCS suite (xdg-shell + seat scope)
        if: steps.install-wlcs.outputs.found == 'true'
        id: run-wlcs
        run: |
          WLCS_BIN="$(dpkg -L wlcs | grep -E '/wlcs/wlcs$')"
          bash shim/wlcs/run-advisory.sh \
            "$WLCS_BIN" \
            "${RUNNER_TEMP}/shim-build/vitrin-shim-wlcs.so" \
            "${RUNNER_TEMP}/wlcs-advisory-out"

      - name: Publish summary
        if: steps.install-wlcs.outputs.found == 'true' && always()
        run: |
          {
            echo "## wlcs-advisory job (issue #47, ADVISORY -- never blocks this PR)"
            echo ""
            echo '```'
            tail -20 "${RUNNER_TEMP}/wlcs-advisory-out/wlcs-run.log" || echo "(no log produced)"
            echo '```'
            echo ""
            echo "Full log and gtest XML are in the \`wlcs-advisory-results\` artifact."
            echo "See \`shim/wlcs/README.md\` for the annotated, standing pass-list this"
            echo "run's numbers should be compared against."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: steps.install-wlcs.outputs.found == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: wlcs-advisory-results
          path: ${{ runner.temp }}/wlcs-advisory-out/
          retention-days: 14

      - name: wlcs unavailable on this runner (declared skip, not a failure)
        if: steps.install-wlcs.outputs.found == 'false'
        run: |
          {
            echo "## wlcs-advisory job: SKIPPED (wlcs package unavailable)"
            echo ""
            echo "apt could not install \`wlcs\` on this runner image, so none of the"
            echo "advisory conformance suite ran. This is a setup gap on the runner,"
            echo "not a test result -- see \`shim/wlcs/README.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

  vkms-advisory:
    name: "vkms-advisory (virtual KMS capability probe, ADVISORY: never blocks a PR)"
    runs-on: ubuntu-latest
    # ADVISORY, per issue #220 decision 4, on the wlcs-advisory precedent above
    # and enforced by the SAME TWO independent mechanisms, for the same reason
    # (either alone is one bad rebase away from silently gating merges):
    #   1. continue-on-error here, at the job level.
    #   2. .github/vkms/run-advisory.sh itself always exits 0.
    #
    # WHAT THIS JOB IS FOR, and the sentence that must survive every edit:
    # it does NOT prove the DRM backend lights a panel, presents a frame, or
    # delivers an input event. GitHub runners have no display controller and no
    # seat, so no green check in this repository will ever prove those. The only
    # evidence for them is docs/drm-bringup.md, executed by a human on one
    # machine and dated. This job measures ONE thing runners can answer: whether
    # a virtual KMS device offers a usable GBM + EGL/GLES scanout path at all --
    # which issue #220 decision 5 records as UNKNOWN until measured, because
    # vkms exposes no render node. Writing a criterion about it before measuring
    # would be writing one that may never legitimately go green.
    #
    # The most dangerous artifact in #220 is a VKMS job that WORKS: a green tick
    # exercising a virtual connector under software rendering, in a repo whose
    # readers are trained to trust green ticks, will be cited as evidence the
    # backend runs on hardware. Hence the job name, the step summary and the
    # limits.md entry all carrying what it does not cover, and the word
    # "advisory" in the name itself.
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the probe's build dependencies
        # libdrm/gbm/egl/gles headers only -- the probe is ~200 lines of C and
        # links nothing from this repository. `|| true` for the same reason the
        # wlcs job uses it: a package that stops being installable on a future
        # runner image is a setup gap this job declares, not a red tick.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libdrm-dev libgbm-dev libegl-dev libgles-dev pkg-config || true

      - name: "Load vkms if available, probe it, and publish what it did and did not cover"
        # Every branch of this script writes to $GITHUB_STEP_SUMMARY -- either
        # what it exercised and what it did not, or an explicit declared skip
        # naming why. Never a silent pass. (#220 acceptance criterion 4.)
        run: bash .github/vkms/run-advisory.sh "${RUNNER_TEMP}/vkms-advisory-out"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vkms-advisory-results
          path: ${{ runner.temp }}/vkms-advisory-out/
          retention-days: 14

  conformance:
    name: conformance (real C shim against the real Rust core)
    runs-on: ubuntu-latest
    # The one job that holds BOTH toolchains, and the only reason it exists.
    # Every other check on the shim wire has a peer written by the same hand
    # in the same language: the `rust` job validates the core against
    # vitrin-mock-shim, the `shim` job validates the shim against
    # shim/tests/mock_core.c. Both pass if the two sides misread the IDL
    # identically. This job runs the real C shim, built from the generated
    # header alone, against the real core's ShimServer -- so a shared
    # misreading has nowhere left to hide.
    #
    # Deliberately NOT folded into the `rust` job: Ubuntu ships no
    # wlroots-0.19, so the Meson wrap builds it from source (D11), and that
    # cost has no business sitting in front of fmt/clippy/tests. And
    # deliberately NOT folded into the `shim` job, whose standing acceptance
    # criterion is that no Rust toolchain is on PATH.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (pinned toolchain + components from rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install native link deps (libxkbcommon + libpixman for the vitrind backends)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxkbcommon-dev libpixman-1-dev

      - name: Install Meson + wlroots subproject build dependencies
        # The same list the `shim` job uses, from the same file, so the two
        # builds of the shim can never diverge in their dependency set.
        # `sudo` because that script is written for the shim job's root
        # container; here it runs on a hosted runner.
        run: sudo bash shim/ci/install-deps.sh

      - name: Build the C shim
        run: |
          meson setup "${RUNNER_TEMP}/shim-build" shim
          meson compile -C "${RUNNER_TEMP}/shim-build"

      # No `hashFiles` gate on the three steps above, unlike the `shim`
      # job's: that job predates shim/meson.build and its guards exist to
      # keep main green before P1.6.1 landed. This job is added after, so a
      # missing meson.build is a broken tree, not a not-yet state -- and a
      # step that skips itself into a green result is the exact failure this
      # job was added to fix.

      - name: Cross-track conformance (spawn the C shim from the real core)
        # The real spawn_realm forks this binary onto a real socketpair at
        # fd 3; the real ShimServer applies its F_GET_SEALS probe,
        # geometry-versus-fd-size arithmetic, watermark and bad_order rules
        # to what comes back, and latches a commit into a real Scene. The
        # test's own env allowlist passes the software-rendering WLR_* names
        # through to the shim -- the runners have no GPU.
        env:
          VITRIN_C_SHIM_BIN: ${{ runner.temp }}/shim-build/vitrin-shim
        run: cargo test -p vitrin-core c_shim -- --nocapture

  sdk:
    name: sdk (Python ${{ matrix.python }} wire-client unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The floor (D8: pure Python >= 3.11) and the current latest, so a
        # 3.11-incompatible construct and a deprecation-removal both fail
        # visibly. The suite is mock-server unit tests only -- pure stdlib,
        # no vitrind, no native deps -- so it stays fast and GPU-less.
        python: ["3.11", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install vitrin-os (zero runtime deps) + pytest
        run: python -m pip install './sdk/python[dev]'

      - name: Install Pillow (independent PNG decode verification)
        # Test-only: the SDK never imports Pillow (Frame.to_png is pure
        # stdlib). One matrix leg gets the real decoder so the
        # test_to_png_decodes_with_pillow round-trip runs; the other leg
        # stays Pillow-less and proves the dependency-free path end to end
        # (that one test skips itself there).
        if: matrix.python == '3.13'
        run: python -m pip install pillow

      - name: pytest
        run: python -m pytest sdk/python/tests -q

  integration:
    name: integration (vitrind --headless + SDK tests)
    runs-on: ubuntu-latest
    # The P1.9.1 "< 10 minutes" acceptance criterion is enforced on the
    # suite step below (timeout-minutes: 10). The job-level cap is wider
    # for one reason only: the first activated run builds the workspace
    # cold (Swatinem/rust-cache has nothing saved while the steps are
    # dormant, and by default it only saves on job success), so a 10-minute
    # job cap would time out the cold build, skip the cache save, and leave
    # every retry equally cold -- the activating PR could never go green.
    # The warm-build step plus cache-on-failure below give that first run a
    # warm-up path; steady-state (warm cache) the job lands well under 10.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- Headless integration suite: activates the moment
      # tests/integration/run.sh lands. ---------------------------------
      # Entry-point contract (normative copy: tests/integration/README.md,
      # which the landing PR edits in-place and therefore cannot miss):
      # tests/integration/run.sh (bash, exit 0 = pass) spawns
      # `vitrind --headless` and drives it with the scripted Python SDK
      # tests (runner python3 is 3.12, satisfying the SDK's >=3.11 floor,
      # D8). The guard is the test entry point itself -- NOT
      # crates/vitrin-core -- because the vitrind skeleton (P1.2.x, in
      # flight on a sibling branch) predates --headless and the SDK, and
      # must not activate this job.

      - name: Guard against integration gate drift
        # If integration tests land under any entry point other than
        # tests/integration/run.sh (e.g. bare pytest), every later step
        # would skip silently and this job would stay green while running
        # nothing. Fail loudly instead.
        run: |
          if [ -d tests/integration ] && [ ! -f tests/integration/run.sh ]; then
            extra=$(find tests/integration -type f ! -name 'README.md' | head -5)
            if [ -n "$extra" ]; then
              echo "::error::tests/integration/ contains files but no run.sh -- this job's steps are gated on tests/integration/run.sh and would silently skip. See tests/integration/README.md for the entry-point contract."
              echo "$extra"
              exit 1
            fi
          fi

      - name: Guard against milestone-gate drift
        # The guard above asserts the entry point exists. This asserts the
        # named gates BEHIND it do. `run.sh` runs `unittest discover`, which
        # collects whatever `test_*.py` files are present -- so a milestone
        # gate that was never written, or one dropped in a later refactor, is
        # indistinguishable from a green suite: nothing collected, nothing
        # failed, exit 0. That is how a milestone gets recorded as done on
        # evidence that does not exist (issue #138).
        #
        # `run.sh` carries the authoritative lists (MILESTONE_GATES and
        # PROPERTY_GATES) and fails the same way; this runs BEFORE the build +
        # suite, so the answer arrives in seconds and does not depend on the
        # toolchain, the C shim, or a green build.
        #
        # test_real_trust_band.py is in the second list on purpose: it is a
        # mock-free real-app gate, but the property it proves (issue #139, the
        # negative half of #85) is NOT an M1.4 criterion -- plan §5 adjudicated
        # that -- so it must not appear in a check whose error text talks about
        # a milestone's evidence.
        if: hashFiles('tests/integration/run.sh') != ''
        run: |
          missing=0
          for gate in test_real_app.py test_real_capture_fidelity.py test_real_actuation.py test_real_deadman.py test_real_consent.py test_demo.py; do
            if [ ! -f "tests/integration/$gate" ]; then
              echo "::error::named milestone gate tests/integration/$gate is missing -- unittest discover would not collect it and this job would stay green with that milestone's evidence contributing nothing. Restore it, or retire it from run.sh's MILESTONE_GATES, this list, and tests/integration/README.md's gate table together."
              missing=1
            fi
          done
          # Must match run.sh's PROPERTY_GATES exactly. This list had itself
          # drifted -- it carried two of the five gates run.sh named, so the
          # guard against gate drift had silently drifted, which is the same
          # defect one level up. Edit both, and README.md's table, together.
          # It had drifted AGAIN by P2.6.2: `test_real_gestures.py` (WS-E.4.2,
          # #222) was in run.sh's list and never here. Both are named now, plus
          # `test_real_confinement.py` (#186).
          for gate in test_real_trust_band.py test_two_realms.py test_layout.py test_input_switch.py test_attention.py test_real_clipboard.py test_screenshot.py test_real_gestures.py test_real_confinement.py test_launch.py test_shell.py; do
            if [ ! -f "tests/integration/$gate" ]; then
              echo "::error::named property gate tests/integration/$gate is missing -- unittest discover would not collect it and this job would stay green with that property's evidence contributing nothing. Restore it, or retire it from run.sh's PROPERTY_GATES, this list, and tests/integration/README.md's gate table together."
              missing=1
            fi
          done
          # The warm build below always runs before run.sh, so ITS feature
          # list is the one the suite actually gets. A list that drifts from
          # run.sh's would hand the gates a binary missing a hook they depend
          # on, and every symptom of that is a confusing timeout somewhere
          # else. Assert the two agree, here, in seconds.
          expected='INJECTORS=vitrin-core/dead-man-injector,vitrin-core/consent-injector,vitrin-core/physical-input-injector'
          if ! grep -qxF "$expected" tests/integration/run.sh; then
            echo "::error::tests/integration/run.sh no longer declares '$expected'. The warm-build step in this job hard-codes that same feature list and runs first, so the two must match exactly -- update both together."
            missing=1
          fi
          exit "$missing"

      - name: Install Rust (pinned toolchain + components from rust-toolchain.toml)
        if: hashFiles('tests/integration/run.sh') != ''
        run: rustup toolchain install && rustup show active-toolchain

      - name: Cache cargo
        if: hashFiles('tests/integration/run.sh') != ''
        uses: Swatinem/rust-cache@v2
        with:
          # The default saves only on job success: a first activated run
          # whose suite step fails (or overruns its 10-minute cap) would
          # save nothing and stay cold forever. cache-on-failure banks the
          # warm build below even across a red first run.
          cache-on-failure: true

      - name: Install native build deps
        # Discharges the TODO this job carried while dormant: vitrind links
        # libxkbcommon (winit backend) and libpixman-1 (headless backend,
        # P1.3.2), so `cargo build --workspace` below cannot link without
        # them ("unable to find library -lxkbcommon" / "-lpixman-1").
        # Mirrors the rust job's step; wayland and libinput are dlopen'd at
        # runtime and need no -dev package here.
        if: hashFiles('tests/integration/run.sh') != ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxkbcommon-dev libpixman-1-dev

      - name: Install Meson + wlroots subproject build dependencies (for the real-app gate)
        # The M1.2 real-e2e gate (tests/integration/test_real_app.py, P1.9.6)
        # boots the REAL C shim and a REAL weston-terminal, so this job needs
        # the shim's build toolchain and weston. Same list, from the same
        # file, as the `conformance` and `shim` jobs, so no third build of the
        # shim can drift in its dependency set. `sudo` because the script is
        # written for the shim job's root container; here it runs on a hosted
        # runner. weston + fonts-dejavu-core (the app and its glyphs) are in
        # that list already, so the gate FAILS-not-skips on a missing app.
        if: hashFiles('tests/integration/run.sh') != ''
        run: sudo bash shim/ci/install-deps.sh

      - name: Warm build (workspace)
        # Separates compile time from the suite's 10-minute budget: vitrind
        # is a workspace crate (crates/vitrin-core per the plan layout), so
        # this builds -- and, via the cache step above, banks -- the heavy
        # dependency tree before the timed suite step runs.
        #
        # The two test-only injector features ride along, and the list must
        # match `tests/integration/run.sh`'s `INJECTORS` EXACTLY -- this step
        # always runs first, so its binary wins the race and `run.sh`'s
        # existence guard then skips rebuilding. A list that drifts here
        # silently ships the suite a `vitrind` missing a hook a gate depends
        # on (the "Guard against milestone-gate drift" step above asserts the
        # agreement in seconds):
        #   - `vitrin-core/dead-man-injector` (issue #109): otherwise no
        #     SIGUSR1 handler is installed, and `test_real_deadman.py` sends
        #     the core one.
        #   - `vitrin-core/physical-input-injector` (issue #212): otherwise
        #     `--physical-input-fd N` is an unknown argument and the core
        #     exits at parsing, so `test_input_switch.py` cannot make
        #     physical-origin input happen at all. CI has no input device and
        #     headless is the only backend it runs (D-019(4)), so this is the
        #     only way the "physical input follows the bound realm" half of
        #     #212 has a mock-free gate.
        #   - `vitrin-core/consent-injector` (issue #138): otherwise
        #     `--headless --consent=interactive --consent-injector-fd N` is
        #     refused at startup and the core `test_real_consent.py` drives
        #     never binds its socket.
        # All three features are purely additive and never enabled in a deployment
        # build (see their docs in crates/vitrin-core/Cargo.toml), so they
        # change nothing else this job builds or runs.
        if: hashFiles('tests/integration/run.sh') != ''
        run: cargo build --workspace --features vitrin-core/dead-man-injector,vitrin-core/consent-injector,vitrin-core/physical-input-injector

      - name: Build the C shim (for the real-app gate)
        # tests/integration/test_real_app.py runs the real core -> real C shim
        # -> real weston-terminal spine, with the C shim resolved from
        # VITRIN_C_SHIM_BIN (below). Ubuntu ships no wlroots-0.19, so the Meson
        # wrap builds it from source (D11) -- untimed here, outside the suite's
        # 10-minute cap, the same arrangement the warm build has. Copied from
        # the `conformance` job's recipe.
        if: hashFiles('tests/integration/run.sh') != ''
        run: |
          meson setup "${RUNNER_TEMP}/shim-build" shim
          meson compile -C "${RUNNER_TEMP}/shim-build"

      - name: What confinement this runner actually grants (diagnostic, never fails)
        # Why this exists, and why it prints rather than asserts.
        #
        # P2.6.2's first CI run died with every realm spawn refused: the
        # helper's first mount, `mount(NULL, "/", NULL, MS_REC|MS_PRIVATE,
        # NULL)`, returned EPERM on this runner while returning 0 on the
        # maintainer's Arch box (AppArmor compiled out). The isolation
        # preflight cleared the machine anyway, because it measured that a
        # user namespace could be *created* and never that a mount *inside*
        # one succeeds -- the two answers differ here.
        #
        # The preflight now probes the mount too, so a runner like this one
        # gets a named refusal with a remedy instead of a raw errno. That
        # makes this step diagnostic rather than load-bearing: it records
        # WHICH knob explains the answer, which the refusal text needs and
        # which issue #281's multi-kernel matrix wants collected from every
        # kernel CI touches. `--print-isolation` is the preflight's own
        # matrix, so the log carries the measurement and the raw evidence for
        # it side by side and either can falsify the other.
        #
        # It must never fail the job: a diagnostic that can turn a PR red
        # stops being a diagnostic and becomes a second gate nobody declared.
        if: hashFiles('tests/integration/run.sh') != ''
        continue-on-error: true
        run: |
          set +e
          echo "=== kernel ==="
          uname -srvm
          echo "=== the three knobs the preflight reads for its remedy text ==="
          for k in /proc/sys/user/max_user_namespaces \
                   /proc/sys/kernel/unprivileged_userns_clone \
                   /proc/sys/kernel/apparmor_restrict_unprivileged_userns; do
            printf '%s = %s\n' "$k" "$(cat "$k" 2>/dev/null || echo '<absent>')"
          done
          echo "=== AppArmor ==="
          printf 'module enabled = %s\n' \
            "$(cat /sys/module/apparmor/parameters/enabled 2>/dev/null || echo '<absent>')"
          printf 'this process    = %s\n' \
            "$(cat /proc/self/attr/current 2>/dev/null || echo '<absent>')"
          echo "=== the minimal repro: create a userns+mountns, then mount in it ==="
          # Two separable questions, deliberately asked as two commands: does
          # the unshare succeed, and does a mount inside it succeed? The CI
          # failure was "yes, then no", which is exactly the pair the old
          # preflight could not distinguish.
          unshare --user --map-root-user --mount true \
            && echo "unshare(CLONE_NEWUSER|CLONE_NEWNS): OK" \
            || echo "unshare(CLONE_NEWUSER|CLONE_NEWNS): FAILED rc=$?"
          unshare --user --map-root-user --mount \
            sh -c 'mount --make-rprivate / && echo "mount MS_REC|MS_PRIVATE /: OK"' \
            || echo "mount MS_REC|MS_PRIVATE /: FAILED rc=$?"
          echo "=== vitrind --print-isolation (the preflight's own matrix) ==="
          if [ -x target/debug/vitrind ]; then
            target/debug/vitrind --print-isolation || echo "(exited $?)"
          else
            echo "(target/debug/vitrind not built at this point in the job)"
          fi
          exit 0

      - name: Grant unprivileged user namespaces, and say what that costs
        # The step above measures a stock `ubuntu-latest`, and the measurement
        # is: `apparmor_restrict_unprivileged_userns=1`, so the unshare is
        # permitted, the capabilities it should confer are stripped, and the
        # first mount inside the namespace answers EACCES. `vitrind` therefore
        # refuses to start -- correctly, with a remedy naming this sysctl.
        #
        # Taking that remedy is what lets this job exercise the confinement
        # path at all. The alternative, `--isolation=off`, would keep the suite
        # green while testing an unconfined session, which is the one outcome
        # worth less than a red check.
        #
        # What it costs, said here because a sysctl in CI is exactly the kind
        # of thing that quietly becomes a lie: **after this step, this runner
        # is no longer a stock `ubuntu-latest` image.** (Named by its runner
        # label, not by a distribution release: the diagnostic above reads
        # `uname`, three sysctls and AppArmor's state, and never opens
        # /etc/os-release, so no release number here would be a measurement.)
        # Nothing downstream of it
        # may be cited as evidence about how vitrind behaves on a default
        # desktop install, and in particular issue #281's multi-kernel matrix
        # must be collected from the diagnostic step ABOVE this one, never
        # below it. The ordering is the whole point: the log carries the
        # untouched machine first and the modified one second.
        if: hashFiles('tests/integration/run.sh') != ''
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          echo "=== vitrind --print-isolation, on the machine as now modified ==="
          if [ -x target/debug/vitrind ]; then
            target/debug/vitrind --print-isolation || echo "(exited $?)"
          fi

      - name: Run headless integration suite
        if: hashFiles('tests/integration/run.sh') != ''
        # The P1.9.1 acceptance criterion, machine-enforced: the suite
        # completes in < 10 minutes or this step fails.
        timeout-minutes: 10
        # VITRIN_C_SHIM_BIN activates the M1.2 real-app gate (P1.9.6): with it
        # set, test_real_app.py runs the real chain and, being CI, FAILS rather
        # than skips if the shim or weston-terminal is missing. Unset (a
        # developer without a built C shim) it skips itself. The variable name
        # matches the `conformance` job and crates/vitrin-core/src/shim.rs's
        # own cross-track test, deliberately -- one knob for "a real C shim is
        # available here".
        env:
          VITRIN_C_SHIM_BIN: ${{ runner.temp }}/shim-build/vitrin-shim
          # ...and this makes the line above load-bearing rather than hopeful.
          # Setting VITRIN_C_SHIM_BIN only means the ladder CAN run; it does not
          # mean it DID. If the "Build the C shim" step above ever produces
          # nothing at that path, every real-app module skips itself and this
          # job stays green having collected none of the evidence the
          # milestones are cited on -- 97 tests, 25 skipped, exit 0, identical
          # to a full pass in everything CI looks at. That is issue #229, and
          # it already cost one brand-new gate (#212's test_input_switch.py)
          # its entire first life: authored, "verified", never once executed.
          # With this set, run.sh refuses to report a skipped ladder as a pass.
          VITRIN_REQUIRE_REAL_APPS: 1
          # The GTK rung (test_real_gtk.py) runs here: shim/ci/install-deps.sh
          # installs libgtk-3-dev, so the shim build above produced
          # gtk-entry-probe beside vitrin-shim, and the gate resolves it as a
          # sibling of VITRIN_C_SHIM_BIN. The M1.3 exit gate
          # (test_real_capture_fidelity.py, P1.8.5) runs here under the same
          # knob: its solid-client is co-built with the shim (a VITRIN_C_SHIM_BIN
          # sibling) and its vitrin-golden-cmp SSIM tool is built by the warm
          # `cargo build --workspace` above -- no extra CI wiring. The M1.4
          # actuation gate (test_real_actuation.py, P1.8.6) also runs here: its
          # click-target is a co-built shim sibling and its text rung reuses
          # gtk-entry-probe. The trusted-band property gate
          # (test_real_trust_band.py, issue #139) adds NO new CI wiring at all:
          # it reuses that same click-target and rides the consent-injector
          # feature the warm build already passes. The M1.5 gate
          # (test_demo.py, #110) is the same story with a fourth sibling:
          # its app is `form-target`, built unconditionally by the shim build
          # above -- no toolkit dependency, unlike gtk-entry-probe -- and
          # resolved as a VITRIN_C_SHIM_BIN sibling. Unlike weston-terminal it
          # is NOT a distro package, so a missing one is a build error and the
          # gate fails rather than skipping. The Firefox rung (test_real_firefox.py)
          # does NOT run here -- the pinned ESR is a 75 MB download this step
          # does not fetch -- so it is skipped for this suite and held by its
          # own dedicated step below, which fetches Firefox first. Without this
          # the Firefox gate would (correctly) FAIL here, VITRIN_C_SHIM_BIN
          # being set, on a browser this step never provided.
          VITRIN_SKIP_FIREFOX_GATE: "1"
        run: bash tests/integration/run.sh

      # ---- Firefox real-core render gate: the M1.2 "Shim runs Firefox"
      # render proof under the REAL core (P1.6.6). ------------------------
      # Separate from the suite above because it is HEAVY (Firefox on software
      # WebRender) and needs the 75 MB pinned ESR the suite does not fetch. It
      # is the real-core counterpart to the shim job's mock-core
      # firefox_bringup.sh -- and, unlike that declared-skip step, it actually
      # fetches the browser and runs, so the render + globals-ledger criteria
      # are held in CI rather than only on a developer machine.
      - name: Cache the pinned Firefox ESR
        if: hashFiles('tests/integration/run.sh') != ''
        uses: actions/cache@v4
        with:
          # Keyed on the pin: a new firefox-esr.pin (a deliberate ESR bump)
          # invalidates the cache and re-fetches, exactly as intended.
          path: shim/.firefox
          key: firefox-esr-${{ hashFiles('shim/tests/firefox/firefox-esr.pin') }}

      - name: "Firefox real-core render gate (real vitrind -> real vitrin-shim -> Firefox)"
        # tests/integration/test_real_firefox.py boots the shipped vitrind ->
        # the built C shim -> the pinned Firefox and asserts a real Firefox
        # frame of a solid-colour file:// page is captured with the served
        # colour dominant, plus that Firefox demanded no global outside
        # shim/docs/firefox-refused-globals.txt. VITRIN_C_SHIM_BIN is set and
        # VITRIN_SKIP_FIREFOX_GATE is NOT, so it FAILS-not-skips if the shim or
        # the browser is missing -- the firefox_bringup.sh discipline, now with
        # the browser actually fetched. The extra apt packages are Firefox's
        # runtime libraries beyond the libgtk-3 the shim deps already install;
        # if a future ESR needs more, this step fails loudly naming the missing
        # library, which is the gap-closing procedure, not a silent skip.
        if: hashFiles('tests/integration/run.sh') != ''
        env:
          VITRIN_C_SHIM_BIN: ${{ runner.temp }}/shim-build/vitrin-shim
        run: |
          sudo apt-get install -y -qq libasound2t64 libdbus-glib-1-2 libseccomp2
          bash shim/tests/firefox/fetch-esr.sh
          PYTHONPATH="$PWD/sdk/python/src" VITRIN_REPO="$PWD" \
            python3 -m unittest discover -s tests/integration -p 'test_real_firefox.py' -v

      - name: Integration suite DORMANT
        if: hashFiles('tests/integration/run.sh') == ''
        run: |
          echo "::notice title=integration job dormant::tests/integration/run.sh has not landed yet (needs P1.3.x headless + P1.8.x SDK) -- the integration steps were skipped, not passed. This green check is vacuous until then."
          {
            echo "## integration job: DORMANT"
            echo ""
            echo "\`tests/integration/run.sh\` has not landed yet (needs P1.3.x headless +"
            echo "P1.8.x SDK), so no integration test ran -- this job's green check is"
            echo "vacuous for now. Do not add it to branch protection until it activates."
            echo "Entry-point contract: \`tests/integration/README.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

  fuzz-smoke:
    # Quoted: the ": " inside the parenthetical would otherwise open a
    # nested mapping, per the same YAML gotcha the shim job's "Headless
    # acceptance" step names call out.
    name: "fuzz-smoke (cargo-fuzz: protocol_decode, ipc_framing)"
    runs-on: ubuntu-latest
    # Cold (no Swatinem/rust-cache hit yet): compiling libfuzzer-sys plus
    # this workspace's two decoder crates, twice (once per target), can run
    # a couple of minutes before the first `-max_total_time` second is even
    # spent. Warm, this job is fast -- the budget below is for the cold case.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (pinned toolchain + components from rust-toolchain.toml)
        # Same pin as every other job (single source of truth, see the
        # `rust` job's install step): `fuzz/` is deliberately its own cargo
        # workspace (fuzz/README.md), not a member of the root one, but
        # rustup resolves the toolchain by walking up from the cwd, so the
        # root `rust-toolchain.toml` still governs it. `--sanitizer none`
        # (below) is exactly what keeps that true -- plain ASan-instrumented
        # cargo-fuzz needs a nightly toolchain this repo does not pin.
        run: rustup toolchain install && rustup show active-toolchain

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # fuzz/ is its own workspace with its own lockfile and target dir
          # (fuzz/target, cargo-fuzz's default) -- named explicitly so this
          # cache slot never collides with (or gets evicted by) the root
          # workspace's, which every other job populates.
          workspaces: "fuzz -> target"

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: cargo fuzz build (--sanitizer none; see fuzz/README.md "Why --sanitizer none")
        run: |
          cargo fuzz build --sanitizer none protocol_decode
          cargo fuzz build --sanitizer none ipc_framing

      - name: Seed-corpus reachability (fuzz/ is its own workspace, so `cargo test` must be run in it)
        # WS-E.2.1 (#213). `fuzz/` is deliberately NOT a member of the root
        # workspace, so `cargo test --workspace` never collected
        # `fuzz/tests/seed_corpus_reachability.rs` and no job ran it here
        # either -- the exact "a gate whose absence is invisible" shape #229
        # names. It had been failing on `main`: `protocol_decode.rs`'s
        # `DECODERS` table had drifted out of IDL declaration order, so
        # `attach_with_fd` -- the one seed that exercises the fd path -- was
        # handing its fd to `get_seat` and dying on `FdCountMismatch` before it
        # reached a single byte of `attach`.
        #
        # `--check` first, so a stale generator is a clear message rather than a
        # confusing test failure; then the real-decoder proof.
        run: |
          python3 fuzz/seed_corpus.py --check
          cargo test --manifest-path fuzz/Cargo.toml

      - name: Replay the checked-in seed corpus (every past regression stays a permanent test)
        # One file at a time, never a directory: a directory argument is
        # libFuzzer's corpus-to-GROW, and this step must only replay the
        # curated set fuzz/corpus/<target>/ already holds, never write to
        # it (fuzz/README.md's "Running locally" note on why every command
        # here is careful about this).
        run: |
          for target in protocol_decode ipc_framing; do
            for seed in fuzz/corpus/"$target"/*; do
              echo "== replaying $seed =="
              cargo fuzz run --sanitizer none "$target" "$seed"
            done
          done

      - name: Short fuzzing burst (60s/target, seeded from the checked-in corpus)
        # The per-PR half of the P1.9.3 fuzzing story; the 24 h clean-run
        # acceptance criterion is a separate, manual, pre-M1.5 procedure
        # (fuzz/README.md's "24-hour pre-M1.5 campaign" section) -- far too
        # slow to run here. Each target gets its own scratch corpus
        # ($RUNNER_TEMP, wiped with the runner) as the directory libFuzzer
        # is allowed to grow; fuzz/corpus/<target> is passed only as a
        # second, read-seed-only argument, so this step can never dirty the
        # checked-in corpus.
        run: |
          for target in protocol_decode ipc_framing; do
            scratch="${RUNNER_TEMP}/fuzz-scratch-${target}"
            mkdir -p "$scratch"
            cargo fuzz run --sanitizer none "$target" "$scratch" fuzz/corpus/"$target" -- \
              -max_total_time=60 -print_final_stats=1
          done
