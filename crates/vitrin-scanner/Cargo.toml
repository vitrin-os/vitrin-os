[package]
name = "vitrin-scanner"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
rust-version.workspace = true
description = "Code generator: protocol/vitrin-v0.xml -> Rust (crates/vitrin-protocol) + C header (shim/include)"
publish = false

[lib]
name = "vitrin_scanner"
path = "src/lib.rs"

[[bin]]
name = "vitrin-scanner"
path = "src/main.rs"

[dependencies]
roxmltree = "0.21"
regex = "1"
anyhow = "1"
