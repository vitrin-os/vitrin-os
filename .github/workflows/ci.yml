name: CI

# Phase-1 pipeline (P1.9.1). Jobs mirror the components the issue names, so
# each acceptance criterion is a visible check on every PR:
#
#   rust          fmt + clippy + workspace tests (debug AND release), plus
#                 three feature slices: gpu-tests (compile-check only),
#                 session-keymap (clippy + tests, WS-E.3.1/D-028) and the
#                 consent-injector/physical-input-injector pair (seven tests
#                 that, until #288, were compiled by no job at all).
#                 It also carries the two CI-side halves of issue #288's
#                 skip mechanism -- the primary half is a type, in
#                 crates/vitrin-skip, and does its work at compile time.
#                 `cargo xtask skip-scan` is the second line of defence: a
#                 source scan holding every `#[test]` body to the sanctioned
#                 skip macro, holding each named job's own env block to the
#                 require-variables it is claimed to declare (the check is
#                 job-scoped, so MOVING a declaration to a job that enforces
#                 nothing is red, not green, and so is assigning one as a
#                 shell prefix on a single command), and holding every
#                 `#[test]` in the tree to a CI step that compiles AND runs
#                 it -- including one `#[cfg_attr(<cond>, ignore)]` would
#                 ignore everywhere. `cargo
#                 xtask skip-census` wraps the debug test run, fails on a skip
#                 nobody has justified, and refuses to claim anything at all
#                 over a run that executed fewer tests than its declared
#                 floor. This job's `env:` block is where the runner DECLARES
#                 what it can do (namespaces, host tooling, a Landlock ABI
#                 floor); a skip in a declared class is a red test rather
#                 than a quiet pass. What none of it closes is enumerated in
#                 crates/vitrin-skip/src/lib.rs, "What this does NOT close".
#   codegen-diff  IDL schema validation + regeneration honesty (the P1.1.2
#                 contract: checked-in generated code matches vitrin-v0.xml),
#                 plus the same contract for the generated session app matrix
#                 (WS-E.4.1, issue #221: docs/book/src/session-app-matrix.md
#                 matches what `cargo xtask session-matrix` emits, so a hand
#                 edit to that page is a red build). Note what this does NOT
#                 do: a runner has no DRM device, no seat and no GPU, so CI
#                 cannot run a GUI application and cannot produce a single
#                 cell of that matrix. It checks the page is generated, and
#                 nothing about whether the measurements are current -- that
#                 is the page's own runbook, on the target machine.
#                 It carries a THIRD regeneration diff since P2.6.3 (#187):
#                 `cargo xtask isolation-matrix --check`, holding
#                 docs/book/src/isolation-matrix.md -- the Landlock ABI matrix
#                 of what this build REQUIRES of a kernel. That generator
#                 derives rather than transcribes: it parses the rung ladder
#                 out of crates/vitrin-realm-init/src/landlock.rs and the ABI
#                 floor out of that crate's lib.rs, so moving a right to
#                 another rung or re-tuning the floor without regenerating is
#                 red -- and so is deleting a published sentence the table
#                 cites. It measures no kernel and cannot: the page has to be
#                 byte-identical on a runner reporting Landlock ABI 7 and on
#                 the development box reporting 9.
#                 A FOURTH regeneration diff arrived with #281:
#                 `cargo xtask kernel-matrix --check`, holding
#                 docs/book/src/isolation-kernels.md against the boot rows in
#                 tests/kernel-matrix/rows/. Those rows ARE per-kernel
#                 measurements -- the shipped vitrind's own output on five
#                 pinned distribution kernels booted under QEMU -- but this
#                 step boots nothing: it holds the PAGE to the ROWS. Holding
#                 the ROWS to the KERNELS is tests/kernel-matrix/collect.sh
#                 --check, which lives in .github/workflows/kernel-matrix.yml
#                 and runs on a schedule and on demand, never on a pull
#                 request. Do not read a green codegen-diff as evidence that
#                 those kernels still answer that way; read the collection
#                 date the page prints.
#                 This job also carries `cargo xtask limits-check`, which is
#                 neither codegen nor a regeneration diff and is here because
#                 it is the other docs-honesty gate: it holds published-claim
#                 drift across docs/book/src/limits.md, README.md and
#                 site/index.html (a claim on one surface and missing from
#                 another is a red build) PLUS the code evidence behind each
#                 claim, so a page that overstates a gap fails too. If you
#                 want the answer to "what keeps the limits page honest?",
#                 it is that step. WS-E.4.4 / issue #224, and EXPLICITLY
#                 TEMPORARY pending issue #172's choice of mechanism. It
#                 holds the claims it has rows for and no others; see
#                 crates/xtask/src/limits.rs.
#   deny          the TCB dependency budget (plan risk R7, issue #201):
#                 `cargo deny check` against the checked-in deny.toml --
#                 advisories, bans (an itemised multiple-versions decision,
#                 not a blanket allow), licences derived from the NOTICE
#                 path map, and sources. Blocking, like codegen-diff.
#   drm-compile-check
#                 COMPILE ONLY: the bare-metal DRM/KMS backend (WS-E.3.2,
#                 issue #218) type-checked with `--features drm-backend`
#                 after installing the graphics dev packages, plus its
#                 device-free unit tests. A runner has no display
#                 controller and no seat, so nothing here says this
#                 backend lights a panel -- that evidence is WS-E.3.4's
#                 runbook on real hardware. Its own job, not a slice of
#                 `rust`, so the other jobs keep installing only
#                 libxkbcommon-dev + libpixman-1-dev and a feature leak
#                 into `default` still fails them loudly.
#   shim          the C side, in a container with NO Rust toolchain -- the
#                 checked-in generated header must suffice on its own. The
#                 Meson build activates automatically once shim/meson.build
#                 lands (P1.6.1).
#   sdk           the pure-Python wire client's unit tests (P1.8.x) against
#                 its scripted mock server -- no vitrind involved; the live
#                 pairing is the integration job's business.
#   integration   vitrind --headless + scripted Python SDK tests, suite
#                 hard-capped at 10 minutes. Dormant until
#                 tests/integration/run.sh lands
#                 (needs P1.3.x headless + P1.8.x SDK); hosts the M1.5
#                 gates: demo job (P1.8.4), goldens (P1.9.2), and (since
#                 P1.9.3, #46) tests/integration/test_hostile_client.py --
#                 a real hostile peer against a live vitrind, auto-picked
#                 up by run.sh's `test_*.py` discovery with no extra
#                 wiring here.
#   apparmor-profile
#                 the ONLY job here that runs on a runner it does not
#                 modify (issue #286). Every other job that needs a user
#                 namespace takes the
#                 `kernel.apparmor_restrict_unprivileged_userns=0` sysctl
#                 vitrind's own preflight prints; this one refuses to start
#                 unless that knob still reads 1, then installs
#                 packaging/apparmor/vitrind, loads it, spawns a real realm,
#                 runs the real-app confinement gate under it, and finally
#                 REMOVES the profile and requires the spawn to fail again.
#                 That last half is the whole job: without it, every green
#                 result is equally explained by a runner whose policy
#                 drifted. The profile's author never loaded it (his box has
#                 AppArmor compiled out), so this job is the deliverable and
#                 the profile is what it measures -- do not read a green check
#                 here as anything broader than one runner, one kernel, one
#                 image. Nobody has loaded it on an INSTALLED Ubuntu system,
#                 and nothing outside this job installs it at all (issue #293).
#   fuzz-smoke    P1.9.3 (#46)'s other half: short cargo-fuzz (libFuzzer)
#                 runs of fuzz/'s two targets (vitrin-protocol decode,
#                 vitrin-ipc framing) on every PR, seeded from the
#                 checked-in fuzz/corpus/ so every past regression replays
#                 on every PR. The 24 h pre-M1.5 campaign is a separate,
#                 manual, documented procedure (fuzz/README.md) -- far too
#                 slow to run here.
#   wlcs-advisory advisory xdg-shell + seat WLCS conformance run (P1.9.4,
#                 issue #47) against the GPL-3.0-only shim/wlcs/ bridge --
#                 `continue-on-error: true` AND the runner script itself
#                 always exits 0, so this NEVER gates a PR by design. See
#                 shim/wlcs/README.md for scope, the annotated pass-list,
#                 and why two independent non-blocking mechanisms exist.
#
# Everything runs on GPU-less Linux runners: pixman rendering + shm buffers
# are mandatory in CI (plan 01-phase-1-mvp.md §6 D3), and nested mode is
# never a CI dependency (§7 R1). Jobs grow with each landing epic -- extend
# this file in the PR that lands the surface a job tests.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Superseded pushes to a PR cancel the in-flight run. Pushes to main are
  # keyed per-sha instead of per-ref: GitHub keeps at most ONE pending run
  # per concurrency group and cancels an older pending run when a newer one
  # queues -- even with cancel-in-progress false -- so a ref-keyed group
  # would silently drop the CI verdict for intermediate main commits. A
  # per-sha group gives every main commit its own group and therefore a
  # complete verdict.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Fail the build on any compiler warning, matching how this workspace is
  # developed and verified locally.
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: rust (fmt, clippy, tests debug+release)
    runs-on: ubuntu-latest
    # Explicit budget (the GitHub default is 360 minutes): a looping proptest
    # regression or a wedged linker should fail in minutes, not hold the
    # job -- and, on main, the concurrency queue -- for hours.
    timeout-minutes: 30
    env:
      # ---- what this runner is DECLARED able to do (issue #288) -----------
      #
      # `crates/vitrin-skip` turns a skip into a PANIC for any class this
      # machine claims it can satisfy. That is the asymmetry the mechanism is
      # built on: a developer whose kernel cannot confine still gets a skip,
      # and CI -- which can, after the sysctl step below -- gets a red test
      # instead of a green job that measured nothing. Every variable here is
      # a claim about THIS runner, so each one is a thing that must be true
      # for the job to be honest, not a knob to quieten a failure.
      #
      # They belong in THIS block and nowhere else. `cargo xtask skip-scan`
      # reads the env blocks and holds them, per job, to CI_DECLARATIONS in
      # crates/xtask/src/skip_census.rs -- and it also fails on any of these
      # names assigned in shell (`run: VITRIN_REQUIRE_CONFINEMENT=0 cargo
      # test ...`), because that spelling would apply to one command, leave
      # this block reading "1", and switch the enforcement off for exactly
      # the step that needed it.
      #
      # The six namespaces a confined realm spawn asks for. True only AFTER
      # the `Grant unprivileged user namespaces` step below takes the remedy
      # vitrind's own preflight prints -- which is exactly the dependency
      # this is meant to expose: a runner image that stops permitting that
      # sysctl must turn this job RED rather than green-and-empty.
      VITRIN_REQUIRE_CONFINEMENT: "1"
      # /usr/bin/env, and a build directory with a bindable ancestor. Both
      # hold on this image; both would otherwise start skipping after an
      # unrelated change (a slimmer image, a CARGO_TARGET_DIR move) with no
      # other symptom at all.
      VITRIN_REQUIRE_HOST_TOOLING: "1"
      # The Landlock ABI this runner was MEASURED at: `landlock.abi=7` on
      # 2026-08-14, kernel 6.17.0-1020-azure, recorded in
      # docs/book/src/limits.md. A floor, not a flag: every rung at or below
      # 7 must run, and a measurement needing a rung above 7 is an honest
      # kernel limit and still skips. Seven is
      # above this build's startup floor of 6 (`LANDLOCK_MIN_ABI` in
      # crates/vitrin-realm-init/src/lib.rs), so a
      # runner that dropped to 6 would still start vitrind and would make this
      # floor red on its own, while a runner below 6 could not start vitrind at
      # all and the integration job would be red for that second reason. That
      # relationship is CHECKED, not recalled -- this comment read "also this
      # build's own startup floor" for three days after the floor was lowered
      # to 6, so `the_declared_landlock_abi_states_its_real_relation_to_the_build_floor`
      # in crates/xtask/src/skip_census.rs now reads the constant and requires
      # the clause above here and in CI_DECLARATIONS. **Change this
      # number when the runner image changes, and only against a fresh
      # measurement** -- it is a claim about a machine, not about this code.
      VITRIN_REQUIRE_LANDLOCK_ABI: "7"
      # This job has no C toolchain and never builds shim/, so
      # `c_shim_conforms_to_the_real_core` cannot run here. The test refuses
      # to skip itself silently under CI (see its doc comment), so the skip
      # is DECLARED rather than assumed -- which is what makes the
      # `conformance` job below the only place that check is satisfied, and
      # makes its removal a red build rather than a quiet loss of coverage.
      # This is the one variable here that EXCUSES rather than requires
      # (`vitrin_skip::Require::UnderCiUnlessDeclared`), and the skip it
      # excuses still prints its marker line into the census below.
      VITRIN_C_SHIM_CONFORMANCE_SKIP: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (pinned toolchain + components from rust-toolchain.toml)
        # rust-toolchain.toml is the single source of truth for the version
        # AND the component set (rustfmt is a runtime dependency of the
        # codegen; clippy is the lint gate below). Installing from the file
        # -- rather than a toolchain action with its own version/components
        # inputs -- means bumping the pin never needs a matching ci.yml
        # edit, and CI cannot silently run a different toolchain (or a
        # different clippy lint set) than contributors do.
        run: rustup toolchain install && rustup show active-toolchain

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install native link deps (libxkbcommon + libpixman for the vitrind Smithay backends)
        # vitrin-core's Smithay backends link two system libraries the runner
        # image lacks the -dev packages for: the nested winit backend links
        # libxkbcommon, and the headless backend's pixman software renderer
        # links libpixman-1 (P1.3.2, the GPU-less compositing path). Without
        # either -dev package cargo test/clippy would fail to link vitrind
        # ("unable to find library -lxkbcommon" / "-lpixman-1"). wayland and
        # libinput are dlopen'd at runtime, so no -dev package is needed to
        # link here.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxkbcommon-dev libpixman-1-dev

      - name: Grant unprivileged user namespaces, so the confinement tests RUN
        # Nine tests in crates/vitrin-core/src/spawn.rs spawn a REAL confined
        # realm, and each is guarded so a host that cannot confine skips rather
        # than fails. On a stock `ubuntu-latest` that guard always fires:
        # `apparmor_restrict_unprivileged_userns=1` permits the unshare and
        # denies the capabilities it should confer, so the realm's first mount
        # answers EACCES.
        #
        # Without this step those nine skip. Until #288 they skipped SILENTLY,
        # because the guard reported itself with `eprintln!` and `cargo test`
        # captures stdout AND stderr for tests that pass: the job printed
        # `993 passed` while having exercised none of the confinement it was
        # extended to cover -- issue #229's failure mode exactly, a green
        # number standing in for absent evidence. `VITRIN_REQUIRE_CONFINEMENT`
        # in this job's env block is what makes the pairing enforceable: this
        # step is now load-bearing, and dropping it turns the job red instead
        # of quietly empty.
        #
        # Same remedy the integration job takes, and the same caveat: after
        # this step the runner is NOT a stock Ubuntu machine, so nothing here
        # may be cited as evidence about default-distribution behaviour.
        # #281's matrix is collected in the integration job, before its sysctl.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy (all targets)
        # --all-targets type-checks every lib/bin/test/bench target, so this
        # step doubles as the "workspace builds" gate; the explicit
        # -D warnings keeps the clippy gate intact even if the global
        # RUSTFLAGS env ever changes.
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Skip scan (no unsanctioned skip anywhere in the tree)
        # The DISCOVERY half of issue #288, and the only part that covers a
        # skip site written by somebody who never read the issue. Reads
        # sources, runs nothing: it walks every `#[test]` body under crates/
        # and fuzz/ and fails on an early `return` that did not go through
        # `vitrin_skip::skip_unless!`, and it holds the census inventory to the
        # sources in BOTH directions -- a new sanctioned skip is red until it
        # is written down and justified, a deleted one is red until its entry
        # goes.
        #
        # It runs here, before the suites, because it is seconds long and its
        # failure is about the tree rather than about this machine. Its
        # coverage is the whole workspace including `fuzz/`, which is a
        # separate workspace no `cargo test --workspace` reaches.
        #
        # It is the SECOND line of defence, not the first. The shapes it
        # cannot see -- a guard inverted around a whole test body, a guard
        # inside the closure that is the measurement -- stopped compiling
        # when `vitrin_skip::Verdict` and `vitrin_skip::Measured` were
        # sealed; this step covers the bare-`return` shape, the stale
        # inventory, and (added with them) two things nothing previously
        # asserted at all:
        #
        #   * the require-variables, PER JOB. CI_DECLARATIONS in
        #     crates/xtask/src/skip_census.rs names the job each variable must
        #     be set in and the value, and both directions are checked -- so
        #     deleting one is red, and so is moving one to a job where it
        #     enforces nothing, which a workflow-wide check could not tell
        #     apart from the real thing. So is assigning one in shell inside a
        #     `run:` block, where it would cover a single command and be
        #     invisible to a table whose scope is the job.
        #   * every `#[test]` in the tree against the CI step that compiles
        #     AND runs it (CI_TEST_RUNS + UNRUN_TESTS). A `#[cfg(feature)]`
        #     test no job builds, one every job's name filter excludes, or one
        #     `#[cfg_attr(<cond>, ignore)]` ignores in every build made here,
        #     emits no output at all, so no census over test output can see
        #     it -- 24 were in that state when the check first ran. Nineteen
        #     are now wired into a step (the injector slice in this job, the
        #     widened filter in `drm-compile-check`); the rest are counted and
        #     named, four of them published as gaps in docs/book/src/limits.md
        #     -- with the COUNT in that page generated and matched, so a fifth
        #     gap cannot be added under a paragraph that still says four --
        #     and one recorded as executed by another test rather than by a
        #     libtest selection. What the check does NOT read is `if:`
        #     conditions -- a step made conditional would keep it green; that
        #     bound is stated in crates/xtask/src/test_census.rs.
        run: cargo xtask skip-scan

      - name: cargo test --workspace (through the skip census)
        # The REPORTING half. The wrapper runs the suite with
        # `--show-output`, filters the marker lines out of the passing tests'
        # captured output (which is otherwise thousands of lines of
        # measurements), itemises every skip to the log and to
        # $GITHUB_STEP_SUMMARY, and FAILS on a skip whose (class, test) pair
        # is not in the inventory in crates/xtask/src/skip_census.rs.
        #
        # `--show-output` rather than `--nocapture`: it keeps capture on and
        # prints each test's output under its own `---- <test path> stdout
        # ----` heading, so markers stay attributed and a parallel run stays
        # legible. `--nocapture` prints the same bytes unattributed and
        # interleaved.
        #
        # This does not replace the env block's require-variables. Those are
        # the enforcement and they apply to every step in this job; this is
        # what makes the log say what a green run did NOT prove.
        #
        # `--min-tests 1200` is the floor this invocation must EXECUTE before
        # its census is allowed to say anything affirmative. Measured on
        # 2026-08-15: 1259 tests, on a development box where one pre-existing
        # xtask test fails because the shim was meson-built there and is not
        # on a runner. (An earlier measurement said 1260, and five of those
        # were not tests at all: they were fixture lines printed by xtask's
        # own census wrapper tests, which used to reach fd 1 past libtest's
        # capture and be counted here. The wrapper now writes to a sink its
        # caller owns, which is why the number went DOWN while tests were
        # added.) It is a floor and not a count -- there is no
        # number here to bump on every added test -- and its job is to make
        # "the harness collapsed and the step exited 0" impossible, which is
        # what a filtered run that matches nothing looks like from outside.
        # Zero is not a legal value for it, here or anywhere: a floor of zero
        # is met by a run that executed nothing.
        #
        # `--expect-self-marker` is the census's own non-vacuity check:
        # `crates/vitrin-skip`'s unit tests call `decide` and therefore print
        # real marker lines on purpose, so a run of the workspace suite that
        # produced NO marker means the parser, the shared `MARKER` constant
        # or `--show-output` has broken and every clean census after it would
        # be meaningless. Those planted markers are reported separately and
        # are never counted as skips.
        run: |
          cargo xtask skip-census --min-tests 1200 --expect-self-marker \
            -- cargo test --workspace -- --show-output

      - name: cargo test --workspace --release
        # Not redundant with the debug run: assertion-related bugs are
        # release-only by nature (this crate's first shipped bug was a
        # debug_assert! compiled out in release), so the suite must pass in
        # exactly the mode where such a regression would hide.
        #
        # Deliberately NOT wrapped in the skip census, and therefore carrying
        # no `--min-tests` floor either. Both are the same reason: it names no
        # filter, so the way a filtered step comes to run nothing -- a name
        # that stopped matching -- has no analogue here, and it runs the same
        # set the censused debug step above already floored at 1200 under the
        # same env block. The require-variables still turn any skip into a red
        # test here; what a second itemised census would add is a block
        # readers learn to scroll past.
        #
        # The FIVE steps in this workflow that DO name a filter each carry
        # their own floor, because for them "matched nothing" and "passed"
        # print the same exit code:
        #
        #   * the injector slice below (`--min-tests 6`, against 7);
        #   * `drm-compile-check`'s device-free unit tests (`--min-tests 34`,
        #     against 35);
        #   * `conformance`'s `c_shim` run (`--min-tests 2`, which IS the
        #     whole set: `c_shim` matches exactly two tests by name);
        #   * `integration`'s Firefox real-core gate, which filters
        #     `unittest discover` down to one module by filename and so
        #     asserts `Ran N tests` with N >= 1 in the shell -- there is no
        #     `--min-tests` for unittest, and an earlier version of this list
        #     said "three steps" because that fourth one was missed, which is
        #     the same class of miscount as everything else on this page;
        #   * `apparmor-profile`'s real-app confinement gate, which filters
        #     `unittest discover` to `test_real_confinement.py` and asserts
        #     `Ran N` with N >= 1 the same way, for the same reason.
        #
        # The `vitrin-ipc` and `session-keymap` slices below name no filter
        # and are unbounded for the same reason this step is.
        run: cargo test --workspace --release

      - name: vitrin-ipc dependency-light client slice
        # The workspace default feature for vitrin-ipc is `server` (the
        # calloop event-loop glue), so every step above exercises it. This
        # step guards the *other* slice: the `client`-only transport the Rust
        # SDK links must keep building and passing with no calloop pulled in,
        # or the "SDK links no compositor deps" guarantee (P1.2.2) rots
        # unnoticed. Kept scoped to the one crate that has the feature split.
        run: cargo test -p vitrin-ipc --no-default-features --features client

      - name: vitrin-core gpu-tests slice (compile-check only)
        # The real-GPU dmabuf tests (P1.3.5, the M1.5 zero-copy acceptance)
        # hide behind the `gpu-tests` feature and can never RUN on these
        # GPU-less runners — they stay env-gated on developer machines
        # (VITRIN_GPU_TESTS=1, see crates/vitrin-core/Cargo.toml). But
        # nothing else compiles that cfg combination, so without this step a
        # refactor of dmabuf/shim/mock-shim internals could land green and
        # rot the acceptance harness unnoticed. clippy type-checks without
        # linking, so the runner needs no libgbm/EGL (gbm-sys links only at
        # final-binary link time, which check/clippy skip).
        run: cargo clippy -p vitrin-core --all-targets --features gpu-tests -- -D warnings

      - name: vitrin-core session-keymap slice (clippy + tests)
        # The core's own xkb keymap (WS-E.3.1, decision D-028) hides behind
        # the `session-keymap` feature, because linking libxkbcommon into a
        # nested or headless TCB is exactly what the gate exists to prevent
        # -- every step above therefore builds WITHOUT it, and that is the
        # measurement the feature's whole cost argument rests on (`readelf -d
        # target/release/vitrind` must show no NEEDED entry matching `xkb`).
        #
        # But two of issue #217's four required unit tests -- a Shift-held
        # press resolving to `A`, and the resolve-before-update ordering --
        # cannot exist without a keymap, so they would run nowhere at all
        # without this step. Unlike the gpu-tests slice above this one really
        # RUNS the tests: libxkbcommon-dev is already installed for the
        # winit backend, the keymaps are checked-in fixtures, and none of it
        # needs a seat or a device.
        run: |
          cargo clippy -p vitrin-core --all-targets --features session-keymap -- -D warnings
          cargo test -p vitrin-core --features session-keymap

      - name: vitrin-core injector slices (the seven tests that ran NOWHERE)
        # Found while wiring issue #288: everything behind `consent-injector`
        # and `physical-input-injector` is `#[cfg(feature = ...)]`-gated, and
        # vitrin-core declares no default feature list -- so `cargo test
        # --workspace`, `cargo clippy --workspace --all-targets` and the
        # integration job's `cargo build` all missed the lot. They had never
        # been compiled, let alone run, and one of them did not compile at
        # all: it carried `isolation: IsolationOptions::default()` in PATTERN
        # position, which is not Rust. That is #288's failure class one level
        # below a skip -- a test that exists, is cited, and never executes --
        # and no census over test output could ever have seen it, because
        # there was no output.
        #
        # SEVEN, not two. The first version of this step named two tests with
        # `--exact`, which compiled the other five and ran none of them: the
        # `consent::injector::live::tests::*` socket tests were still in
        # exactly the state the step was added to fix, one line lower down.
        # The filters below are substrings and one of them covers the whole
        # module, so a test added beside those five is picked up rather than
        # silently excluded.
        #
        # Still filtered rather than unfiltered on purpose: an unfiltered run
        # rebuilds and re-runs the whole vitrind suite a third time in this
        # job. The compile is what the rest of the feature gets, and it is
        # what would have caught the pattern above.
        #
        # ...and BOUNDED, because a name filter is exactly how a step comes to
        # run nothing: three names that no longer match print `0 passed; 0
        # failed; 1001 filtered out` and exit 0. `--min-tests 6` against 7
        # measured on 2026-08-15. Say what that does and does not catch: a
        # floor one under the set catches the filter collapsing, and does NOT
        # catch losing exactly one test while another is added. It is a floor
        # rather than the exact count so that adding a socket test beside the
        # five is not a red build for a good change, and `cargo xtask
        # skip-scan` is what covers the single-rename case -- it holds each
        # filter here to the table in crates/xtask/src/test_census.rs and
        # every `#[test]` in the tree to a step that selects it.
        run: |
          cargo xtask skip-census --min-tests 6 -- \
            cargo test -p vitrin-core --features consent-injector,physical-input-injector \
            --bin vitrind -- --show-output \
            tests::the_injector_flag_and_the_feature_are_both_required \
            tests::the_physical_input_flag_parses_once_and_fails_closed \
            consent::injector::live::tests::

  codegen-diff:
    name: codegen-diff (IDL schema + regeneration honesty)
    # Two generators, one contract: a checked-in artifact must be
    # byte-identical to what its generator emits, so hand-editing a GENERATED
    # file fails the build. They share a job because they share the toolchain
    # install and the cargo cache, and because they fail for the same reason.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate IDL against the RELAX NG schema
        # The scanner parses with roxmltree and performs its own semantic
        # checks, but structural/dialect validation is xmllint's job
        # (CLAUDE.md names this as the protocol validation command); without
        # it, a schema-invalid vitrin-v0.xml that roxmltree tolerates would
        # land green.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
          xmllint --noout --relaxng protocol/vitrin-v0.rng protocol/vitrin-v0.xml

      - name: Install Rust (pinned toolchain + components from rust-toolchain.toml)
        # Installed from rust-toolchain.toml for the reasons documented on
        # the rust job's install step (single source of truth for version
        # and components; the codegen shells out to the pinned rustfmt).
        run: rustup toolchain install && rustup show active-toolchain

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo xtask codegen --check
        # Regenerates into a scratch dir and diffs against the checked-in
        # crates/vitrin-protocol/src/generated + shim/include/vitrin-protocol.h.
        # Fails when generated code drifts from protocol/vitrin-v0.xml.
        run: cargo xtask codegen --check

      - name: cargo xtask session-matrix --check
        # WS-E.4.1 / issue #221 acceptance criterion 1. Re-renders
        # docs/book/src/session-app-matrix.md in memory from the corpus in
        # crates/xtask/src/session_matrix.rs and compares byte-for-byte
        # against the checked-in page, so a hand edit to that page is a red
        # build and the app set cannot widen by assertion.
        #
        # THIS IS THE ONLY PART OF THAT PAGE CI CAN CHECK. A GitHub runner
        # has no DRM device, no seat and no GPU, so it cannot run `vitrind`
        # against a panel and cannot run a GUI application at all -- it
        # cannot produce a single cell. Whether the cells are still TRUE is
        # the target machine's runbook, published on the page itself.
        #
        # The generator's own gates -- above all the non-vacuity test, which
        # feeds it an application nobody executed and asserts no row is
        # emitted -- run in the `rust` job's `cargo test --workspace`,
        # because xtask is a workspace member.
        run: cargo xtask session-matrix --check

      - name: cargo xtask isolation-matrix --check
        # P2.6.3 / issue #187's second deliverable, at the scope the ABI-floor
        # decision narrowed it to. Re-renders docs/book/src/isolation-matrix.md
        # in memory and compares byte-for-byte against the checked-in page.
        #
        # Unlike session-matrix, this one is red for reasons beyond a hand
        # edit, because the generator DERIVES the page instead of transcribing
        # it: the Landlock rung ladder is parsed out of
        # crates/vitrin-realm-init/src/landlock.rs and the ABI floor and
        # ceiling out of that crate's lib.rs. So moving a right to another
        # rung, or re-tuning LANDLOCK_MIN_ABI, without regenerating is a red
        # build -- which is the point: four published surfaces print that
        # number.
        #
        # It also fails when a published sentence the table cites is deleted or
        # reworded on docs/book/src/limits.md, README.md or SECURITY.md, and
        # when a rung row names no claim or a claim is named by no row (issue
        # #187: "a row with a right and no claim, or a claim with no row, fails
        # the generator").
        #
        # THIS DOES NOT MEASURE A KERNEL, and the page says so in its own
        # words. The generator probes nothing -- it could not, and still emit
        # the same bytes on a runner reporting Landlock ABI 7 as on the
        # development box reporting 9. The per-kernel row set the plan's
        # restated criteria ask for is NOT delivered by this step; the plan
        # carries that as Correction 5.
        #
        # The generator's own gates -- including the two non-vacuity tests that
        # feed it a rung with no claim and a claim with no rung -- run in the
        # `rust` job's `cargo test --workspace`, because xtask is a workspace
        # member.
        run: cargo xtask isolation-matrix --check

      - name: cargo xtask kernel-matrix --check
        # The OTHER half of #281, and the half that does measure kernels --
        # except that the measuring did not happen here and this step is
        # careful about which claim it is making.
        #
        # docs/book/src/isolation-kernels.md is rendered from the boot rows in
        # tests/kernel-matrix/rows/, one file per kernel, each holding the
        # SHIPPED vitrind's own `--print-isolation` and `--print-floor` output
        # plus its startup verdict, collected by booting that kernel under QEMU
        # (tests/kernel-matrix/collect.sh). This step re-renders the page from
        # those checked-in rows and compares byte-for-byte.
        #
        # SO WHAT A GREEN RESULT HERE PROVES: the page agrees with the rows.
        # WHAT IT DOES NOT PROVE: that the kernels still answer that way.
        # Holding the ROWS to the KERNELS is `collect.sh --check`, which boots
        # five kernels and is deliberately NOT wired into any pull request --
        # it needs qemu, downloads ~220 MiB of kernel packages, and re-checks
        # something that changes when a distribution ships a kernel rather than
        # when this repository changes. .github/workflows/kernel-matrix.yml
        # runs it on a schedule and on demand instead, and every row carries a
        # collection date so its age is visible on the page.
        #
        # This step needs no qemu, no network and no privileges: it reads two
        # sets of files that are both in the tree.
        #
        # The generator's own gates -- a row with no stated reason for being in
        # the set, a row collected against a different LANDLOCK_MIN_ABI than
        # this tree declares, a verdict that contradicts the ABI in its own
        # row, and the cross-validation table's requirement that the two
        # columns actually disagree somewhere -- run in the `rust` job's
        # `cargo test --workspace`, because xtask is a workspace member.
        run: cargo xtask kernel-matrix --check

      - name: cargo xtask limits-check
        # WS-E.4.4 / issue #224 acceptance criterion 1: "Changing a WS-E claim
        # on one surface and not the others FAILS SOMETHING IN CI. This is
        # text, so CI can genuinely enforce it -- unlike most of the rest of
        # this workstream."
        #
        # Several different failures, and the tool's output says which:
        #
        #   SURFACE  -- a claim is missing from one of docs/book/src/limits.md,
        #               README.md, SECURITY.md or site/index.html while the
        #               others carry it. Before this step existed, this file
        #               contained ZERO references to limits.md and nothing
        #               anywhere kept the published surfaces in agreement.
        #               (SECURITY.md joined them with #286, whose limit belongs
        #               on a reporter's triage list as much as on a reader's.)
        #   SET      -- a limit is published on the limits page that no plan
        #               document enumerates, or vice versa. The enumerating
        #               documents are a LIST (see `ENUMERATORS`): a limit's
        #               home is the plan document that owns the work which
        #               created it, and the comparison runs over their union.
        #   EVIDENCE -- a claim no longer matches the code. This is the half
        #               #224 needed and a pure cross-surface check does not
        #               have: on 2026-08-12 an audit found two of #224's own
        #               body items were false of `main` (a clipboard it said
        #               did not exist, a lock screen it said had not shipped),
        #               and three agreeing surfaces would have agreed on both.
        #               A page that OVERSTATES a gap is as dishonest as one
        #               that hides it.
        #   DERIVED  -- one value with ONE canonical definition, rendered
        #               differently on each surface, and a surface's rendering
        #               no longer matches the definition. This is the failure a
        #               literal anchor cannot see, and it was not theoretical:
        #               six surfaces stated one AppArmor measurement and split
        #               three/three over which kernel it was taken on, with
        #               this step green throughout, because the SURFACE anchors
        #               pinned the artefact path and the bound and never the
        #               kernel release.
        #   MIRROR   -- a constant duplicated in a second file under a comment
        #               promising it mirrors the first has stopped doing so.
        #   ISSUE    -- a claim names the issue behind it and no surface it is
        #               published on cites that issue, so a reader who meets
        #               the gap cannot find what tracks it.
        #   SELF-DRIFT -- ONE surface renders the same derived value in two
        #               places and the two disagree, so a page contradicts
        #               itself. Matching is every-occurrence, not first-hit,
        #               and this is why: site/index.html said the per-kernel
        #               matrix had not been built in one paragraph and cited
        #               its measurements ninety lines below, and a `contains`
        #               check calls that green. The message names both line
        #               numbers.
        #   COVERAGE -- a table and its written roll of ids disagree, so the
        #               SET this gate holds has changed. Deleting a claim row
        #               used to leave every check passing and move only the
        #               tally printed at the end of this step; that is #288's
        #               failure mode -- a green check over a quietly smaller
        #               set -- and it is red now. Shrinking coverage is a
        #               decision somebody makes in a diff, not a side effect.
        #
        # NO LONGER TEMPORARY. This step's comment used to say issue #172 owned
        # the choice of drift mechanism and had not made it. #172 has now taken
        # option (b) -- a drift check that fails when one surface disagrees,
        # built by EXTENDING this tool rather than adding a parallel one -- and
        # its four named claims (the fuzz soak, the wlcs counts, OIN, REUSE) are
        # rows in the table. Do not grow it into a docs linter: #172's scope
        # note is that the claim set is small, known and slow-moving.
        #
        # NOT here, on purpose: #172's tracker cross-check. `cargo xtask
        # limits-check --tracker` shells out to `gh`, needs network and
        # credentials, and is ADVISORY -- it reports and exits 0. It runs in
        # .github/workflows/honesty-tracker.yml on a schedule, never on a pull
        # request, because a gate that goes red when somebody else opens an
        # issue is the "trains people to weaken the check" failure #224's risk
        # list names. An offline gate PRETENDING to check the tracker would be
        # worse than none, so this one does not pretend.
        #
        # It reads files and writes nothing. Its own non-vacuity tests -- a
        # claim missing from a surface must fail, a claim the code contradicts
        # must fail in BOTH directions, a claim with no code evidence must be
        # refused outright, a canonical value that moves must fail EVERY
        # rendering of it, a render function that ignores its input must be
        # refused, a surface that states the value twice and disagrees must fail
        # with both line numbers, and a deleted table row must fail by id -- run
        # in the `rust` job's `cargo test --workspace`, because xtask is a
        # workspace member.
        run: cargo xtask limits-check

      - name: cargo xtask verb-sets --check
        # Issue #196's third review. Three consecutive reviews of that branch
        # found the SAME defect and no other: a set of verbs written out in
        # prose, corrected in one place and left stale in another --
        # "`observe_cursor` is the only one left" in a comment that also
        # explains that facetless verbs gain facets over time; a schema header
        # that accounted for one of two missing verbs; a table row that had
        # named four `interface/@verb` values since two more landed.
        #
        # Every one of those sets is derivable, so this step derives them --
        # from `protocol/vitrin-v0.xml` via the real scanner, and (for the
        # unserved set) from the reference core's `SERVED_VERB_BITS` -- and
        # holds every registered surface to them. A surface declares what it
        # enumerates with a one-line marker comment invisible in the rendered
        # document. The load-bearing check is that the marker's list EQUALS the
        # derived set, in document order: that fires at every carrier the
        # moment a set moves, and no rewording can satisfy it. Two softer
        # checks sit on top -- that the twenty lines around the marker name
        # every member, and that a spelled-out count word is the right word --
        # and the first of those is a heuristic whose limits the module's
        # `PASSAGE_LINES` docs state outright rather than leave to a review to
        # find.
        #
        # It also holds `protocol/vitrin-v0.rng`'s closed `@verb` value set to
        # the facets the IDL declares. `xmllint --relaxng` above already sees
        # one direction of that pairing -- an IDL using a name the schema
        # omits -- and can never see the other.
        #
        # What it does NOT catch is stated in the module's own docs: a brand
        # new file that enumerates one of these sets and registers no marker
        # is invisible to it. The registry is a list a human extends, exactly
        # as `limits-check`'s claim table is.
        #
        # Reads files, writes nothing. It runs here AND as a test in `cargo
        # test --workspace` (xtask is a workspace member), so the gate does
        # not depend on this step existing.
        run: cargo xtask verb-sets --check

  deny:
    name: deny (TCB dependency budget - plan risk R7)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Blocking, in the same posture as codegen-diff above, because that is
    # what plan risk R7's mitigation claims and what issue #201 asks for. The
    # accepted cost is stated rather than discovered later: the advisories
    # check reads the RustSec database live, so a newly published advisory
    # against a crate already in the graph can turn `main` red with no PR
    # having touched anything. That is the intended behaviour of a dependency
    # budget -- the alternative is a check that only notices supply-chain
    # problems the day someone happens to edit Cargo.toml -- and the response
    # is an `[advisories] ignore` entry in deny.toml carrying a reachability
    # argument and an exit condition, which is a reviewable decision, or a
    # dependency change, which is a fix.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (pinned toolchain + components from rust-toolchain.toml)
        # Installed from rust-toolchain.toml for the reasons documented on
        # the rust job's install step (single source of truth for version
        # and components).
        run: rustup toolchain install && rustup show active-toolchain

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny (pinned)
        # Built from source with `--locked` rather than pulled from a
        # binary-installer action. Two reasons, both about what this job is:
        # it is the job that guards the trusted core's supply chain, so
        # introducing a new third-party action (and a new binary-download
        # path) to run it would be self-defeating; and `--locked` means the
        # tool's own dependency resolution is the one its authors tested.
        # Swatinem/rust-cache caches ~/.cargo/bin, so the compile is paid on
        # a cache miss, not on every run.
        #
        # The VERSION is pinned on the same reasoning as rust-toolchain.toml
        # and the smithay pin: a cargo-deny minor release can add checks or
        # change config schema, and the resulting red build would have
        # nothing to do with the PR that hit it. What is deliberately NOT
        # pinned is the advisory database -- it is fetched fresh every run,
        # which is the whole point of the advisories check.
        env:
          # The workflow-wide `RUSTFLAGS: -D warnings` is this workspace's
          # standard for OUR code and must not be applied to a third-party
          # tool we merely install: a warning in cargo-deny or in any of its
          # ~200 dependencies would fail this job for a reason that has
          # nothing to do with the dependency budget. Cleared for this step
          # only.
          RUSTFLAGS: ""
        run: cargo install cargo-deny --locked --version 0.20.2

      - name: cargo deny check
        # Runs all four checks (advisories, bans, licenses, sources) against
        # the configuration in deny.toml, which resolves the graph with
        # `all-features = true` for the two Linux targets this project
        # supports. No apt packages are needed and none are installed: this
        # step resolves cargo metadata and never compiles vitrin-core, so the
        # feature-gated system libraries (libgbm/libinput/libudev/libseat
        # under `drm-backend`) are irrelevant here -- unlike the compile-check
        # slices in the `rust` job.
        run: cargo deny check

  drm-compile-check:
    name: drm-compile-check (COMPILE ONLY - no display controller is touched)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # **This job compiles the bare-metal backend and runs its device-free unit
    # tests. It does not, and cannot, exercise it.** A GitHub runner has no DRM
    # device, no seat and no panel, so nothing here says the backend sets a
    # mode, presents a frame, or delivers a key. WS-E.3.2's acceptance is
    # explicit that no green check in this repository will ever prove that; the
    # mock-free evidence is WS-E.3.4's runbook, executed on the target machine
    # and recorded.
    #
    # A separate job rather than a slice of `rust`, and the reason is load
    # bearing: the four system libraries below would otherwise be installed for
    # every step of that job, and the thing that currently makes a `drm-backend`
    # leak into `default` fail LOUDLY is that the other jobs install only
    # libxkbcommon-dev and libpixman-1-dev. Keeping the graphics dev stack in
    # its own job keeps that machine-enforced.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (pinned toolchain + components from rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install the bare-metal dev packages
        # What each is for, because "install five -dev packages" hides that
        # they are needed at three different times:
        #
        #   libseat-dev   libseat-sys/build.rs:30 -- pkg_config().unwrap(),
        #                 so a MISSING .pc file PANICS the build script. Needed
        #                 even for `cargo clippy`, which runs build scripts.
        #   libudev-dev   libudev-sys/build.rs:38 -- the same, and #218's own
        #                 text never names this crate.
        #   libgbm-dev    #[link(name = "gbm")] in gbm-sys (link time), AND the
        #                 header smithay's own build.rs feature-probes with a
        #                 `cc` compile -- see the next step.
        #   libinput-dev  #[link(name = "input")] in input-sys (link time).
        #   libdrm-dev    NOT required by the crate graph: drm-sys ships
        #                 prebuilt bindings and drm-ffi issues its ioctls
        #                 through rustix, so nothing links libdrm. It is here
        #                 because libgbm-dev depends on it, and naming it makes
        #                 that visible rather than surprising.
        #
        # libxkbcommon-dev and libpixman-1-dev come along because `drm-backend`
        # implies `session-keymap` and the crate still contains the headless
        # backend's pixman path.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libdrm-dev libgbm-dev libinput-dev libseat-dev libudev-dev \
            libxkbcommon-dev libpixman-1-dev

      - name: vitrin-core drm-backend slice (compile-check only)
        # Exactly the invocation issue #218's acceptance criterion names. It
        # type-checks every lib/bin/test target with the feature on, which is
        # the whole of what a machine with no display controller can say about
        # this backend.
        run: cargo clippy -p vitrin-core --all-targets --features drm-backend -- -D warnings

      - name: Assert smithay's gbm probe actually ran (it fails SOFT)
        # `smithay/build.rs` feature-probes gbm by COMPILING two C files
        # (`test_gbm_bo_get_fd_for_plane.c`, `test_gbm_bo_create_with_modifiers2.c`)
        # and treats a failure as a `cargo:warning`, not an error. Measured on
        # 2026-08-09 with CC pointing at a nonexistent binary: the build stays
        # GREEN and silently loses both cfgs, selecting an older buffer-
        # allocation path inside the TCB's scanout code. "The build passed" is
        # therefore not evidence that the probe worked, which is why this step
        # exists -- it is the check `crates/vitrin-core/Cargo.toml`'s
        # `drm-backend` block asks #218's CI job to add.
        run: |
          set -euo pipefail
          for cfg in backend_gbm_has_fd_for_plane backend_gbm_has_create_with_modifiers2; do
            if ! grep -qs "cargo:rustc-cfg=feature=\"${cfg}\"" target/debug/build/smithay-*/output; then
              echo "::error::smithay's gbm probe did not set ${cfg}. The build is green anyway"
              echo "::error::because the probe fails soft, but the scanout path just silently"
              echo "::error::selected an older gbm buffer-allocation API. Check that a C"
              echo "::error::compiler and gbm.h are both present on this runner."
              exit 1
            fi
          done
          echo "both gbm probe cfgs are set: the C probe ran and found the modern API"

      - name: vitrin-core drm-backend device-free unit tests
        # The unit tests the backend carries are pure functions and source
        # assertions -- the one-output refusal, the pointer accumulator, the
        # flip-coalescing gate, and two greps that hold `redraw` to
        # `Scheduled` and the capture path off the scanout buffer. They touch
        # no device, open no seat and present nothing. Running them here is
        # the only place they run at all, since the feature is off in every
        # other job.
        #
        # FILTERED, and the filter is the point. An unfiltered run of this
        # binary also drags in `spawn::`, `session::` and
        # `shim::c_shim_conforms_to_the_real_core`, which fork real processes,
        # need a writable XDG_RUNTIME_DIR and need the built C shim -- none of
        # which this job sets up, because none of it has anything to do with a
        # display controller. That is the `rust` and `conformance` jobs' work
        # and they already do it. Unfiltered, 89 of them fail here for reasons
        # that would read as "the DRM backend is broken".
        #
        # WIDENED for issue #288, twice. libtest's filter arguments are an OR
        # over substrings, and everything `drm-backend` gates that no listed
        # substring matched ran nowhere at all -- silently counted in this
        # step's `N filtered out`, which is why that number is not evidence of
        # anything. Three names were added:
        #
        #   * `the_vt_escape_reserves_the_function_keys_on_bare_metal`
        #     (crates/vitrin-core/src/main.rs) and
        #     `a_raised_consent_prompt_does_not_swallow_the_vt_escape`
        #     (crates/vitrin-core/src/consent/grab.rs);
        #   * `vt::tests::` -- FOURTEEN more, the whole VT-escape module in
        #     crates/vitrin-core/src/vt.rs, which the first widening missed
        #     because it was written by reading the two names somebody had
        #     already noticed rather than by asking what the feature gates.
        #     `cargo xtask skip-scan` now asks that question mechanically, and
        #     these are what it answered with.
        #
        # All device-free: chord parsing, modifier bookkeeping, and the rule
        # that an agent's synthetic Ctrl-Alt can never arm the human's next
        # F-key. None opens a card or a seat.
        #
        # BOUNDED for the same reason the filter is the point. This step
        # diagnosed that "the number of filtered-out tests is not evidence of
        # anything" and then had no lower bound of its own, which is the same
        # defect one line further on: rename `backend::drm::` and the step
        # prints `0 passed; 1047 filtered out` and exits 0. `--min-tests 34`
        # against 35 measured on 2026-08-15 -- a floor, so adding a device-
        # free unit test does not require editing this line, while losing a
        # module does. It does NOT catch losing exactly one test; that case is
        # `cargo xtask skip-scan`'s, which holds every `#[test]` in the tree
        # to a step that selects it and each filter here to the table in
        # crates/xtask/src/test_census.rs.
        run: |
          cargo xtask skip-census --min-tests 34 -- \
            cargo test -p vitrin-core --features drm-backend --bin vitrind \
            -- --show-output backend::drm:: the_drm_refusal_table \
            the_vt_escape_reserves_the_function_keys_on_bare_metal \
            a_raised_consent_prompt_does_not_swallow_the_vt_escape \
            the_backlight_flag_resolves_on_bare_metal \
            vt::tests::

  shim:
    name: shim (C header, golden frames, Meson; no Rust)
    runs-on: ubuntu-latest
    # A plain distro container, not the runner image: hosted runners ship a
    # Rust toolchain, so only a clean container can prove the acceptance
    # criterion that the shim side builds WITHOUT Rust -- i.e. the
    # checked-in generated header is sufficient on its own (the P1.1.2
    # contract). The container tag also pins the C dependency set at the
    # distro level. Once the shim exists and pins its wlroots API target,
    # this becomes a GHCR-hosted image with that exact wlroots prebuilt
    # (Dockerfile in-repo, rebuilt when it changes) -- decision recorded in
    # P1.9.1, deferred until P1.6.1 fixes the version.
    container: ubuntu:24.04
    timeout-minutes: 15
    steps:
      - name: Install C toolchain and git
        # git first, so the checkout step clones instead of falling back to
        # a tarball download.
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq gcc git ca-certificates

      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert no Rust toolchain is present
        # Machine-checks the "shim job has no Rust toolchain installed"
        # acceptance criterion instead of trusting the container to stay
        # Rust-free by accident.
        run: |
          if command -v cargo >/dev/null 2>&1 || command -v rustc >/dev/null 2>&1; then
            echo "::error::a Rust toolchain is on PATH; the shim job must build from the checked-in header alone"
            exit 1
          fi
          echo "OK: no cargo/rustc on PATH"

      - name: C header compiles standalone (shim/include/vitrin-protocol.h)
        run: gcc -std=c11 -Wall -Werror -I shim/include -c shim/tests/test_header_compiles.c -o /dev/null

      - name: C golden-frame test (Rust and C pinned to the same bytes)
        run: |
          gcc -std=c11 -Wall -Werror -I shim/include shim/tests/test_golden_frames.c -o "${RUNNER_TEMP}/golden"
          "${RUNNER_TEMP}/golden"

      # ---- Meson build: activates the moment shim/meson.build lands ------
      # (P1.6.1 is in flight on a sibling branch; step-level hashFiles
      # guards keep main green both before and after it merges. The
      # dependency list lives in shim/ci/install-deps.sh -- a file the
      # landing PR owns and must adjust to its vendored wlroots subproject's
      # exact build deps, per D11. See the header of that script.)

      - name: Guard against shim gate drift
        # If shim sources land without shim/meson.build, the Meson steps
        # below would skip silently and this job would stay green while
        # never building the shim. Fail loudly instead.
        #
        # And the same, one level down, for the four acceptance scripts each
        # of whose steps carries its own `hashFiles(...) != ''` guard (issue
        # #288): delete or rename any one of them and its step silently
        # no-ops, the job stays green, and the only trace is a grey step in
        # the GitHub UI that nobody diffs. That is #138's shape one directory
        # over. Naming them here makes a deletion a red build, and the
        # `hashFiles` guards keep their historical job -- letting the steps
        # sit dormant before a script lands -- only now the dormancy has to
        # be deliberate.
        run: |
          if [ -d shim/src ] && [ ! -f shim/meson.build ]; then
            echo "::error::shim/src exists but shim/meson.build does not -- the Meson CI steps are gated on shim/meson.build and would silently skip. Land meson.build with the sources (P1.6.1)."
            exit 1
          fi
          if [ -f shim/meson.build ]; then
            missing=0
            for script in upstream_frame_path seat_input_replay firefox_bringup app_spawn; do
              if [ ! -f "shim/tests/acceptance/${script}.sh" ]; then
                echo "::error::shim/tests/acceptance/${script}.sh is gone, and its CI step is gated on hashFiles() -- the step would skip silently and this job would stay green having run one acceptance script fewer. Restore it, or delete its step in .github/workflows/ci.yml in the same commit."
                missing=1
              fi
            done
            [ "$missing" -eq 0 ] || exit 1
            echo "OK: all four gated acceptance scripts are present"
          fi

      - name: Install Meson + wlroots subproject build dependencies
        if: hashFiles('shim/meson.build') != ''
        run: bash shim/ci/install-deps.sh

      - name: Re-assert no Rust toolchain after dependency install
        # The first assert proves the header/golden steps ran Rust-free on
        # the clean container; this one re-checks AFTER apt has installed
        # the Meson dependency set, so a future package whose dependency
        # chain drags in rustc/cargo cannot silently void the acceptance
        # criterion for the steps that actually build the shim.
        if: hashFiles('shim/meson.build') != ''
        run: |
          if command -v cargo >/dev/null 2>&1 || command -v rustc >/dev/null 2>&1; then
            echo "::error::the Meson dependency install pulled a Rust toolchain onto PATH; the shim job must build from the checked-in header alone (fix shim/ci/install-deps.sh)"
            exit 1
          fi
          echo "OK: still no cargo/rustc on PATH after dependency install"

      - name: Meson build + tests
        if: hashFiles('shim/meson.build') != ''
        run: |
          meson setup "${RUNNER_TEMP}/shim-build" shim
          meson compile -C "${RUNNER_TEMP}/shim-build"
          # --suite vitrin-shim: only this project's tests, not the vendored
          # subprojects' suites (the wlroots wrap pulls in pixman/libliftoff,
          # whose slow exhaustive tests otherwise run here and time out).
          meson test -C "${RUNNER_TEMP}/shim-build" --suite vitrin-shim --print-errorlogs

      - name: Headless acceptance (exact globals + weston-terminal blind)
        # The P1.6.1 acceptance criteria, machine-checked: wayland-info lists
        # exactly the expected globals and weston-terminal runs blind against
        # the shim without crashing or hanging it. GPU-free (pixman).
        if: hashFiles('shim/meson.build') != ''
        working-directory: shim
        run: SHIM_BIN="${RUNNER_TEMP}/shim-build/vitrin-shim" bash tests/acceptance/shim_globals_and_client.sh

      # NOTE: the name is quoted because it contains ": ", which YAML forbids
      # in a plain scalar -- unquoted, this line makes the WHOLE workflow file
      # unparseable and every job silently stops running.
      - name: "Headless acceptance (upstream link: frames, damage, pacing, backpressure)"
        # The P1.6.2 acceptance criteria, machine-checked against the WIRE by
        # a peer that spawns the shim exactly as the core does (socketpair at
        # fd 3). Deliberately Rust-free, like the rest of this job: the core
        # side of the protocol is reimplemented in C in shim/tests/mock_core.c
        # so the shim's acceptance proof never needs the workspace built.
        #
        # That reimplementation is also this job's blind spot: mock_core.c and
        # the shim were written by the same hand from the same reading of the
        # IDL, so a shared misreading passes here. The `conformance` job is
        # what closes it, by running the same C shim against the REAL Rust
        # core.
        if: hashFiles('shim/tests/acceptance/upstream_frame_path.sh') != ''
        working-directory: shim
        run: BUILD_DIR="${RUNNER_TEMP}/shim-build" bash tests/acceptance/upstream_frame_path.sh

      # NOTE: quoted for the same reason as the step above -- the name contains
      # ": ", which YAML forbids in a plain scalar.
      - name: "Headless acceptance (seat input replay: events, keymap, coordinates, origin tag)"
        # The P1.6.3 acceptance criteria, checked by three witnesses that share
        # no code: the mock core plays a scripted run of `vitrin_shim_seat`
        # events and traces each one, the shim writes its own delivery trace,
        # and a real Wayland client resolves every key through the keymap it
        # was sent. The R5 gate additionally drives a real GtkEntry -- that
        # criterion is about the toolkit's input-method layer, which no keysym
        # stream can stand in for, and the script FAILS rather than skipping it
        # under CI (libgtk-3-dev is installed by shim/ci/install-deps.sh).
        if: hashFiles('shim/tests/acceptance/seat_input_replay.sh') != ''
        working-directory: shim
        run: BUILD_DIR="${RUNNER_TEMP}/shim-build" bash tests/acceptance/seat_input_replay.sh

      # NOTE: quoted because the name contains ": " -- see the two steps above.
      - name: "Shim-only Firefox smoke (mock core: render, scroll, URL bar, globals ledger)"
        # firefox_bringup.sh is a SHIM-IN-ISOLATION unit check: real shim, real
        # Firefox, MOCK core (shim/tests/mock_core.c). Relabelled from a
        # milestone proof by P1.6.6 (issue #106) -- the M1.2 "Shim runs Firefox"
        # render proof is now the REAL-core gate in the `integration` job
        # (tests/integration/test_real_firefox.py), which boots the shipped
        # vitrind and actually fetches the browser. This step stays because it
        # still exercises the shim standalone (and asserts an ordered per-frame
        # colour sequence the poll-based SDK cannot).
        #
        # The script FAILS rather than skipping under CI unless the gap is
        # declared, which is the same rule the `conformance` job's cross-track
        # test applies to itself -- a criterion that only ever reports SKIP on
        # the machine gating merges is a criterion nobody is holding.
        #
        # THE GAP IS DECLARED HERE, DELIBERATELY, AND IT IS A REAL GAP. Firefox
        # is a 75 MB tarball fetched from Mozilla (shim/tests/firefox/fetch-esr.sh)
        # and it needs a system library set this bare ubuntu:24.04 container does
        # not fully carry -- libgtk-3-dev covers most of it, but at least
        # libasound2t64 and libseccomp2 are additionally required, and that list
        # has never been validated in this container. Turning the gate on with an
        # unvalidated dependency list would trade a known, visible gap for an
        # intermittent red nobody can reproduce locally.
        #
        # TO CLOSE IT: add the missing runtime libraries to
        # shim/ci/install-deps.sh, cache shim/.firefox keyed on
        # shim/tests/firefox/firefox-esr.pin, run fetch-esr.sh, and drop the
        # VITRIN_SKIP_FIREFOX_GATE line below. Until then the criteria are held
        # on a developer machine only, and this notice says so on every run
        # rather than letting a green tick imply otherwise.
        if: hashFiles('shim/tests/acceptance/firefox_bringup.sh') != ''
        working-directory: shim
        env:
          VITRIN_SKIP_FIREFOX_GATE: "1"
        run: |
          BUILD_DIR="${RUNNER_TEMP}/shim-build" bash tests/acceptance/firefox_bringup.sh
          echo "::notice title=P1.6.4 Firefox gate declared SKIPPED::the pinned Firefox ESR is not fetched in CI, so the render/scroll/URL-bar/globals-ledger criteria were NOT proved by this run."
          {
            echo "## shim job: P1.6.4 Firefox gate SKIPPED (declared)"
            echo ""
            echo "The pinned Firefox ESR is not fetched in this job, so **none** of"
            echo "\`firefox_bringup.sh\`'s criteria ran. They are held on a developer"
            echo "machine (see \`shim/docs/firefox.md\`). The script refuses to skip"
            echo "silently under CI; this job declares the gap with"
            echo "\`VITRIN_SKIP_FIREFOX_GATE=1\`. See the step's comment for what it"
            echo "would take to hold the gate here."
          } >> "$GITHUB_STEP_SUMMARY"

      # NOTE: quoted because the name contains ": " -- see the steps above.
      - name: "Headless acceptance (app spawn: shim forks the app, isolates it, reaps it)"
        # The P1.6.5 acceptance criteria: the shim ITSELF forks and execs the
        # app the core conveyed after `--` (until now the app was launched
        # externally), so vitrind -> vitrin-shim -> app is one process tree.
        # Machine-checked against the real process tree and the wire: the mock
        # core spawns the shim with `-- weston-terminal`, then the script
        # asserts (a) the terminal is a child of the shim, (b) its frame
        # forwards through the shim, (c) it holds none of the shim's private
        # descriptors (the core socket above all), and (d) killing the shim
        # reaps it. GPU-free (pixman); weston-terminal is installed by
        # shim/ci/install-deps.sh, so a missing binary FAILS here.
        if: hashFiles('shim/tests/acceptance/app_spawn.sh') != ''
        working-directory: shim
        run: BUILD_DIR="${RUNNER_TEMP}/shim-build" bash tests/acceptance/app_spawn.sh

      - name: Meson build DORMANT
        if: hashFiles('shim/meson.build') == ''
        run: |
          echo "::notice title=shim Meson steps dormant::shim/meson.build has not landed yet (P1.6.1) -- the Meson install/build/test steps were skipped, not passed."
          {
            echo "## shim job: Meson steps DORMANT"
            echo ""
            echo "\`shim/meson.build\` has not landed yet (P1.6.1). Only the header-compile,"
            echo "golden-frame, and no-Rust checks ran. The Meson build/test steps activate"
            echo "automatically when \`shim/meson.build\` lands; the landing PR owns"
            echo "\`shim/ci/install-deps.sh\` (see its header, decision D11)."
          } >> "$GITHUB_STEP_SUMMARY"

  wlcs-advisory:
    name: "wlcs-advisory (xdg-shell + seat, ADVISORY: never blocks a PR)"
    runs-on: ubuntu-latest
    # ADVISORY, per issue #47 ("never blocks PRs"), enforced by TWO
    # independent mechanisms on purpose (either alone is one bad rebase
    # away from silently starting to gate merges -- see shim/wlcs/
    # README.md's "Why advisory, and how that's enforced"):
    #   1. continue-on-error here, at the job level.
    #   2. shim/wlcs/run-advisory.sh itself always exits 0.
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "Install wlcs (universe package: runner binary + headers + wlcs.pc)"
        id: install-wlcs
        # `|| true` on the apt-get, not on the whole step: a package that
        # isn't installable (e.g. a future runner image drops the universe
        # pocket) is exactly the "setup failure" this job treats as a
        # skipped step, not a red job -- see the note in shim/wlcs/README.md
        # ("this suite existing at all is strictly additive information").
        run: |
          sudo apt-get update -qq
          if sudo apt-get install -y -qq wlcs; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=wlcs-advisory: wlcs package unavailable::apt could not install wlcs on this runner image; the whole job is skipping itself (this is a SETUP gap, not a test failure -- see shim/wlcs/README.md)."
          fi

      - name: Install Meson + wlroots subproject build dependencies
        # The same list the `shim` and `conformance` jobs use, from the
        # same file, so all three builds of the shim can never diverge in
        # their dependency set.
        if: steps.install-wlcs.outputs.found == 'true'
        run: sudo bash shim/ci/install-deps.sh

      - name: Build the shim + the GPL-3.0-only WLCS bridge module
        # -Dwlcs=enabled: turns a missing wlcs pkg-config dependency into a
        # loud configure error rather than a silent skip, since this job
        # already confirmed the package installed above.
        if: steps.install-wlcs.outputs.found == 'true'
        run: |
          meson setup "${RUNNER_TEMP}/shim-build" shim -Dwlcs=enabled
          meson compile -C "${RUNNER_TEMP}/shim-build"

      - name: Run the advisory WLCS suite (xdg-shell + seat scope)
        if: steps.install-wlcs.outputs.found == 'true'
        id: run-wlcs
        run: |
          WLCS_BIN="$(dpkg -L wlcs | grep -E '/wlcs/wlcs$')"
          bash shim/wlcs/run-advisory.sh \
            "$WLCS_BIN" \
            "${RUNNER_TEMP}/shim-build/vitrin-shim-wlcs.so" \
            "${RUNNER_TEMP}/wlcs-advisory-out"

      - name: Publish summary
        if: steps.install-wlcs.outputs.found == 'true' && always()
        run: |
          {
            echo "## wlcs-advisory job (issue #47, ADVISORY -- never blocks this PR)"
            echo ""
            echo '```'
            tail -20 "${RUNNER_TEMP}/wlcs-advisory-out/wlcs-run.log" || echo "(no log produced)"
            echo '```'
            echo ""
            echo "Full log and gtest XML are in the \`wlcs-advisory-results\` artifact."
            echo "See \`shim/wlcs/README.md\` for the annotated, standing pass-list this"
            echo "run's numbers should be compared against."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: steps.install-wlcs.outputs.found == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: wlcs-advisory-results
          path: ${{ runner.temp }}/wlcs-advisory-out/
          retention-days: 14

      - name: wlcs unavailable on this runner (declared skip, not a failure)
        if: steps.install-wlcs.outputs.found == 'false'
        run: |
          {
            echo "## wlcs-advisory job: SKIPPED (wlcs package unavailable)"
            echo ""
            echo "apt could not install \`wlcs\` on this runner image, so none of the"
            echo "advisory conformance suite ran. This is a setup gap on the runner,"
            echo "not a test result -- see \`shim/wlcs/README.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

  vkms-advisory:
    name: "vkms-advisory (virtual KMS capability probe, ADVISORY: never blocks a PR)"
    runs-on: ubuntu-latest
    # ADVISORY, per issue #220 decision 4, on the wlcs-advisory precedent above
    # and enforced by the SAME TWO independent mechanisms, for the same reason
    # (either alone is one bad rebase away from silently gating merges):
    #   1. continue-on-error here, at the job level.
    #   2. .github/vkms/run-advisory.sh itself always exits 0.
    #
    # WHAT THIS JOB IS FOR, and the sentence that must survive every edit:
    # it does NOT prove the DRM backend lights a panel, presents a frame, or
    # delivers an input event. GitHub runners have no display controller and no
    # seat, so no green check in this repository will ever prove those. The only
    # evidence for them is docs/drm-bringup.md, executed by a human on one
    # machine and dated. This job measures ONE thing runners can answer: whether
    # a virtual KMS device offers a usable GBM + EGL/GLES scanout path at all --
    # which issue #220 decision 5 records as UNKNOWN until measured, because
    # vkms exposes no render node. Writing a criterion about it before measuring
    # would be writing one that may never legitimately go green.
    #
    # The most dangerous artifact in #220 is a VKMS job that WORKS: a green tick
    # exercising a virtual connector under software rendering, in a repo whose
    # readers are trained to trust green ticks, will be cited as evidence the
    # backend runs on hardware. Hence the job name, the step summary and the
    # limits.md entry all carrying what it does not cover, and the word
    # "advisory" in the name itself.
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the probe's build dependencies
        # libdrm/gbm/egl/gles headers only -- the probe is ~200 lines of C and
        # links nothing from this repository. `|| true` for the same reason the
        # wlcs job uses it: a package that stops being installable on a future
        # runner image is a setup gap this job declares, not a red tick.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libdrm-dev libgbm-dev libegl-dev libgles-dev pkg-config || true

      - name: "Load vkms if available, probe it, and publish what it did and did not cover"
        # Every branch of this script writes to $GITHUB_STEP_SUMMARY -- either
        # what it exercised and what it did not, or an explicit declared skip
        # naming why. Never a silent pass. (#220 acceptance criterion 4.)
        run: bash .github/vkms/run-advisory.sh "${RUNNER_TEMP}/vkms-advisory-out"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vkms-advisory-results
          path: ${{ runner.temp }}/vkms-advisory-out/
          retention-days: 14

  conformance:
    name: conformance (real C shim against the real Rust core)
    runs-on: ubuntu-latest
    # The one job that holds BOTH toolchains, and the only reason it exists.
    # Every other check on the shim wire has a peer written by the same hand
    # in the same language: the `rust` job validates the core against
    # vitrin-mock-shim, the `shim` job validates the shim against
    # shim/tests/mock_core.c. Both pass if the two sides misread the IDL
    # identically. This job runs the real C shim, built from the generated
    # header alone, against the real core's ShimServer -- so a shared
    # misreading has nowhere left to hide.
    #
    # Deliberately NOT folded into the `rust` job: Ubuntu ships no
    # wlroots-0.19, so the Meson wrap builds it from source (D11), and that
    # cost has no business sitting in front of fmt/clippy/tests. And
    # deliberately NOT folded into the `shim` job, whose standing acceptance
    # criterion is that no Rust toolchain is on PATH.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (pinned toolchain + components from rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install native link deps (libxkbcommon + libpixman for the vitrind backends)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxkbcommon-dev libpixman-1-dev

      - name: Install Meson + wlroots subproject build dependencies
        # The same list the `shim` job uses, from the same file, so the two
        # builds of the shim can never diverge in their dependency set.
        # `sudo` because that script is written for the shim job's root
        # container; here it runs on a hosted runner.
        run: sudo bash shim/ci/install-deps.sh

      - name: Build the C shim
        run: |
          meson setup "${RUNNER_TEMP}/shim-build" shim
          meson compile -C "${RUNNER_TEMP}/shim-build"

      # No `hashFiles` gate on the three steps above, unlike the `shim`
      # job's: that job predates shim/meson.build and its guards exist to
      # keep main green before P1.6.1 landed. This job is added after, so a
      # missing meson.build is a broken tree, not a not-yet state -- and a
      # step that skips itself into a green result is the exact failure this
      # job was added to fix.

      - name: Cross-track conformance (spawn the C shim from the real core)
        # The real spawn_realm forks this binary onto a real socketpair at
        # fd 3; the real ShimServer applies its F_GET_SEALS probe,
        # geometry-versus-fd-size arithmetic, watermark and bad_order rules
        # to what comes back, and latches a commit into a real Scene. The
        # test's own env allowlist passes the software-rendering WLR_* names
        # through to the shim -- the runners have no GPU.
        #
        # Run through the skip census (issue #288) and with `--show-output`
        # rather than `--nocapture`: this is the ONE job where the two
        # `c_shim` tests are satisfied for real, so "did they actually run"
        # is the whole question the job answers. It sets no
        # VITRIN_C_SHIM_CONFORMANCE_SKIP, so `vitrin_skip::C_SHIM` is
        # required here by `Require::UnderCiUnlessDeclared` and a skip is a
        # red test rather than a line nobody reads. `--show-output` keeps
        # capture on and attributes each test's output to its own heading;
        # `--nocapture` interleaved it unattributed.
        #
        # `--min-tests 2` is the whole expected set, not a margin: `c_shim` is
        # a substring filter over a 996-test binary, and renaming either test
        # would leave this job green having run neither. That is the failure
        # this job exists to prevent one directory over, so it may not commit
        # it itself.
        env:
          VITRIN_C_SHIM_BIN: ${{ runner.temp }}/shim-build/vitrin-shim
        run: |
          cargo xtask skip-census --min-tests 2 -- \
            cargo test -p vitrin-core c_shim -- --show-output

  sdk:
    name: sdk (Python ${{ matrix.python }} wire-client unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The floor (D8: pure Python >= 3.11) and the current latest, so a
        # 3.11-incompatible construct and a deprecation-removal both fail
        # visibly. The suite is mock-server unit tests only -- pure stdlib,
        # no vitrind, no native deps -- so it stays fast and GPU-less.
        python: ["3.11", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install vitrin-os (zero runtime deps) + pytest
        run: python -m pip install './sdk/python[dev]'

      - name: Install Pillow (independent PNG decode verification)
        # Test-only: the SDK never imports Pillow (Frame.to_png is pure
        # stdlib). One matrix leg gets the real decoder so the
        # test_to_png_decodes_with_pillow round-trip runs; the other leg
        # stays Pillow-less and proves the dependency-free path end to end
        # (that one test skips itself there, and declares so below).
        if: matrix.python == '3.13'
        run: python -m pip install pillow

      - name: pytest
        # ENFORCED, not just reported (issue #288). An earlier draft of this
        # step added `-rs` -- which itemises each skip instead of printing a
        # number nobody diffs -- and left the expected skip set in a prose
        # comment right here. A comment is not a gate: it cannot fail, and
        # nothing compared it to the run. `sdk/python/tests/conftest.py` is
        # the gate, and it mirrors the Rust design rather than inventing a
        # second one:
        #
        #   * every skip must carry `@pytest.mark.capability("<class>")`
        #     naming the machine state it describes -- an unclassified skip
        #     fails the run, the way an un-inventoried marker fails
        #     `cargo xtask skip-census`;
        #   * the require-variables below EXCUSE rather than require, so a
        #     skip under CI is a failure unless a job says otherwise. That
        #     polarity is deliberate: a typo in a variable name here makes a
        #     job RED rather than quietly switching the enforcement off;
        #   * VITRIN_MIN_TESTS is the collection floor, the pytest side of
        #     `--min-tests`, and it is held to the same two rules: a value
        #     that is not a non-negative integer is REJECTED at
        #     `pytest_configure` rather than crashing inside a hook at the end
        #     of a run, and zero -- or leaving it unset -- is refused under
        #     CI, because a floor of zero is met by a run that collected
        #     nothing. Measured on 2026-08-15: 84 collected.
        #
        # So the two legs differ by exactly one declared fact -- the
        # Pillow-less leg says it cannot decode PNGs independently -- and
        # every other skip on either leg is a red build.
        env:
          # `0` on the leg that deliberately has no Pillow, `1` on the leg
          # that installed it above; unset would ALSO mean required under CI,
          # and saying it out loud is what makes the pairing with the install
          # step above visible in one screen.
          VITRIN_REQUIRE_PILLOW: ${{ matrix.python == '3.13' && '1' || '0' }}
          # `test_verb_parity.py` skips the whole module when
          # protocol/vitrin-v0.xml is absent, which never happens in a
          # checkout; if it ever does here, the checkout is what is wrong.
          VITRIN_REQUIRE_IDL: "1"
          VITRIN_MIN_TESTS: "80"
        run: python -m pytest sdk/python/tests -q -rs

  integration:
    name: integration (vitrind --headless + SDK tests)
    runs-on: ubuntu-latest
    # The P1.9.1 "< 10 minutes" acceptance criterion is enforced on the
    # suite step below (timeout-minutes: 10). The job-level cap is wider
    # for one reason only: the first activated run builds the workspace
    # cold (Swatinem/rust-cache has nothing saved while the steps are
    # dormant, and by default it only saves on job success), so a 10-minute
    # job cap would time out the cold build, skip the cache save, and leave
    # every retry equally cold -- the activating PR could never go green.
    # The warm-build step plus cache-on-failure below give that first run a
    # warm-up path; steady-state (warm cache) the job lands well under 10.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- Headless integration suite: activates the moment
      # tests/integration/run.sh lands. ---------------------------------
      # Entry-point contract (normative copy: tests/integration/README.md,
      # which the landing PR edits in-place and therefore cannot miss):
      # tests/integration/run.sh (bash, exit 0 = pass) spawns
      # `vitrind --headless` and drives it with the scripted Python SDK
      # tests (runner python3 is 3.12, satisfying the SDK's >=3.11 floor,
      # D8). The guard is the test entry point itself -- NOT
      # crates/vitrin-core -- because the vitrind skeleton (P1.2.x, in
      # flight on a sibling branch) predates --headless and the SDK, and
      # must not activate this job.

      - name: Guard against integration gate drift
        # If integration tests land under any entry point other than
        # tests/integration/run.sh (e.g. bare pytest), every later step
        # would skip silently and this job would stay green while running
        # nothing. Fail loudly instead.
        run: |
          if [ -d tests/integration ] && [ ! -f tests/integration/run.sh ]; then
            extra=$(find tests/integration -type f ! -name 'README.md' | head -5)
            if [ -n "$extra" ]; then
              echo "::error::tests/integration/ contains files but no run.sh -- this job's steps are gated on tests/integration/run.sh and would silently skip. See tests/integration/README.md for the entry-point contract."
              echo "$extra"
              exit 1
            fi
          fi

      - name: Guard against milestone-gate drift
        # The guard above asserts the entry point exists. This asserts the
        # named gates BEHIND it do. `run.sh` runs `unittest discover`, which
        # collects whatever `test_*.py` files are present -- so a milestone
        # gate that was never written, or one dropped in a later refactor, is
        # indistinguishable from a green suite: nothing collected, nothing
        # failed, exit 0. That is how a milestone gets recorded as done on
        # evidence that does not exist (issue #138).
        #
        # `run.sh` carries the authoritative lists (MILESTONE_GATES and
        # PROPERTY_GATES) and fails the same way; this runs BEFORE the build +
        # suite, so the answer arrives in seconds and does not depend on the
        # toolchain, the C shim, or a green build.
        #
        # test_real_trust_band.py is in the second list on purpose: it is a
        # mock-free real-app gate, but the property it proves (issue #139, the
        # negative half of #85) is NOT an M1.4 criterion -- plan §5 adjudicated
        # that -- so it must not appear in a check whose error text talks about
        # a milestone's evidence.
        if: hashFiles('tests/integration/run.sh') != ''
        run: |
          missing=0
          for gate in test_real_app.py test_real_capture_fidelity.py test_real_actuation.py test_real_deadman.py test_real_consent.py test_demo.py; do
            if [ ! -f "tests/integration/$gate" ]; then
              echo "::error::named milestone gate tests/integration/$gate is missing -- unittest discover would not collect it and this job would stay green with that milestone's evidence contributing nothing. Restore it, or retire it from run.sh's MILESTONE_GATES, this list, and tests/integration/README.md's gate table together."
              missing=1
            fi
          done
          # Must match run.sh's PROPERTY_GATES exactly. This list had itself
          # drifted -- it carried two of the five gates run.sh named, so the
          # guard against gate drift had silently drifted, which is the same
          # defect one level up. Edit both, and README.md's table, together.
          # It had drifted AGAIN by P2.6.2: `test_real_gestures.py` (WS-E.4.2,
          # #222) was in run.sh's list and never here. Both are named now, plus
          # `test_real_confinement.py` (#186).
          for gate in test_real_trust_band.py test_two_realms.py test_layout.py test_input_switch.py test_attention.py test_real_clipboard.py test_screenshot.py test_real_gestures.py test_real_confinement.py test_launch.py test_shell.py; do
            if [ ! -f "tests/integration/$gate" ]; then
              echo "::error::named property gate tests/integration/$gate is missing -- unittest discover would not collect it and this job would stay green with that property's evidence contributing nothing. Restore it, or retire it from run.sh's PROPERTY_GATES, this list, and tests/integration/README.md's gate table together."
              missing=1
            fi
          done
          # And the other direction, added for issue #288: a module ON DISK
          # that run.sh names in NONE of its three lists. Seven were in that
          # state -- test_real_firefox.py, test_real_gtk.py,
          # test_runtime_wiring.py, test_hostile_client.py,
          # test_multi_realm.py, test_actuation.py, test_consent_injector.py
          # -- so deleting one made `unittest discover` simply collect fewer
          # tests, with nothing comparing the collected set to an expectation
          # and the suite exiting 0.
          #
          # Written as a grep of run.sh rather than as a fourth copy of the
          # names, deliberately: the two lists above are duplicated here for
          # independence and have drifted TWICE (see the notes on each), and a
          # third copy would be a third thing to drift. What this asserts is
          # the property, not the membership -- every module is classified
          # somewhere -- and run.sh's own SUPPORTING_MODULES list is what
          # catches a deletion.
          for path in tests/integration/test_*.py; do
            name="$(basename "$path")"
            if ! grep -q "^  ${name}\b" tests/integration/run.sh; then
              echo "::error::tests/integration/${name} is named in none of run.sh's MILESTONE_GATES / PROPERTY_GATES / SUPPORTING_MODULES lists. unittest discover collects it, this job is cited for it, and nothing here would notice its deletion. Classify it in run.sh (and in tests/integration/README.md's gate table)."
              missing=1
            fi
          done
          # The warm build below always runs before run.sh, so ITS feature
          # list is the one the suite actually gets. A list that drifts from
          # run.sh's would hand the gates a binary missing a hook they depend
          # on, and every symptom of that is a confusing timeout somewhere
          # else. Assert the two agree, here, in seconds.
          expected='INJECTORS=vitrin-core/dead-man-injector,vitrin-core/consent-injector,vitrin-core/physical-input-injector'
          if ! grep -qxF "$expected" tests/integration/run.sh; then
            echo "::error::tests/integration/run.sh no longer declares '$expected'. The warm-build step in this job hard-codes that same feature list and runs first, so the two must match exactly -- update both together."
            missing=1
          fi
          exit "$missing"

      - name: Install Rust (pinned toolchain + components from rust-toolchain.toml)
        if: hashFiles('tests/integration/run.sh') != ''
        run: rustup toolchain install && rustup show active-toolchain

      - name: Cache cargo
        if: hashFiles('tests/integration/run.sh') != ''
        uses: Swatinem/rust-cache@v2
        with:
          # The default saves only on job success: a first activated run
          # whose suite step fails (or overruns its 10-minute cap) would
          # save nothing and stay cold forever. cache-on-failure banks the
          # warm build below even across a red first run.
          cache-on-failure: true

      - name: Install native build deps
        # Discharges the TODO this job carried while dormant: vitrind links
        # libxkbcommon (winit backend) and libpixman-1 (headless backend,
        # P1.3.2), so `cargo build --workspace` below cannot link without
        # them ("unable to find library -lxkbcommon" / "-lpixman-1").
        # Mirrors the rust job's step; wayland and libinput are dlopen'd at
        # runtime and need no -dev package here.
        if: hashFiles('tests/integration/run.sh') != ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxkbcommon-dev libpixman-1-dev

      - name: Install Meson + wlroots subproject build dependencies (for the real-app gate)
        # The M1.2 real-e2e gate (tests/integration/test_real_app.py, P1.9.6)
        # boots the REAL C shim and a REAL weston-terminal, so this job needs
        # the shim's build toolchain and weston. Same list, from the same
        # file, as the `conformance` and `shim` jobs, so no third build of the
        # shim can drift in its dependency set. `sudo` because the script is
        # written for the shim job's root container; here it runs on a hosted
        # runner. weston + fonts-dejavu-core (the app and its glyphs) are in
        # that list already, so the gate FAILS-not-skips on a missing app.
        if: hashFiles('tests/integration/run.sh') != ''
        run: sudo bash shim/ci/install-deps.sh

      - name: Warm build (workspace)
        # Separates compile time from the suite's 10-minute budget: vitrind
        # is a workspace crate (crates/vitrin-core per the plan layout), so
        # this builds -- and, via the cache step above, banks -- the heavy
        # dependency tree before the timed suite step runs.
        #
        # The two test-only injector features ride along, and the list must
        # match `tests/integration/run.sh`'s `INJECTORS` EXACTLY -- this step
        # always runs first, so its binary wins the race and `run.sh`'s
        # existence guard then skips rebuilding. A list that drifts here
        # silently ships the suite a `vitrind` missing a hook a gate depends
        # on (the "Guard against milestone-gate drift" step above asserts the
        # agreement in seconds):
        #   - `vitrin-core/dead-man-injector` (issue #109): otherwise no
        #     SIGUSR1 handler is installed, and `test_real_deadman.py` sends
        #     the core one.
        #   - `vitrin-core/physical-input-injector` (issue #212): otherwise
        #     `--physical-input-fd N` is an unknown argument and the core
        #     exits at parsing, so `test_input_switch.py` cannot make
        #     physical-origin input happen at all. CI has no input device and
        #     headless is the only backend it runs (D-019(4)), so this is the
        #     only way the "physical input follows the bound realm" half of
        #     #212 has a mock-free gate.
        #   - `vitrin-core/consent-injector` (issue #138): otherwise
        #     `--headless --consent=interactive --consent-injector-fd N` is
        #     refused at startup and the core `test_real_consent.py` drives
        #     never binds its socket.
        # All three features are purely additive and never enabled in a deployment
        # build (see their docs in crates/vitrin-core/Cargo.toml), so they
        # change nothing else this job builds or runs.
        if: hashFiles('tests/integration/run.sh') != ''
        run: cargo build --workspace --features vitrin-core/dead-man-injector,vitrin-core/consent-injector,vitrin-core/physical-input-injector

      - name: Build the C shim (for the real-app gate)
        # tests/integration/test_real_app.py runs the real core -> real C shim
        # -> real weston-terminal spine, with the C shim resolved from
        # VITRIN_C_SHIM_BIN (below). Ubuntu ships no wlroots-0.19, so the Meson
        # wrap builds it from source (D11) -- untimed here, outside the suite's
        # 10-minute cap, the same arrangement the warm build has. Copied from
        # the `conformance` job's recipe.
        if: hashFiles('tests/integration/run.sh') != ''
        run: |
          meson setup "${RUNNER_TEMP}/shim-build" shim
          meson compile -C "${RUNNER_TEMP}/shim-build"

      - name: What confinement this runner actually grants (diagnostic, never fails)
        # Why this exists, and why it prints rather than asserts.
        #
        # P2.6.2's first CI run died with every realm spawn refused: the
        # helper's first mount, `mount(NULL, "/", NULL, MS_REC|MS_PRIVATE,
        # NULL)`, returned EPERM on this runner while returning 0 on the
        # maintainer's Arch box (AppArmor compiled out). The isolation
        # preflight cleared the machine anyway, because it measured that a
        # user namespace could be *created* and never that a mount *inside*
        # one succeeds -- the two answers differ here.
        #
        # The preflight now probes the mount too, so a runner like this one
        # gets a named refusal with a remedy instead of a raw errno. That
        # makes this step diagnostic rather than load-bearing: it records
        # WHICH knob explains the answer, which the refusal text needs and
        # which issue #281's multi-kernel matrix wants collected from every
        # kernel CI touches. `--print-isolation` is the preflight's own
        # matrix, so the log carries the measurement and the raw evidence for
        # it side by side and either can falsify the other.
        #
        # It must never fail the job: a diagnostic that can turn a PR red
        # stops being a diagnostic and becomes a second gate nobody declared.
        if: hashFiles('tests/integration/run.sh') != ''
        continue-on-error: true
        run: |
          set +e
          echo "=== kernel ==="
          uname -srvm
          echo "=== the three knobs the preflight reads for its remedy text ==="
          for k in /proc/sys/user/max_user_namespaces \
                   /proc/sys/kernel/unprivileged_userns_clone \
                   /proc/sys/kernel/apparmor_restrict_unprivileged_userns; do
            printf '%s = %s\n' "$k" "$(cat "$k" 2>/dev/null || echo '<absent>')"
          done
          echo "=== AppArmor ==="
          printf 'module enabled = %s\n' \
            "$(cat /sys/module/apparmor/parameters/enabled 2>/dev/null || echo '<absent>')"
          printf 'this process    = %s\n' \
            "$(cat /proc/self/attr/current 2>/dev/null || echo '<absent>')"
          echo "=== the minimal repro: create a userns+mountns, then mount in it ==="
          # Two separable questions, deliberately asked as two commands: does
          # the unshare succeed, and does a mount inside it succeed? The CI
          # failure was "yes, then no", which is exactly the pair the old
          # preflight could not distinguish.
          unshare --user --map-root-user --mount true \
            && echo "unshare(CLONE_NEWUSER|CLONE_NEWNS): OK" \
            || echo "unshare(CLONE_NEWUSER|CLONE_NEWNS): FAILED rc=$?"
          unshare --user --map-root-user --mount \
            sh -c 'mount --make-rprivate / && echo "mount MS_REC|MS_PRIVATE /: OK"' \
            || echo "mount MS_REC|MS_PRIVATE /: FAILED rc=$?"
          echo "=== vitrind --print-isolation (the preflight's own matrix) ==="
          if [ -x target/debug/vitrind ]; then
            target/debug/vitrind --print-isolation || echo "(exited $?)"
          else
            echo "(target/debug/vitrind not built at this point in the job)"
          fi
          exit 0

      - name: Grant unprivileged user namespaces, and say what that costs
        # The step above measures a stock `ubuntu-latest`, and the measurement
        # is: `apparmor_restrict_unprivileged_userns=1`, so the unshare is
        # permitted, the capabilities it should confer are stripped, and the
        # first mount inside the namespace answers EACCES. `vitrind` therefore
        # refuses to start -- correctly, with a remedy naming this sysctl.
        #
        # Taking that remedy is what lets this job exercise the confinement
        # path at all. The alternative, `--isolation=off`, would keep the suite
        # green while testing an unconfined session, which is the one outcome
        # worth less than a red check.
        #
        # What it costs, said here because a sysctl in CI is exactly the kind
        # of thing that quietly becomes a lie: **after this step, this runner
        # is no longer a stock `ubuntu-latest` image.** (Named by its runner
        # label, not by a distribution release: the diagnostic above reads
        # `uname`, three sysctls and AppArmor's state, and never opens
        # /etc/os-release, so no release number here would be a measurement.)
        # Nothing downstream of it
        # may be cited as evidence about how vitrind behaves on a default
        # desktop install, and in particular issue #281's multi-kernel matrix
        # must be collected from the diagnostic step ABOVE this one, never
        # below it. The ordering is the whole point: the log carries the
        # untouched machine first and the modified one second.
        if: hashFiles('tests/integration/run.sh') != ''
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          echo "=== vitrind --print-isolation, on the machine as now modified ==="
          if [ -x target/debug/vitrind ]; then
            target/debug/vitrind --print-isolation || echo "(exited $?)"
          fi

      - name: Run headless integration suite
        if: hashFiles('tests/integration/run.sh') != ''
        # The P1.9.1 acceptance criterion, machine-enforced: the suite
        # completes in < 10 minutes or this step fails.
        timeout-minutes: 10
        # VITRIN_C_SHIM_BIN activates the M1.2 real-app gate (P1.9.6): with it
        # set, test_real_app.py runs the real chain and, being CI, FAILS rather
        # than skips if the shim or weston-terminal is missing. Unset (a
        # developer without a built C shim) it skips itself. The variable name
        # matches the `conformance` job and crates/vitrin-core/src/shim.rs's
        # own cross-track test, deliberately -- one knob for "a real C shim is
        # available here".
        env:
          VITRIN_C_SHIM_BIN: ${{ runner.temp }}/shim-build/vitrin-shim
          # ...and this makes the line above load-bearing rather than hopeful.
          # Setting VITRIN_C_SHIM_BIN only means the ladder CAN run; it does not
          # mean it DID. If the "Build the C shim" step above ever produces
          # nothing at that path, every real-app module skips itself and this
          # job stays green having collected none of the evidence the
          # milestones are cited on -- 97 tests, 25 skipped, exit 0, identical
          # to a full pass in everything CI looks at. That is issue #229, and
          # it already cost one brand-new gate (#212's test_input_switch.py)
          # its entire first life: authored, "verified", never once executed.
          # With this set, run.sh refuses to report a skipped ladder as a pass.
          VITRIN_REQUIRE_REAL_APPS: 1
          # The GTK rung (test_real_gtk.py) runs here: shim/ci/install-deps.sh
          # installs libgtk-3-dev, so the shim build above produced
          # gtk-entry-probe beside vitrin-shim, and the gate resolves it as a
          # sibling of VITRIN_C_SHIM_BIN. The M1.3 exit gate
          # (test_real_capture_fidelity.py, P1.8.5) runs here under the same
          # knob: its solid-client is co-built with the shim (a VITRIN_C_SHIM_BIN
          # sibling) and its vitrin-golden-cmp SSIM tool is built by the warm
          # `cargo build --workspace` above -- no extra CI wiring. The M1.4
          # actuation gate (test_real_actuation.py, P1.8.6) also runs here: its
          # click-target is a co-built shim sibling and its text rung reuses
          # gtk-entry-probe. The trusted-band property gate
          # (test_real_trust_band.py, issue #139) adds NO new CI wiring at all:
          # it reuses that same click-target and rides the consent-injector
          # feature the warm build already passes. The M1.5 gate
          # (test_demo.py, #110) is the same story with a fourth sibling:
          # its app is `form-target`, built unconditionally by the shim build
          # above -- no toolkit dependency, unlike gtk-entry-probe -- and
          # resolved as a VITRIN_C_SHIM_BIN sibling. Unlike weston-terminal it
          # is NOT a distro package, so a missing one is a build error and the
          # gate fails rather than skipping. The Firefox rung (test_real_firefox.py)
          # does NOT run here -- the pinned ESR is a 75 MB download this step
          # does not fetch -- so it is skipped for this suite and held by its
          # own dedicated step below, which fetches Firefox first. Without this
          # the Firefox gate would (correctly) FAIL here, VITRIN_C_SHIM_BIN
          # being set, on a browser this step never provided.
          VITRIN_SKIP_FIREFOX_GATE: "1"
        run: bash tests/integration/run.sh

      # ---- Firefox real-core render gate: the M1.2 "Shim runs Firefox"
      # render proof under the REAL core (P1.6.6). ------------------------
      # Separate from the suite above because it is HEAVY (Firefox on software
      # WebRender) and needs the 75 MB pinned ESR the suite does not fetch. It
      # is the real-core counterpart to the shim job's mock-core
      # firefox_bringup.sh -- and, unlike that declared-skip step, it actually
      # fetches the browser and runs, so the render + globals-ledger criteria
      # are held in CI rather than only on a developer machine.
      - name: Cache the pinned Firefox ESR
        if: hashFiles('tests/integration/run.sh') != ''
        uses: actions/cache@v4
        with:
          # Keyed on the pin: a new firefox-esr.pin (a deliberate ESR bump)
          # invalidates the cache and re-fetches, exactly as intended.
          #
          # NOTE what this caches: shim/.firefox holds the UNPACKED browser as
          # well as the tarball, so a restored cache is an installed tree, not
          # just verified bytes. Issue #298 is what happens when the two are
          # confused. The fetch step below re-checks the unpacked tree against
          # the pin's application.ini Version/BuildID on every run and
          # re-extracts if it has moved, so a cache entry that carried a
          # self-updated browser is repaired rather than believed.
          path: shim/.firefox
          key: firefox-esr-${{ hashFiles('shim/tests/firefox/firefox-esr.pin') }}

      - name: "Firefox real-core render gate (real vitrind -> real vitrin-shim -> Firefox)"
        # tests/integration/test_real_firefox.py boots the shipped vitrind ->
        # the built C shim -> the pinned Firefox and asserts a real Firefox
        # frame of a solid-colour file:// page is captured with the served
        # colour dominant, plus that Firefox demanded no global outside
        # shim/docs/firefox-refused-globals.txt. VITRIN_C_SHIM_BIN is set and
        # VITRIN_SKIP_FIREFOX_GATE is NOT, so it FAILS-not-skips if the shim or
        # the browser is missing -- the firefox_bringup.sh discipline, now with
        # the browser actually fetched. The extra apt packages are Firefox's
        # runtime libraries beyond the libgtk-3 the shim deps already install;
        # if a future ESR needs more, this step fails loudly naming the missing
        # library, which is the gap-closing procedure, not a silent skip.
        #
        # BOUNDED, added for issue #288. `-p 'test_real_firefox.py'` is a name
        # filter, and this is the FOURTH filtered test step in this workflow --
        # the one the `rust` job's note about floors originally missed. Rename
        # or move the module and `unittest discover` collects nothing, prints
        # `Ran 0 tests in 0.000s` followed by `OK`, and exits 0: the browser
        # was fetched, the shim was built, and the render gate this job is
        # cited for proved nothing. So the run is teed and `Ran N` is read back
        # with N >= 1 required -- the shell's `--min-tests`, unittest having no
        # equivalent of its own.
        if: hashFiles('tests/integration/run.sh') != ''
        env:
          VITRIN_C_SHIM_BIN: ${{ runner.temp }}/shim-build/vitrin-shim
        run: |
          sudo apt-get install -y -qq libasound2t64 libdbus-glib-1-2 libseccomp2
          bash shim/tests/firefox/fetch-esr.sh
          log="${RUNNER_TEMP}/firefox-gate.log"
          PYTHONPATH="$PWD/sdk/python/src" VITRIN_REPO="$PWD" \
            python3 -m unittest discover -s tests/integration -p 'test_real_firefox.py' -v \
            2>&1 | tee "$log"
          status="${PIPESTATUS[0]}"
          [ "$status" -eq 0 ] || exit "$status"
          ran="$(sed -n 's/^Ran \([0-9][0-9]*\) test.*/\1/p' "$log" | tail -1)"
          if [ -z "$ran" ] || [ "$ran" -lt 1 ]; then
            echo "::error::the Firefox real-core gate collected ${ran:-no} test(s). \`unittest discover -p 'test_real_firefox.py'\` is a NAME FILTER, and a filter that matches nothing prints 'OK' and exits 0 -- this step would be green having rendered nothing. Restore tests/integration/test_real_firefox.py under that name, or retire this step in the same commit."
            exit 1
          fi
          echo "Firefox real-core gate: ${ran} test(s) actually ran"

      - name: Integration suite DORMANT
        if: hashFiles('tests/integration/run.sh') == ''
        run: |
          echo "::notice title=integration job dormant::tests/integration/run.sh has not landed yet (needs P1.3.x headless + P1.8.x SDK) -- the integration steps were skipped, not passed. This green check is vacuous until then."
          {
            echo "## integration job: DORMANT"
            echo ""
            echo "\`tests/integration/run.sh\` has not landed yet (needs P1.3.x headless +"
            echo "P1.8.x SDK), so no integration test ran -- this job's green check is"
            echo "vacuous for now. Do not add it to branch protection until it activates."
            echo "Entry-point contract: \`tests/integration/README.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # =====================================================================
  # The AppArmor profile job (issue #286).
  #
  # THIS JOB IS THE DELIVERABLE; packaging/apparmor/vitrind is the thing it
  # measures. The profile was written on a machine with AppArmor compiled out
  # (`/sys/module/apparmor/parameters/enabled` = N), so it has never been
  # parsed, loaded, attached or observed by anyone who wrote it. Nothing in
  # this repository other than this job can say whether it works.
  #
  # WHAT MAKES IT DIFFERENT FROM EVERY OTHER JOB HERE, and the one rule that
  # must survive every future edit: **it does not touch
  # `kernel.apparmor_restrict_unprivileged_userns`.** The `rust` job's "Grant
  # unprivileged user namespaces" step and the `integration` job's step of the
  # same name both set it to 0, because
  # otherwise their suites could not exercise confinement at all. That is the
  # right trade there and the wrong one here: this job's entire value is being
  # the one place in this workflow that runs on a machine CI has not modified.
  # A future edit that adds the sysctl to this job does not weaken it, it
  # DELETES it -- every result below would then be measured on the same
  # already-granting machine the other two jobs measure, and the profile would
  # be unexercised while this job stayed green. The precondition step is
  # written to make that edit fail loudly rather than pass quietly.
  #
  # DESIGN RULE: exactly THREE steps may fail the job -- the precondition, the
  # real-app gate, and the final verdict. Everything between them runs under
  # `set +e` and exits 0 no matter what it finds, so one run yields every
  # answer instead of dying at the first surprise. That would ordinarily be a
  # silent-no-op hazard (issue #288), so it is closed the other way round: each
  # step appends `RESULT <key>=<value>` to a file, and the verdict step FAILS
  # if any expected key is missing. A step that quietly did nothing is
  # therefore a red job, not a green one.
  # =====================================================================
  apparmor-profile:
    name: apparmor profile (stock ubuntu-latest -- NO sysctl)
    runs-on: ubuntu-latest
    # Wider than the integration job's suite budget because this job builds
    # the workspace AND the wlroots subproject cold on its first run, and then
    # boots a core repeatedly: a baseline spawn, a profiled spawn, the
    # real-app gate's own two, and the lever's two.
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "PRECONDITION: this runner must still restrict unprivileged userns"
        # The first of the three steps allowed to fail, and it fails BEFORE
        # anything is built, because everything after it is worthless if this
        # is not true.
        #
        # `kernel.apparmor_restrict_unprivileged_userns=1` is the state issue
        # #286 measured on a stock `ubuntu-latest` on 2026-08-14, and it is the
        # state the profile exists to work under. If it reads 0 or is absent,
        # this runner grants unprivileged user namespaces to everyone and every
        # later step here would pass whether the profile did anything or not --
        # a green job proving nothing, which is the exact shape this repository
        # has been bitten by three times (#229, #186, #288). So it is a hard
        # failure and not a skip: a skip would be indistinguishable, in this
        # job's check mark, from a run that measured the profile working.
        #
        # Two ways it can go red, and the error text separates them, because
        # the remedies are opposite: a runner image that stopped shipping the
        # restriction is news about Ubuntu and means this job (and #286) need
        # re-deriving; a step added above this one that flipped the sysctl is a
        # bug in this file.
        run: |
          knob=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          value="$(cat "$knob" 2>/dev/null || echo '<absent>')"
          echo "$knob = $value"
          if [ "$value" != "1" ]; then
            echo "::error title=this job measured nothing::${knob} reads '${value}', not '1'. This job exists to run on a STOCK ubuntu-latest, where that knob is 1 and vitrind therefore cannot start without an AppArmor profile (issue #286). At any other value this runner already grants unprivileged user namespaces, so loading packaging/apparmor/vitrind would change nothing and every step below would pass without the profile doing any work. Either (a) some step in THIS job now sets the sysctl -- delete it, the rust and integration jobs are where that belongs -- or (b) the runner image genuinely stopped restricting, which is news: re-measure, and re-derive issue #286 and every sentence in docs/book/src/limits.md that rests on it."
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}"
          printf 'RESULT precondition_sysctl=%s\n' "$value" >> "${RUNNER_TEMP}/apparmor-results"

      - name: "Record the unmodified machine (never fails)"
        # #281's multi-kernel matrix wants a row from every kernel CI touches,
        # and this is the only row collected from a runner nothing has
        # modified -- the integration job's equivalent step is also
        # pre-sysctl, but this one has no sysctl anywhere after it at all.
        #
        # It also answers a question the research for #286 could not: whether
        # `apparmor_parser` is even present on a stock image. The runner-images
        # package manifest does not enumerate base-system packages, so this is
        # MEASURED here rather than assumed.
        #
        # If it is missing the job installs it -- and the install is NOT a
        # userspace-only change, which an earlier version of this comment
        # claimed. Installing the `apparmor` package runs its maintainer
        # scripts and its systemd unit, and those load every profile under
        # /etc/apparmor.d into the KERNEL. On Ubuntu that set includes
        # `unprivileged_userns`, which is directly relevant to what this job
        # measures. So the honest statement is: after an install, this runner
        # carries kernel policy it did not boot with.
        #
        # Two things keep that from silently invalidating the job rather than
        # merely being disclosed. The sysctl this job's entire claim rests on
        # is RE-READ after the install and the job dies if it moved, and the
        # unprofiled repro is re-run so the log carries a post-install control
        # as well as a pre-install one. `parser_present` records which path
        # was taken, and the VERDICT step reads it -- a run on an image that
        # already had the parser is a stronger result than one that did not,
        # and the two must not be indistinguishable in the summary.
        run: |
          set +e
          results="${RUNNER_TEMP}/apparmor-results"
          echo "=== kernel and image ==="
          uname -srvm
          cat /etc/os-release
          echo "=== the four knobs (the fourth sizes what the profile COSTS) ==="
          for k in /proc/sys/user/max_user_namespaces \
                   /proc/sys/kernel/unprivileged_userns_clone \
                   /proc/sys/kernel/apparmor_restrict_unprivileged_userns \
                   /proc/sys/kernel/apparmor_restrict_unprivileged_unconfined; do
            printf '%s = %s\n' "$k" "$(cat "$k" 2>/dev/null || echo '<absent>')"
          done
          printf 'RESULT unconfined_knob=%s\n' \
            "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_unconfined 2>/dev/null || echo absent)" \
            >> "$results"
          echo "=== AppArmor, as the kernel reports it ==="
          module="$(cat /sys/module/apparmor/parameters/enabled 2>/dev/null || echo '<absent>')"
          printf 'module enabled  = %s\n' "$module"
          printf 'this shell      = %s\n' \
            "$(cat /proc/self/attr/apparmor/current 2>/dev/null \
               || cat /proc/self/attr/current 2>/dev/null || echo '<absent>')"
          printf 'RESULT apparmor_module=%s\n' "$module" >> "$results"
          echo "--- securityfs feature set (does this kernel know the userns rule class?) ---"
          ls /sys/kernel/security/apparmor/features/ 2>&1
          cat /sys/kernel/security/apparmor/features/policy/versions 2>&1
          ls /sys/kernel/security/apparmor/features/policy/ 2>&1
          echo "=== userspace tooling ==="
          command -v apparmor_parser aa-status aa-exec
          if command -v apparmor_parser >/dev/null 2>&1; then
            printf 'RESULT parser_present=stock\n' >> "$results"
          else
            echo "::warning title=image modified::apparmor_parser is NOT on the stock image; installing the apparmor package. This LOADS KERNEL POLICY -- the package's maintainer scripts and unit load every profile under /etc/apparmor.d, which on Ubuntu includes unprivileged_userns. Everything measured after this point is measured on a runner carrying policy it did not boot with. The sysctl this job rests on is re-read below and the job dies if it moved."
            sudo apt-get update -qq && sudo apt-get install -y -qq apparmor
            if command -v apparmor_parser >/dev/null 2>&1; then
              printf 'RESULT parser_present=installed\n' >> "$results"
            else
              printf 'RESULT parser_present=no\n' >> "$results"
            fi
          fi
          apparmor_parser --version 2>&1
          echo "=== what policy is already loaded (BEFORE this job loads anything) ==="
          # Two things are being looked for: a profile already named `vitrind`
          # (a name collision would make the load below ambiguous), and any
          # loaded profile whose attachment could catch the shim or the app and
          # turn their execve into a denied no_new_privs transition.
          sudo aa-status 2>&1 | head -80
          echo "=== the minimal repro, unprofiled ==="
          unshare --user --map-root-user --mount true \
            && echo "unshare(CLONE_NEWUSER|CLONE_NEWNS): OK" \
            || echo "unshare(CLONE_NEWUSER|CLONE_NEWNS): FAILED rc=$?"
          unshare --user --map-root-user --mount \
            sh -c 'mount --make-rprivate / && echo "mount MS_REC|MS_PRIVATE /: OK"' \
            || echo "mount MS_REC|MS_PRIVATE /: FAILED rc=$?"
          # ---- the premise, re-measured after anything this step did -------
          #
          # The precondition step read this knob BEFORE the branch above could
          # install a package that loads kernel policy. Re-read it here so the
          # claim "this job ran on a machine that still restricts unprivileged
          # user namespaces" is measured at the point it starts mattering,
          # rather than inherited from a reading taken before the only step
          # that could have invalidated it.
          #
          # Recorded on BOTH paths, not just the install path, so the VERDICT
          # can require the key: a value that only exists sometimes cannot be
          # used to catch a step that silently did nothing. On the stock path
          # it is simply the same reading twice, which is the cheapest possible
          # way to make the pair comparable in the summary table.
          #
          # This is a hard exit inside an otherwise never-fails step, and that
          # exception is deliberate: every other failure here costs the run one
          # answer, whereas this one makes every answer below meaningless.
          after="$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo '<absent>')"
          printf 'RESULT sysctl_after_setup=%s\n' "$after" >> "$results"
          if [ "$after" != "1" ]; then
            echo "::error title=the premise changed inside this step::kernel.apparmor_restrict_unprivileged_userns read 1 at the precondition and reads '${after}' now. The only thing this step does that could move it is installing the apparmor package, whose maintainer scripts and unit load every profile under /etc/apparmor.d into the kernel. This runner now grants unprivileged user namespaces, so every step below would pass without the profile doing any work. Do not weaken this check: the remedy is a runner image that already ships apparmor_parser, or a job that stops installing it."
            exit 1
          fi
          exit 0

      - name: Install Rust (pinned toolchain + components from rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Same reasoning as the integration job: a red first run must still
          # bank the build, or every retry is equally cold.
          cache-on-failure: true

      - name: Install native build deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxkbcommon-dev libpixman-1-dev

      - name: Install Meson + wlroots subproject build dependencies
        # Same script, from the same file, as `conformance`, `shim` and
        # `integration`, so no fourth build of the shim can drift in its
        # dependency set.
        run: sudo bash shim/ci/install-deps.sh

      - name: Warm build (workspace)
        # The feature list is copied from the `integration` job deliberately,
        # and for exactly one reason:
        # `tests/integration/test_real_confinement.py` runs in both jobs and a
        # difference in features would mean the two runs measured two
        # different binaries while reporting the same gate's name.
        #
        # It does NOT make the two jobs share a cache entry, which an earlier
        # version of this comment claimed. `Swatinem/rust-cache` puts the job
        # name in its key unless a `shared-key` is set, and neither job sets
        # one, so this job has its own entry and pays its own cold first
        # build. That is left as it is rather than "fixed": a shared key
        # couples two jobs' cache lifetimes, and the compile cost is paid once
        # per key, not per run.
        run: cargo build --workspace --features vitrin-core/dead-man-injector,vitrin-core/consent-injector,vitrin-core/physical-input-injector

      - name: Build the C shim
        run: |
          meson setup "${RUNNER_TEMP}/shim-build" shim
          meson compile -C "${RUNNER_TEMP}/shim-build"

      - name: "Install vitrind and its helper where the profile attaches"
        # AppArmor attaches to a binary's RESOLVED ABSOLUTE PATHNAME, so a
        # profile written for an installed vitrind cannot be exercised against
        # `target/debug/vitrind`. Three ways to close that gap were available
        # and two are refused:
        #
        #  * glob the build tree in the profile -- makes the profile a CI-only
        #    template, so the run would measure a construct rather than the
        #    shipped artefact, and Chromium's own documentation warns that a
        #    build-directory glob lets anyone who can write an executable of
        #    the right name there borrow the grant;
        #  * `aa-exec -p vitrind -- ./target/debug/vitrind` -- measures a
        #    DIFFERENT entry path than production, and is itself the documented
        #    bypass vector, so making it the tested path would normalise the
        #    wrong thing.
        #
        # So: install the real binaries at the real path the shipped profile
        # names. `install` COPIES; it must never become `ln -s`, because both
        # AppArmor's attachment and vitrind's own `current_exe()` helper lookup
        # resolve symlinks, and a symlink here would attach the profile to
        # nothing at all with no symptom but the original EACCES. `readlink -f`
        # below is what makes that a checked fact rather than a hope.
        run: |
          sudo install -d -m 0755 /usr/lib/vitrin
          sudo install -m 0755 target/debug/vitrind target/debug/vitrin-realm-init /usr/lib/vitrin/
          # The two deliberately-broken helpers the confinement gate needs, from
          # crates/vitrin-realm-init-fixtures. They are not part of the profile's
          # attachment glob and get no grant -- being refused is their whole job --
          # but `test_real_confinement.py` resolves them as siblings of the helper,
          # so installing vitrind here without them makes that gate fail for a
          # reason that has nothing to do with AppArmor. It did, on this job's
          # first real run: 8 executed, 2 failed, both "is missing".
          sudo install -m 0755 target/debug/unshare-only-init \
                               target/debug/leaks-a-dirfd-init /usr/lib/vitrin/
          results="${RUNNER_TEMP}/apparmor-results"
          real_core="$(readlink -f /usr/lib/vitrin/vitrind)"
          real_helper="$(readlink -f /usr/lib/vitrin/vitrin-realm-init)"
          echo "vitrind          -> $real_core"
          echo "vitrin-realm-init -> $real_helper"
          ls -l /usr/lib/vitrin/
          if [ "$real_core" = "/usr/lib/vitrin/vitrind" ] \
             && [ "$real_helper" = "/usr/lib/vitrin/vitrin-realm-init" ]; then
            printf 'RESULT install_real=yes\n' >> "$results"
          else
            echo "::warning::/usr/lib/vitrin holds symlinks, not files. The profile will attach to nothing."
            printf 'RESULT install_real=no\n' >> "$results"
          fi

      - name: "BASELINE: the machine before any profile exists (never fails)"
        # The control the whole job rests on. A later success means nothing
        # without this: if the runner already granted the namespace, every
        # measurement after the load would look like the profile working.
        #
        # `apparmor.label` is read as well as the tier, and that row is why
        # `crates/vitrin-core/src/spawn/isolation.rs` grew it. Three of this
        # job's four possible outcomes produce `mount.in_userns=
        # restricted-by-policy(errno=13)`; only the label separates "no profile
        # attached" from "a profile attached and granted nothing".
        run: |
          set +e
          results="${RUNNER_TEMP}/apparmor-results"
          echo "=== /usr/lib/vitrin/vitrind --print-isolation, NO profile loaded ==="
          out="$(/usr/lib/vitrin/vitrind --print-isolation 2>&1)"
          echo "$out"
          for key in tier apparmor.label mount.in_userns; do
            value="$(printf '%s\n' "$out" | sed -n "s/^${key}=//p" | tail -1)"
            printf 'RESULT baseline_%s=%s\n' \
              "$(printf '%s' "$key" | tr '.' '_')" "${value:-<unread>}" >> "$results"
          done
          exit 0

      - name: "BASELINE: a realm spawn, before any profile exists (never fails)"
        # The core's own preflight refusing is NOT the claim this job is about.
        # The claim is that a REALM spawns, and the process that issues the
        # `unshare` is `vitrin-realm-init`, which vitrind reaches by execve --
        # so only a real spawn can answer whether a grant survives that exec.
        #
        # Expected here: `refusal`, with issue #286's signature. If this
        # reports `spawned-anyway`, the precondition step's assumption is false
        # in some way the sysctl did not reveal and the verdict step says so.
        env:
          VITRIN_CORE_BIN: /usr/lib/vitrin/vitrind
        run: |
          set +e
          results="${RUNNER_TEMP}/apparmor-results"
          PYTHONPATH="$PWD/sdk/python/src" VITRIN_REPO="$PWD" \
            python3 tests/integration/apparmor-realm-probe.py --expect refusal
          rc=$?
          printf 'RESULT baseline_spawn=%s\n' \
            "$([ "$rc" -eq 0 ] && echo refused-as-expected || echo unexpected)" >> "$results"
          exit 0

      - name: "Does the profile COMPILE? (parser only, kernel untouched)"
        # `-Q/--skip-kernel-load` performs every action except loading, which
        # separates two failures that otherwise look the same from the outside:
        # "this is not valid policy for this parser" and "the kernel refused
        # the compiled policy". They have different remedies and the first one
        # is entirely the profile author's fault.
        run: |
          set +e
          results="${RUNNER_TEMP}/apparmor-results"
          sudo install -m 0644 packaging/apparmor/vitrind /etc/apparmor.d/vitrind
          echo "=== the profile as installed ==="
          grep -v '^#' /etc/apparmor.d/vitrind | grep -v '^[[:space:]]*$'
          echo "=== apparmor_parser -Q --warn=all ==="
          sudo apparmor_parser -Q --warn=all -r /etc/apparmor.d/vitrind
          rc=$?
          printf 'RESULT compiles=%s\n' "$([ "$rc" -eq 0 ] && echo yes || echo no)" >> "$results"
          exit 0

      - name: "Does the profile LOAD? (never fails)"
        # Two independent facts, because either can be true without the other:
        # the parser's exit code, and the profile appearing in the KERNEL's own
        # list. `apparmor_parser -r` replaces live policy; no reboot is
        # involved. (An earlier draft cited Ubuntu's shipped `bwrap` profile
        # here. That attribution was wrong -- `bwrap-userns-restrict` is not in
        # 24.04's `apparmor` package at all -- and `packaging/apparmor/vitrind`
        # records the correction. The `-r` behaviour is from apparmor_parser's
        # own manual, not from any distro's instructions.)
        run: |
          set +e
          results="${RUNNER_TEMP}/apparmor-results"
          sudo apparmor_parser -r /etc/apparmor.d/vitrind
          rc=$?
          echo "apparmor_parser -r exit=$rc"
          echo "=== the kernel's own list ==="
          sudo aa-status 2>&1 | grep -F vitrind
          listed=$?
          if [ "$rc" -eq 0 ] && [ "$listed" -eq 0 ]; then
            printf 'RESULT loaded=yes\n' >> "$results"
          else
            printf 'RESULT loaded=no\n' >> "$results"
          fi
          exit 0

      - name: "Did it ATTACH to vitrind? (never fails)"
        # The step that separates "loaded but did not apply" from "applied".
        # A label still reading `unconfined` means the attachment path in the
        # profile does not match where the binary actually is; a label reading
        # `vitrind` with the mount row still at errno=13 means it attached and
        # granted nothing, which is the `unprivileged_userns` fallback
        # signature and is byte-identical, in errno, to the baseline.
        run: |
          set +e
          results="${RUNNER_TEMP}/apparmor-results"
          echo "=== /usr/lib/vitrin/vitrind --print-isolation, profile LOADED ==="
          out="$(/usr/lib/vitrin/vitrind --print-isolation 2>&1)"
          echo "$out"
          for key in tier apparmor.label mount.in_userns; do
            value="$(printf '%s\n' "$out" | sed -n "s/^${key}=//p" | tail -1)"
            printf 'RESULT profiled_%s=%s\n' \
              "$(printf '%s' "$key" | tr '.' '_')" "${value:-<unread>}" >> "$results"
          done
          exit 0

      - name: "Did the grant reach the HELPER? A real realm spawn (never fails)"
        # THE CENTRAL QUESTION, and the reason this job exists rather than a
        # step that just runs `--print-isolation` twice.
        #
        # `vitrind` forks (never execs) for its own preflight probe, so the
        # preflight clearing proves only that vitrind's own label carries the
        # grant. The six-flag `unshare` and the `MS_REC|MS_PRIVATE` remount
        # that fails on an unprofiled Ubuntu host both happen in
        # `vitrin-realm-init`, one execve away. If the grant does not survive
        # that exec, this profile fixes the core's startup and NOT the realm's
        # spawn -- which is worse than shipping nothing, because the refusal
        # moves somewhere less legible.
        #
        # The probe prints the label of every process in the spine, so the log
        # answers the exec-transition question directly rather than by
        # inference.
        env:
          VITRIN_CORE_BIN: /usr/lib/vitrin/vitrind
        run: |
          set +e
          results="${RUNNER_TEMP}/apparmor-results"
          PYTHONPATH="$PWD/sdk/python/src" VITRIN_REPO="$PWD" \
            python3 tests/integration/apparmor-realm-probe.py --expect spawn
          rc=$?
          printf 'RESULT spawn=%s\n' "$([ "$rc" -eq 0 ] && echo ok || echo failed)" >> "$results"
          exit 0

      - name: "The real-app confinement gate, under the profile"
        # The second of the three steps allowed to fail. The step above proves
        # a realm spawns; this proves a realm WORKS -- the real C shim, a real
        # Wayland client that paints, and the canary assertions that make the
        # confinement claim mean something. It is the repository's own
        # mock-free confinement gate (issue #186), run for the first time
        # against an installed vitrind under an AppArmor profile.
        #
        # BOUNDED TWICE, and the second bound is the one that matters. This is
        # the FIFTH filtered step in this workflow; the list in the `rust`
        # job's `cargo test --release` comment names them all.
        #
        #  1. `-p 'test_real_confinement.py'` is a NAME FILTER, and a filter
        #     that matches nothing prints `Ran 0 tests` followed by `OK` and
        #     exits 0. So the run is teed and `Ran N` is read back with N >= 1
        #     required -- the shell's `--min-tests`, unittest having none.
        #
        #  2. **`Ran N` COUNTS SKIPPED TESTS**, which makes bound 1 alone the
        #     re-creation of issue #229 in a new job. Every module in the
        #     real-app ladder skips itself when `VITRIN_C_SHIM_BIN` is unset or
        #     unusable; a skipped gate prints `Ran 1 test ... OK (skipped=1)`
        #     and exits 0, which is byte-identical in everything this step
        #     looked at to a gate that actually confined something. That is the
        #     exact shape #229 and #288 each closed once, and a job that
        #     re-opens it is worse than one that never had the check, because
        #     the check reads like protection.
        #
        # So this step reproduces `tests/integration/run.sh`'s census posture
        # rather than paraphrasing it -- it cannot CALL run.sh, which runs the
        # whole suite, so it applies run.sh's three rules to a filtered run:
        #
        #   * ITEMISE every skip by name (run.sh: "skips are itemised rather
        #     than counted"), so the log says what did not run;
        #   * FAIL on the skip classes that are always a misconfiguration here
        #     -- the shim variables. This job sets `VITRIN_C_SHIM_BIN` and
        #     builds the shim itself, so a shim skip means the build step
        #     broke, which is run.sh's `VITRIN_REQUIRE_REAL_APPS=1` rule;
        #   * require at least one test to have EXECUTED, i.e. `ran - skipped
        #     >= 1`. This is the generic form of the rule and it is what stops
        #     a future skip class nobody anticipated from emptying the gate
        #     silently.
        #
        # What it deliberately does NOT do is fail on every skip, for run.sh's
        # stated reason: `test_real_confinement.py` legitimately skips its
        # `/dev/input` assertion on a runner with no input devices, and that is
        # an honest machine state rather than a misconfiguration. Turning it
        # red would make the gate unrunnable on the only machine it runs on.
        env:
          VITRIN_CORE_BIN: /usr/lib/vitrin/vitrind
          VITRIN_C_SHIM_BIN: ${{ runner.temp }}/shim-build/vitrin-shim
        run: |
          log="${RUNNER_TEMP}/confinement-under-profile.log"
          results="${RUNNER_TEMP}/apparmor-results"
          set +e
          PYTHONPATH="$PWD/sdk/python/src" VITRIN_REPO="$PWD" \
            python3 -m unittest discover -s tests/integration -p 'test_real_confinement.py' -v \
            2>&1 | tee "$log"
          status="${PIPESTATUS[0]}"
          set -e

          ran="$(sed -n 's/^Ran \([0-9][0-9]*\) test.*/\1/p' "$log" | tail -1)"
          if [ -z "$ran" ] || [ "$ran" -lt 1 ]; then
            printf 'RESULT realapp=collected-nothing\n' >> "$results"
            echo "::error::the real-app confinement gate collected ${ran:-no} test(s). \`unittest discover -p 'test_real_confinement.py'\` is a NAME FILTER, and a filter that matches nothing exits 0 having proved nothing. Restore tests/integration/test_real_confinement.py under that name, or retire this step in the same commit."
            exit 1
          fi

          # The census. `grep -c` exits 1 on zero matches, hence the `|| true`
          # -- the same spelling run.sh uses, for the same reason.
          skipped=$(grep -c '\.\.\. skipped' "$log" || true)
          executed=$(( ran - skipped ))
          # Recorded HERE, before any of the three gates below can exit, so the
          # VERDICT step gets the number even on a red run. A required key that
          # only exists on the happy path turns every real failure into a
          # "missing key" verdict and buries the actual diagnosis.
          printf 'RESULT realapp_executed=%s\n' "$executed" >> "$results"
          if [ "$skipped" -ne 0 ]; then
            echo "==> $skipped of $ran test(s) SKIPPED under the profile. This step did not exercise:"
            grep '\.\.\. skipped' "$log" | sed 's/^/      /'
          fi

          # Matched on the gate's own two spellings rather than on the bare
          # variable name, which also appears inside unrelated assertion
          # messages: `'VITRIN_C_SHIM_BIN is unset'` is run.sh's own needle for
          # the skip, and the second is the module's set-but-unusable failure.
          shim_skips=$(grep -cE 'VITRIN_C_SHIM_BIN is unset|VITRIN_C_SHIM_BIN=.* does not name an executable' "$log" || true)
          if [ "$shim_skips" -ne 0 ]; then
            printf 'RESULT realapp=shim-skipped\n' >> "$results"
            echo "::error::the real-app confinement gate skipped for want of a usable VITRIN_C_SHIM_BIN, and this job both sets that variable and builds the shim itself -- so the shim build step produced nothing at ${VITRIN_C_SHIM_BIN}. This is issue #229's exact shape: a green step, a gate that never ran, and an AppArmor profile with no real-app evidence behind it. Fix the shim build; do not relax this check."
            exit 1
          fi

          if [ "$executed" -lt 1 ]; then
            printf 'RESULT realapp=all-skipped\n' >> "$results"
            echo "::error::the real-app confinement gate collected ${ran} test(s) and skipped all ${skipped} of them, so it EXECUTED nothing. \`Ran N\` counts skips, which is why N >= 1 is not on its own a bound. Read the itemised skip list above: whatever it names is what has to be provided on this runner before this step can be cited as evidence about the profile."
            exit 1
          fi

          if [ "$status" -eq 0 ]; then
            printf 'RESULT realapp=pass\n' >> "$results"
          else
            printf 'RESULT realapp=fail\n' >> "$results"
          fi
          echo "real-app confinement gate: ${ran} collected, ${skipped} skipped, ${executed} executed, exit ${status}"
          exit "$status"

      - name: "The kernel's own account of what it denied (never fails)"
        # Runs unconditionally, pass or fail, because a denial record names the
        # profile, the operation and the requested mask -- which is the fastest
        # way to read any of the failures above, and useless if it is only
        # collected when things went well.
        if: always()
        run: |
          set +e
          echo "=== dmesg ==="
          sudo dmesg 2>&1 | grep -i apparmor | tail -60
          echo "=== journalctl -k ==="
          sudo journalctl -k --no-pager 2>&1 | grep -i 'apparmor=' | tail -60
          echo "=== audit log, if there is one ==="
          sudo cat /var/log/audit/audit.log 2>/dev/null | grep -i apparmor | tail -40
          exit 0

      - name: "THE LEVER: break it, confirm FAIL, restore"
        # Non-vacuity, and the whole job is worth nothing without it. Every
        # green result above is also what a runner whose policy had drifted
        # would produce -- the profile is not the only thing on this machine
        # that could be granting a user namespace, and a job that cannot tell
        # those apart is a job that measured the runner rather than the
        # profile.
        #
        # So: REMOVE the profile from the kernel, spawn again, and require the
        # spawn to fail with issue #286's exact signature. Then put it back and
        # require the spawn to work again. Two directions, because only the
        # pair rules out "it was always going to spawn" and "it was never going
        # to spawn".
        #
        # This is distinct from the BASELINE steps near the top, which measured
        # the machine before the profile ever existed. That establishes what
        # the untouched runner does; this establishes that the profile is what
        # changed it. A run can pass the first and fail this one -- for
        # instance if loading the profile permanently altered something else --
        # and the two names in the summary keep that legible.
        if: always()
        env:
          VITRIN_CORE_BIN: /usr/lib/vitrin/vitrind
        run: |
          set +e
          results="${RUNNER_TEMP}/apparmor-results"
          echo "=== removing the profile from the kernel ==="
          sudo apparmor_parser -R /etc/apparmor.d/vitrind
          echo "apparmor_parser -R exit=$?"
          sudo aa-status 2>&1 | grep -F vitrind || echo "(no vitrind profile listed -- removed)"
          PYTHONPATH="$PWD/sdk/python/src" VITRIN_REPO="$PWD" \
            python3 tests/integration/apparmor-realm-probe.py --expect refusal
          without=$?
          printf 'RESULT lever_without=%s\n' \
            "$([ "$without" -eq 0 ] && echo refused || echo still-spawned)" >> "$results"
          echo "=== restoring the profile ==="
          sudo apparmor_parser -r /etc/apparmor.d/vitrind
          echo "apparmor_parser -r exit=$?"
          PYTHONPATH="$PWD/sdk/python/src" VITRIN_REPO="$PWD" \
            python3 tests/integration/apparmor-realm-probe.py --expect spawn
          restored=$?
          printf 'RESULT lever_restored=%s\n' \
            "$([ "$restored" -eq 0 ] && echo ok || echo failed)" >> "$results"
          exit 0

      - name: "VERDICT"
        # The last of the three steps allowed to fail, and the only one that
        # reads the whole run. It does two things nothing else can:
        #
        #  1. It requires every expected RESULT key to be PRESENT. Every step
        #     above exits 0 by construction, which would otherwise mean a step
        #     that silently did nothing left the job green -- issue #288's
        #     defect, rebuilt by accident. A missing key is a red job.
        #  2. It prints the decision table, so a failing run names WHICH of the
        #     four possible failures happened instead of leaving a reader to
        #     reconstruct it from six step logs.
        if: always()
        run: |
          set +e
          results="${RUNNER_TEMP}/apparmor-results"
          echo "=== every result this run recorded ==="
          cat "$results" 2>/dev/null || echo "(no results file at all)"

          get() { sed -n "s/^RESULT $1=//p" "$results" 2>/dev/null | tail -1; }
          # `unconfined_knob` and `sysctl_after_setup` are in this list on
          # purpose, and neither feeds the ladder below. The list is not "keys
          # the verdict consults" -- it is "measurements this run promised to
          # take", and the whole point of requiring them is that a step which
          # exited 0 having recorded nothing must be red. A key the ladder
          # ignores is exactly the key most likely to be quietly dropped.
          # `unconfined_knob` in particular SIZES THE PUBLISHED SECURITY COST
          # of this profile (docs/book/src/limits.md, SECURITY.md): if it stops
          # being collected, the pages keep asserting a cost that CI no longer
          # measures anywhere.
          missing=""
          for key in precondition_sysctl sysctl_after_setup unconfined_knob \
                     apparmor_module parser_present install_real \
                     baseline_tier baseline_apparmor_label baseline_mount_in_userns \
                     baseline_spawn compiles loaded profiled_tier profiled_apparmor_label \
                     profiled_mount_in_userns spawn realapp realapp_executed \
                     lever_without lever_restored; do
            [ -n "$(get "$key")" ] || missing="$missing $key"
          done

          {
            echo "## AppArmor profile (issue #286)"
            echo ""
            echo "| key | value |"
            echo "|---|---|"
            sed -n 's/^RESULT \([^=]*\)=\(.*\)$/| `\1` | `\2` |/p' "$results" 2>/dev/null
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$missing" ]; then
            echo "::error title=a step recorded nothing::these results are missing:${missing}. Either an earlier step failed outright -- check its own red mark first -- or a step ran, exited 0 and recorded nothing. Every step in this job exits 0 by construction so that one run answers every question; the price of that is that a step which silently did nothing looks exactly like a step that ran, and this check is what makes it not look like that."
            exit 1
          fi

          label="$(get profiled_apparmor_label)"
          verdict=""
          # The FIRST rung is the tool, not the policy, and it has to be:
          # `apparmor_parser` is what produces `compiles` and `loaded`, so on a
          # runner without it both read `no` and every rung below would
          # diagnose a missing tool as a defect in the profile. "This is not
          # valid policy for this parser" is the wrong sentence to print when
          # there was no parser, and it is the sentence that would send
          # somebody to rewrite a file that is fine.
          if [ "$(get parser_present)" = "no" ]; then
            verdict="THIS RUN MEASURED NOTHING ABOUT THE PROFILE: there is no apparmor_parser on this runner and installing the apparmor package did not provide one. Nothing here is a statement about packaging/apparmor/vitrind -- it compiled nowhere, loaded nowhere and attached to nothing, because the tool that does all three is absent. Fix the runner or the install; do not read the rungs below."
          elif [ "$(get compiles)" != "yes" ]; then
            verdict="the profile is NOT VALID POLICY for this parser. Read the parser's stderr in the compile step; nothing after it means anything."
          elif [ "$(get loaded)" != "yes" ]; then
            verdict="the profile COMPILED BUT DID NOT LOAD -- the kernel refused it, or apparmor_parser -r failed. This is a kernel/policy-version problem, not a syntax one."
          elif [ "$label" = "<unread>" ]; then
            verdict="the profile loaded, and this run CANNOT SAY whether it attached: \`--print-isolation\` printed no \`apparmor.label\` row. Either the installed binary predates that row (crates/vitrin-core/src/spawn/isolation.rs, issue #286) or the row was renamed without this job following. Everything below this line in the decision table is unreachable until that is fixed, because 'attached and granted nothing' and 'never attached' are the same errno without the label."
          # Matched by NAME, not by equality. A label is a profile name plus an
          # optional ` (mode)` suffix, and under `flags=(unconfined)` the
          # kernel is expected to render `vitrind (unconfined)` -- the exact
          # string crates/vitrin-core/src/spawn/isolation.rs pins in its own
          # unit test. An `= "vitrind"` test here would therefore call a
          # working attachment a failure. The `case` also catches the
          # third outcome the old test could not: a label that is neither
          # `unconfined` nor `vitrind`, which means some OTHER profile on this
          # runner claimed the binary and this job is measuring that instead.
          elif [ "$label" = "unconfined" ] || [ "$label" = "absent" ]; then
            verdict="the profile LOADED BUT DID NOT ATTACH: vitrind's own label is '${label}'. The attachment path in packaging/apparmor/vitrind does not match where the binary actually is. Check the install step's readlink output -- a symlink at /usr/lib/vitrin/vitrind produces exactly this."
          elif case "$label" in vitrind|vitrind\ *) false ;; *) true ;; esac; then
            verdict="SOMETHING ELSE ATTACHED: vitrind's label is '${label}', which is neither 'unconfined' nor this profile's name. Another profile on this runner matches /usr/lib/vitrin/vitrind, so whatever the rungs below would say, they would be saying it about that profile and not about packaging/apparmor/vitrind. Read the 'what policy is already loaded' step, which exists to catch exactly this."
          elif [ "$(get spawn)" != "ok" ]; then
            verdict="the profile ATTACHED (label '${label}') and the realm still did not spawn. Read the spawn step: a failure at the helper's unshare means the grant did not survive the execve into vitrin-realm-init; a mount EACCES means it survived and conferred no capabilities (the profile needs more than 'userns,'); a failure at the shim's execve is the no_new_privs transition regression -- something on this machine attaches a profile to the shim's path."
          elif [ "$(get lever_without)" != "refused" ]; then
            verdict="THE LEVER DID NOT HOLD: with the profile REMOVED, a realm still spawned. Everything above may be true and none of it is attributable to the profile -- something else on this runner is granting the namespace, so this run cannot be cited as evidence that the profile works."
          elif [ "$(get lever_restored)" != "ok" ]; then
            verdict="THE LEVER DID NOT RESTORE: reloading the profile did not bring the spawn back. The run is internally inconsistent and must not be cited either way."
          elif [ "$(get realapp)" != "pass" ]; then
            verdict="a realm spawns under the profile and the real-app confinement gate did not pass ('$(get realapp)', $(get realapp_executed) test(s) executed). The grant works; something else does not."
          else
            verdict="IT WORKED: the profile compiled, loaded, attached (label '${label}'), a realm spawned, the real-app confinement gate EXECUTED $(get realapp_executed) test(s) and passed, and removing the profile brought the failure back. Cost measured alongside it: kernel.apparmor_restrict_unprivileged_unconfined = $(get unconfined_knob), which is what decides whether this profile is borrowable by any local user via aa-exec."
          fi

          echo "VERDICT: ${verdict}"
          {
            echo "**VERDICT:** ${verdict}"
            echo ""
            echo "One runner, one kernel, one image, one AppArmor version. This says"
            echo "nothing about an operator's machine -- see docs/book/src/limits.md."
          } >> "$GITHUB_STEP_SUMMARY"

          case "$verdict" in
            "IT WORKED"*) exit 0 ;;
            *) echo "::error title=AppArmor profile::${verdict}"; exit 1 ;;
          esac

  fuzz-smoke:
    # Quoted: the ": " inside the parenthetical would otherwise open a
    # nested mapping, per the same YAML gotcha the shim job's "Headless
    # acceptance" step names call out.
    name: "fuzz-smoke (cargo-fuzz: protocol_decode, ipc_framing)"
    runs-on: ubuntu-latest
    # Cold (no Swatinem/rust-cache hit yet): compiling libfuzzer-sys plus
    # this workspace's two decoder crates, twice (once per target), can run
    # a couple of minutes before the first `-max_total_time` second is even
    # spent. Warm, this job is fast -- the budget below is for the cold case.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (pinned toolchain + components from rust-toolchain.toml)
        # Same pin as every other job (single source of truth, see the
        # `rust` job's install step): `fuzz/` is deliberately its own cargo
        # workspace (fuzz/README.md), not a member of the root one, but
        # rustup resolves the toolchain by walking up from the cwd, so the
        # root `rust-toolchain.toml` still governs it. `--sanitizer none`
        # (below) is exactly what keeps that true -- plain ASan-instrumented
        # cargo-fuzz needs a nightly toolchain this repo does not pin.
        run: rustup toolchain install && rustup show active-toolchain

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # fuzz/ is its own workspace with its own lockfile and target dir
          # (fuzz/target, cargo-fuzz's default) -- named explicitly so this
          # cache slot never collides with (or gets evicted by) the root
          # workspace's, which every other job populates.
          workspaces: "fuzz -> target"

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: cargo fuzz build (--sanitizer none; see fuzz/README.md "Why --sanitizer none")
        run: |
          cargo fuzz build --sanitizer none protocol_decode
          cargo fuzz build --sanitizer none ipc_framing

      - name: Seed-corpus reachability (fuzz/ is its own workspace, so `cargo test` must be run in it)
        # WS-E.2.1 (#213). `fuzz/` is deliberately NOT a member of the root
        # workspace, so `cargo test --workspace` never collected
        # `fuzz/tests/seed_corpus_reachability.rs` and no job ran it here
        # either -- the exact "a gate whose absence is invisible" shape #229
        # names. It had been failing on `main`: `protocol_decode.rs`'s
        # `DECODERS` table had drifted out of IDL declaration order, so
        # `attach_with_fd` -- the one seed that exercises the fd path -- was
        # handing its fd to `get_seat` and dying on `FdCountMismatch` before it
        # reached a single byte of `attach`.
        #
        # `--check` first, so a stale generator is a clear message rather than a
        # confusing test failure; then the real-decoder proof.
        run: |
          python3 fuzz/seed_corpus.py --check
          cargo test --manifest-path fuzz/Cargo.toml

      - name: Replay the checked-in seed corpus (every past regression stays a permanent test)
        # One file at a time, never a directory: a directory argument is
        # libFuzzer's corpus-to-GROW, and this step must only replay the
        # curated set fuzz/corpus/<target>/ already holds, never write to
        # it (fuzz/README.md's "Running locally" note on why every command
        # here is careful about this).
        run: |
          for target in protocol_decode ipc_framing; do
            for seed in fuzz/corpus/"$target"/*; do
              echo "== replaying $seed =="
              cargo fuzz run --sanitizer none "$target" "$seed"
            done
          done

      - name: Short fuzzing burst (60s/target, seeded from the checked-in corpus)
        # The per-PR half of the P1.9.3 fuzzing story; the 24 h clean-run
        # acceptance criterion is a separate, manual, pre-M1.5 procedure
        # (fuzz/README.md's "24-hour pre-M1.5 campaign" section) -- far too
        # slow to run here. Each target gets its own scratch corpus
        # ($RUNNER_TEMP, wiped with the runner) as the directory libFuzzer
        # is allowed to grow; fuzz/corpus/<target> is passed only as a
        # second, read-seed-only argument, so this step can never dirty the
        # checked-in corpus.
        run: |
          for target in protocol_decode ipc_framing; do
            scratch="${RUNNER_TEMP}/fuzz-scratch-${target}"
            mkdir -p "$scratch"
            cargo fuzz run --sanitizer none "$target" "$scratch" fuzz/corpus/"$target" -- \
              -max_total_time=60 -print_final_stats=1
          done
