name: CI

# CI covers two tracks today:
#   * build-test-codegen (protocol track, P1.1.2): schema validation, tests
#     (debug AND release), the codegen drift check, and the C header checks
#     (standalone compile + golden-frame run).
#   * shim (c-shim track, P1.6.1): Meson build of the wlroots shim from the
#     checked-in generated header + the headless acceptance harness.
# The broader ci-docs work (containerized deps, fuzzing, wlcs conformance,
# the vitrind integration job -- P1.9.*) still belongs to that track and is
# deliberately out of scope here.

on:
  push:
    branches: [main]
  pull_request:

env:
  # Fail the build on any compiler warning, matching how this workspace is
  # developed and verified locally.
  RUSTFLAGS: "-D warnings"

jobs:
  build-test-codegen:
    name: test (debug+release), codegen --check, C header checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (pinned toolchain + components from rust-toolchain.toml)
        # rust-toolchain.toml is the single source of truth for the version
        # AND the rustfmt component (a real runtime dependency of the
        # codegen). Installing from the file -- rather than a toolchain
        # action with its own version/components inputs -- means bumping the
        # pin never needs a matching ci.yml edit, and CI cannot silently run
        # a different toolchain than contributors do. (An action-installed
        # "stable" would also leave the *pinned* toolchain, which rustup
        # auto-installs minimal-profile on first cargo run, without rustfmt
        # -- exactly the failure this replaces.)
        run: rustup toolchain install && rustup show active-toolchain

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Validate IDL against the RELAX NG schema
        # The scanner parses with roxmltree and performs its own semantic
        # checks, but structural/dialect validation is xmllint's job
        # (CLAUDE.md names this as the protocol validation command); without
        # it, a schema-invalid vitrin-v0.xml that roxmltree tolerates would
        # land green.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
          xmllint --noout --relaxng protocol/vitrin-v0.rng protocol/vitrin-v0.xml

      - name: cargo test --workspace
        run: cargo test --workspace

      - name: cargo test --workspace --release
        # Not redundant with the debug run: assertion-related bugs are
        # release-only by nature (this crate's first shipped bug was a
        # debug_assert! compiled out in release), so the suite must pass in
        # exactly the mode where such a regression would hide.
        run: cargo test --workspace --release

      - name: cargo xtask codegen --check
        run: cargo xtask codegen --check

      - name: C header compiles standalone (shim/include/vitrin-protocol.h)
        run: cc -std=c11 -Wall -Werror -I shim/include -c shim/tests/test_header_compiles.c -o /dev/null

      - name: C golden-frame test (Rust and C pinned to the same bytes)
        run: |
          cc -std=c11 -Wall -Werror -I shim/include shim/tests/test_golden_frames.c -o "${RUNNER_TEMP}/golden"
          "${RUNNER_TEMP}/golden"

  shim:
    name: shim build (Meson, wlroots 0.19 wrap) + headless acceptance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build + runtime deps
        # No Rust toolchain here -- the shim builds purely from the checked-in
        # generated header (acceptance criterion). Ubuntu ships no wlroots-0.19,
        # so the pinned subprojects/wlroots.wrap builds it from source using
        # these system deps (wlroots' own nested wraps cover anything missing).
        # No mesa/libinput/vulkan installed on purpose: wlroots' 'auto'
        # renderers/backends then compile down to headless + pixman, which is
        # all this GPU-free runner needs. weston + wayland-utils drive the
        # acceptance harness.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            meson ninja-build pkg-config \
            libwayland-dev libwayland-bin wayland-protocols \
            libdrm-dev libxkbcommon-dev libpixman-1-dev \
            hwdata libdisplay-info-dev libudev-dev \
            weston wayland-utils fonts-dejavu-core

      - name: Cache vendored wlroots + wayland-protocols checkouts
        # Both wraps are wrap-git, which meson clones straight into these dirs
        # and never stores in subprojects/packagecache -- so caching the clone
        # dirs (not packagecache) is what actually avoids re-fetching from
        # freedesktop.org each run. Keyed on the wrap files, so a pin bump
        # (new revision) busts the cache. depth=1 pinned checkouts restore
        # cleanly; meson re-validates the revision on setup.
        uses: actions/cache@v4
        with:
          path: |
            shim/subprojects/wlroots
            shim/subprojects/wayland-protocols
          key: shim-subprojects-${{ hashFiles('shim/subprojects/*.wrap') }}

      - name: meson setup (wlroots from the pinned wrap)
        # Ubuntu has no wlroots-0.19, so the wrap fallback triggers on its own;
        # --force-fallback-for makes that explicit and fails loudly if a system
        # wlroots ever appears with a mismatched version.
        run: meson setup shim/build shim --force-fallback-for=wlroots-0.19,wlroots

      - name: meson compile
        run: meson compile -C shim/build

      - name: meson test (generated header compiles)
        run: meson test -C shim/build --print-errorlogs

      - name: Headless acceptance (exact globals + weston-terminal blind)
        working-directory: shim
        run: bash tests/acceptance/shim_globals_and_client.sh
