#
# Everything comes from crates.io or from a path inside this workspace. There
# is no git dependency anywhere in the tree and there must not be one that
# arrives unnoticed: a git dependency is an unversioned, unauditable,
# force-pushable edge into the trusted core. If one is ever genuinely needed it
# gets a `[sources.allow-org]` entry and a decision-log entry, in that order.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
