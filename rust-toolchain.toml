[toolchain]
# Pinned to an exact version, not "stable": `cargo xtask codegen --check`
# compares generated output byte-for-byte, and that output is a function of
# rustfmt's exact formatting decisions. A floating channel would make the
# drift check fail on unrelated future PRs whenever a stable rustfmt release
# changes a formatting decision, and would let local-vs-CI rustfmt skew
# produce irreproducible "drift". Bumping this pin is a deliberate act that
# regenerates the tree in the same commit (`cargo xtask codegen`).
channel = "1.94.1"
# rustfmt is a real runtime dependency of the codegen (rust_gen.rs shells out
# to it), so it must be installed with the toolchain wherever rustup
# auto-installs this pin -- a minimal-profile install (e.g. a CI runner)
# would otherwise leave `cargo xtask codegen` broken.
#
# clippy is pinned for the same reproducibility reason: CI gates on
# `cargo clippy -- -D warnings` (P1.9.1), and clippy's lint set grows with
# every release, so a floating clippy would fail PRs on lints the pinned
# toolchain has never seen (and vice versa between contributors and CI).
components = ["rustfmt", "clippy"]
