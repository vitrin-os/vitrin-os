[package]
name = "vitrin-ipc"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Vitrin OS Unix-socket transport: framing over the vitrin-protocol wire format, SCM_RIGHTS fd passing (at most one fd per message), SO_PEERCRED captured at accept. No protocol semantics."
publish = false

[dependencies]
vitrin-protocol = { path = "../vitrin-protocol" }
# The primary low-level unix crate (already in the lockfile via
# dev-dependencies). Chosen over raw `libc` because it wraps every syscall
# this crate needs (accept4, sendmsg/recvmsg with SCM_RIGHTS, flock) behind
# I/O-safe `OwnedFd`/`BorrowedFd` types with no unsafe in *our* code -- the
# TCB memory-safety posture of PRD Doc 2 section 2.
rustix = { version = "1", features = ["net", "fs"] }
# Used for exactly one call: getsockopt(SO_PEERCRED). rustix's typed
# `socket_peercred` reads the kernel `struct ucred` into a `Pid`-backed
# (`NonZeroI32`) field, but the kernel legitimately reports `pid = 0` for a
# peer whose pid is not mappable into this process's pid namespace
# (unix(7)) -- undefined behavior in the TCB on any cross-pid-namespace
# peer. nix's `UnixCredentials` keeps the raw `libc::ucred` (plain `pid_t`),
# so pid 0 is representable and surfaced as `PeerCred::pid == None`.
nix = { version = "0.31", default-features = false, features = ["socket"] }

[dev-dependencies]
# Tests additionally need getpid/getuid/getgid to assert SO_PEERCRED values.
rustix = { version = "1", features = ["net", "fs", "process"] }
