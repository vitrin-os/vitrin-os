[package]
name = "vitrin-core"
version = "0.1.0"
edition.workspace = true
license = "MPL-2.0"
rust-version.workspace = true
description = "Vitrin OS trusted core. Binary `vitrind`: compositor, capability kernel, grant store -- the entire TCB."
publish = false

[[bin]]
name = "vitrind"
path = "src/main.rs"

[dependencies]
# The compositor toolkit for the trusted core (PRD SS17: Rust + Smithay).
# Pinned exactly -- the issue-#17 decision -- because renderer output feeds
# pixel-golden tests (P1.3.2/P1.3.6) and a silent minor bump must not move
# pixels. `default-features = false` keeps the TCB dependency surface minimal
# (plan risk R7): `backend_winit` pulls exactly the EGL/GLES pieces the nested
# backend needs, and `renderer_pixman` adds the CPU software renderer the
# headless backend composites with (P1.3.2) -- the GPU-less path CI runs on,
# and where the P1.3.2/P1.3.6 goldens are read back. Nothing else.
smithay = { version = "=0.7.0", default-features = false, features = ["backend_winit", "renderer_pixman"] }
# The nested backend owns its winit event-loop glue (issue #118): Smithay's
# own `backend::winit` module discards winit's interpreted `logical_key`
# before a keyboard event ever reaches the core (`WinitKeyboardInputEvent`
# carries only the evdev scancode, and its private `ApplicationHandler`
# gives no hook to see the raw `WindowEvent` either) -- so
# `crates/vitrin-core/src/backend/winit.rs` builds its own EGL surface
# directly on the Wayland/X11 window winit hands back, using the same public
# `smithay::backend::egl` API Smithay's own module calls. `wayland-egl` is
# the one extra piece that module does not re-export: the native-surface
# type EGL binds to under a Wayland host. Not pinned exactly (unlike
# smithay/fontdue above): it is pure plumbing between two other pinned
# dependencies, one struct and two calls
# (`WlEglSurface::new_from_raw`/`resize`), and moves no pixel a golden
# depends on. Already in the tree transitively (Smithay pulls it under
# `backend_winit` too), so this adds no new transitive surface (plan risk
# R7) -- only makes an existing one a direct dependency, at the version
# Smithay's own `Cargo.lock` entry already resolves to.
wayland-egl = "0.32"
# The same calloop Smithay links against (it pins 0.14); this direct
# dependency exists to (a) import event-loop types under their own name and
# (b) switch on the `signals` feature -- the signalfd event source used for
# clean SIGINT/SIGTERM shutdown inside the compositor loop.
calloop = { version = "0.14", features = ["signals"] }
# Smithay's logging facade; the core emits its own diagnostics through it too.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The wire codec (P1.1.5 codegen): the capture service (P1.3.6) encodes
# `vitrin_view.frame_ready` and `vitrin_grant.refused` through the generated
# message types, never by hand. Pure data, no I/O -- zero new transitive
# dependencies.
vitrin-protocol = { path = "../vitrin-protocol" }
# The transport (P1.2): `Connection::send_or_queue` is how a capture's fresh
# memfd rides SCM_RIGHTS to the requesting agent connection. Default features
# = the `server` slice (calloop event-source glue), which is exactly the side
# the trusted core is.
vitrin-ipc = { path = "../vitrin-ipc" }
# memfd_create + F_ADD_SEALS for the capture path (P1.3.6): every capture is
# a fresh memfd sealed SHRINK|GROW|WRITE|SEAL before sending (the wire
# contract's always-a-copy proof). Same crate and posture as vitrin-ipc
# (already in the tree, so no new dependency for the R7 budget): I/O-safe
# OwnedFd APIs, no unsafe in our code. The `process` feature (P1.4.1) adds
# only `geteuid`, which anchors the identity layer's registry-ownership
# check and its SO_PEERCRED same-user policy -- a feature bump on an
# existing dependency, not a new one.
# The `net` feature (issue #138) adds `sendmsg`/`recv`/`sockopt::socket_type`
# for the `consent-injector` channel: a sealed memfd rides SCM_RIGHTS beside a
# one-line reply on an inherited socketpair, and the adopted descriptor is
# validated as a `SOCK_STREAM` socket before anything is read from it. A
# feature bump on a crate already in the graph -- exactly the posture
# `process` above already documents -- not a new dependency, and no image
# codec anywhere near it (plan risk R7): the one pixel payload is raw RGBA.
rustix = { version = "1", features = ["fs", "net", "process"] }
# Raw syscalls where rustix cannot express them or where a thin `extern "C"`
# call is the honest spelling. Four sites: (1) the post-`fork`, pre-`execve`
# closure in `spawn` (P1.5.2), which must be async-signal-safe and therefore
# cannot allocate — `close_range` (marks every descriptor above stdio
# close-on-exec, so nothing of the core's crosses the fork), `signal` (resets
# inherited SIG_IGN dispositions, so the confined app is not immune to the
# signals lifecycle terminates it with), `sigemptyset`/`sigprocmask` (clears
# the child's inherited signal mask, so no signal starts out blocked in the
# app), and `dup3`/`fcntl` (places the shim's end of the identity socketpair on
# fd 3); (2) process signalling in `lifecycle` (`kill`, the shutdown ladder);
# (3) the startup signal mask in `main` (`pthread_sigmask`/`sigemptyset`/
# `sigaddset`, so the compositor loop's `signalfd` is the only path
# SIGINT/SIGTERM take); and (4) `getrandom` in `consent::indicator` (P1.7.1 /
# issue #85), the one entropy draw the core makes — the per-session
# trusted-indicator secret, minted once at startup.
# Justified against plan risk R7 on two counts: it is already in the
# dependency graph (Smithay, calloop and nix all pull it, so this adds no
# transitive surface at all), and rustix — the crate the core otherwise uses
# for every syscall — cannot express the `spawn` set: it has no `close_range`
# or `signal` binding at all, and its `dup3` takes `&mut OwnedFd` for the
# target, so aiming at a fixed descriptor
# number would mean fabricating an `OwnedFd` for a descriptor that may not be
# open and whose drop would close a descriptor we do not own. A thin
# `extern "C"` call is both the honest and the async-signal-safe spelling in
# a post-fork context, where anything richer risks an allocation. The
# `getrandom` draw rustix *could* express (behind its `rand` feature), but
# libc is already linked for the `spawn` set and spells it in one line, so the
# single entropy call stays beside the core's other raw syscalls rather than
# buying a feature bump for three bytes.
libc = "0.2"

# GBM buffer allocation for the env-gated real-GPU dmabuf tests (P1.3.5,
# M1.5) — the test-side allocator that mints *genuine* dmabufs from a render
# node, playing the app/shim role. Optional and never enabled in CI (the
# `gpu-tests` feature below): cargo cannot make dev-dependencies optional, so
# it sits here, but it is referenced only from `#[cfg(all(test, feature =
# "gpu-tests"))]` code and never enters the vitrind runtime tree. The
# production dmabuf import path (`crate::dmabuf`) needs no allocator — it
# receives fds — and builds in every configuration.
gbm = { version = "0.18", default-features = false, optional = true }
# The observation-digest hash of the flight recorder (P1.4.5, backward
# requirement B1: every capture entry identifies what was observed). The one
# hash dependency the TCB takes, and deliberately not hand-rolled -- rolling
# a hash function is the wrong trade in a trusted core. Chosen over `sha2`
# on *worst-case* hot-path throughput: SHA-256's fast path needs the SHA-NI
# CPU extension, and without it (Skylake-SP class hardware, many CI runners)
# it collapses to ~0.2 GB/s -- ~20 ms on a single 1280x800 frame -- whereas
# BLAKE3's SIMD floor is SSE2 and it measures ~4 GB/s here (~1 ms/frame).
# `default-features = false` drops `std` (nothing here needs it) and
# `features = ["pure"]` drops the vendored assembly, so the crate is pure
# Rust with runtime-dispatched intrinsics and the build invokes NO C
# toolchain (verified by building with CC pointing at a nonexistent binary).
# The algorithm is tagged in every recorder entry (`frame.digest_alg`), so
# swapping it is a schema-visible, non-breaking change.
blake3 = { version = "1.8.5", default-features = false, features = ["pure"] }
# The PNG **encoder** for the human's screenshot key (WS-E.2.4, issue #216).
#
# This is the one place the rule stated twice below -- "no image codec in the
# core, in any dependency class" -- is met with a dependency rather than an
# absence, so the argument has to carry its own weight. Three facts:
#
#  1. It is in-tree and has no dependencies of its own. `crates/vitrin-png` is
#     ~130 lines of arithmetic (CRC-32, Adler-32, stored-block DEFLATE, four
#     chunk headers) that has been in this repository since P1.9.2 as
#     `vitrin-golden/src/png.rs`. It is a supply-chain edge to *ourselves*.
#  2. It is an ENCODER, and there is no decoder in it. It consumes a buffer
#     this core composited and returns bytes this core writes; it never parses
#     input, so the class of bug an image codec is feared for -- a malformed
#     file driving a parser -- has no way in. That is the same argument the
#     fontdue block below makes for its `unsafe`: the input is not the
#     attacker's.
#  3. The alternative was worse in both directions: an external `png`/`image`
#     crate (a real codec, with a decoder, in the TCB), or a copy of the
#     encoder inside `vitrin-core` reviewed to a different bar than the copy
#     the golden harness keeps.
#
# What it costs is stated rather than implied: this code was written for test
# artifacts and is now TCB code, and it must be reviewed as such -- which
# stays true only for as long as nothing else in the core feeds it bytes it
# did not itself produce.
vitrin-png = { path = "../vitrin-png" }
# Glyph rasterization for the consent prompt (P1.7.1, `crate::consent`). The
# core owns the screen, so there is no privileged system layer to delegate the
# prompt to -- the TCB draws it itself -- and turning a TrueType outline into
# an anti-aliased coverage bitmap is the one part of that it should not
# hand-roll, for the same reason the recorder does not hand-roll a hash
# (blake3, above): quadratic-bezier flattening plus scanline coverage
# accumulation is subtle, well-solved code whose bugs are silent.
#
# Scoped to exactly that: fontdue rasterizes ONE glyph at a time into an
# 8-bit coverage bitmap. Every shape the prompt draws -- scrim, card, border,
# button boxes -- and every composite of those bitmaps is integer byte
# assembly in `crate::consent::render`, the same posture `crate::scene`
# already takes ("integer math only, no filtering, no renderer state"). No
# vector rasterizer, no toolkit, no second host window (decision D4).
#
# Justified against plan risk R7 on four counts:
#
# 1. **Transitive surface: exactly one crate.** `default-features = false`
#    yields `fontdue -> ttf-parser` and nothing else -- ttf-parser being the
#    same `#![forbid(unsafe_code)]` font parser the wider Rust graphics
#    ecosystem standardized on. For comparison, the rejected alternatives are
#    an order of magnitude wider: tiny-skia (for the shapes fontdue does not
#    draw) adds 7 crates, and cosmic-text -- the usual "just do text properly"
#    answer -- pulls a full shaping/bidi/system-font stack (rustybuzz,
#    unicode-bidi, swash, fontdb, ...). The prompt renders core-validated
#    ASCII from `principals.toml`-registered identities, verb names, and a
#    fixed label set: it needs no shaping engine, and buying one would put
#    tens of thousands of lines of text-layout code inside the TCB to draw
#    the string "Deny".
# 2. **`default-features = false` is a determinism requirement, not tidiness.**
#    fontdue's default `simd` feature swaps in x86-only SSE implementations of
#    its coverage accumulator, and that accumulator computes a prefix sum:
#    the scalar path sums strictly left to right, the SSE path sums pairwise.
#    Floating-point addition is not associative, so the two paths can disagree
#    in the low bits of a coverage byte -- i.e. the golden would be
#    architecture-dependent by construction. (The same feature also swaps an
#    exact `_mm_sqrt_ss` in for a hand-rolled bit-twiddling approximation.)
#    Disabling it puts every machine on one scalar IEEE-754 path, which Rust
#    does not license itself to reassociate or contract, so the golden is
#    byte-stable across x86-64 and aarch64. `hashbrown` (the other default) is
#    dropped for the ordinary R7 reason: the core is a std binary and
#    `std::collections` already serves.
# 3. **No I/O and no font discovery.** fontdue parses bytes handed to it. The
#    one font it is ever handed is vendored in `assets/fonts/` and embedded
#    with `include_bytes!` (see that directory's README for provenance and the
#    OFL-1.1 terms), so the prompt never touches fontconfig, never reads a
#    user-writable font path, and cannot fail to draw because the system's
#    font setup is broken or hostile.
# 4. **Parsing attacker-controlled data? No.** The font bytes are a
#    compile-time constant of this binary; the strings are core-validated
#    (`crate::consent::PromptContent` holds typed core values, never client
#    text). So the usual "font parsers are a CVE farm" objection does not
#    apply here: nothing an agent or app sends reaches this parser.
# 5. **fontdue itself contains `unsafe` -- four blocks -- and that must be
#    stated here, not inferred.** Point 1 cites ttf-parser's
#    `#![forbid(unsafe_code)]`, which is true of the transitive crate and says
#    nothing about the direct one. In fontdue 0.9.3: `font.rs:269`
#    `mem::transmute::<u32, char>(codepoint)` over values read out of the
#    font's cmap table (UB for surrogates or anything above 0x10FFFF) is the
#    sharpest; also `font.rs:636` `transmute::<Option<NonZeroU16>, u16>`,
#    `layout.rs:532` `set_len(0)`, and `raster.rs:43`, in a module whose own
#    header reads "Fontdue's raster is very unsafe, with nuanced invariants".
#    None of it is attacker-reachable *here*, and the reason is narrow and
#    worth naming: the only bytes that rasterizer ever parses are
#    `FONT_BYTES`, a compile-time constant pinned by the `const` length assert
#    in `src/consent/text.rs` and by the SHA-256 recorded in
#    `assets/fonts/README.md`. That argument is what makes the cmap transmute
#    unreachable, and it is exactly what a second face, a user-selectable
#    face, or an OpenType feature would invalidate -- widening what this
#    rasterizer parses means re-auditing these four blocks, not just adding a
#    file. The point of these comments is that a reviewer can audit the TCB's
#    memory-safety posture from this file without reading the dependency, and
#    citing only the safe transitive crate would read as stronger than the
#    truth.
#
# Pinned exactly, on the smithay precedent above (issue #17): every
# anti-aliased pixel in `tests/golden/consent_prompt.txt` is fontdue output,
# and a glyph rasterizer is precisely the kind of code whose patch releases
# move pixels (bezier flattening, coverage accumulation, metrics rounding).
# fontdue feeds a pixel golden more directly than smithay does, so it gets the
# same treatment: a caret requirement would let an unrelated `cargo update`
# turn the consent golden red on a PR that never touched the renderer.
fontdue = { version = "=0.9.3", default-features = false }
# The lock screen's password KDF (WS-E.2.2, `crate::lock::passphrase`). This is
# the first dependency in the TCB that processes **operator-supplied** input
# rather than a compile-time constant, and that difference is why it gets its
# own justification instead of riding fontdue's.
#
# # Crate count, measured rather than estimated
#
# **SIX**, not four, and the first count here was wrong in a way worth keeping
# on the record: it said four (`argon2`, `base64ct`, `blake2`, `subtle`) and
# separately claimed `password-hash` and an RNG crate had been kept out. Both
# halves were false. Counted against `main`'s `Cargo.lock` (245 packages ->
# 251), the new packages are:
#
#     argon2  base64ct  blake2  subtle  password-hash  rand_core@0.6.4
#
# and what brings the last two in is the `alloc` feature itself, which the old
# comment described as adding "no crate at all":
#
#     vitrin-core -> argon2/alloc -> argon2/password-hash
#                 -> password-hash -> rand_core@0.6.4
#
# (`cargo tree -p vitrin-core --edges normal,features -i argon2` shows it.)
# In argon2 0.5 `alloc` is defined as `["password-hash/alloc"]`, so no
# configuration of this dependency allocates its own memory block without also
# pulling the PHC-string parser. Nothing in `lock::passphrase` uses that parser
# -- it imports `Algorithm`, `Argon2`, `Params`, `Version` and `argon2::Error`,
# and stores a raw digest rather than a PHC string -- so this is surface the
# TCB carries without calling.
#
# **This exceeds issue #214's own budget** of "3-5 transitive dependencies
# inside the most privileged component". Recorded rather than rounded down,
# because #201 records that `deny.toml` and the `cargo-deny` job still do not
# exist -- so this comment is the only place the budget is checked at all, and a
# budget checked only by a comment that was measured wrong is not checked.
#
# The way out, if six is judged too many: drop `alloc` and call
# `hash_password_into_with_memory` with a block this crate owns. That removes
# `password-hash` and `rand_core` and costs a hand-managed KDF memory block
# inside the TCB. A real trade rather than an oversight, and it belongs to
# whoever lands #201's `deny.toml` with the whole graph in front of them.
#
# Default features are off but for `alloc`. `rand` (salt generation from an RNG
# crate) and `std` really are excluded, and really do add surface for jobs this
# core does itself. `password-hash` is NOT excluded, whatever the earlier
# wording here implied: `alloc` enables it transitively, as traced above.
# `alloc` is what lets Argon2 allocate its own memory
# block, which is the whole mechanism of a memory-hard KDF; without it the
# caller must hand over a pre-sized block, which would put the parameter
# arithmetic this core is refusing to reimplement back in this file. The salt is drawn from
# the same `getrandom` the trusted indicator uses (`crate::consent::indicator`),
# and the file format is parsed by `crate::lock::passphrase`'s own strict
# reader, on the `crate::toml_subset` precedent — the core already refuses to
# take a general parser for a file only it writes.
#
# # Why Argon2id specifically, and why a KDF at all
#
# The file holds a hash of a passphrase that unlocks a session. Anyone who can
# read it can attack it offline, at their own pace, on their own hardware, so
# the only defence is making each guess expensive in *memory* as well as time —
# which is the whole point of Argon2id and the reason a plain BLAKE3 of the
# passphrase (zero new crates, already a dependency) was rejected. Argon2id is
# the RFC 9106 recommendation and the OWASP default; the parameters are pinned
# in `crate::lock::passphrase` and carried in the file so an operator can raise
# them without a rebuild.
#
# NOT pinned exactly, unlike smithay and fontdue: no golden depends on it, and
# for a security-relevant crate the ability to take a patch release without
# editing this file is worth more than reproducibility of a byte nobody
# compares. The KDF *identity* is pinned instead — in the file format's
# `argon2id` token, which `crate::lock::passphrase` refuses to read as anything
# else — so a dependency bump cannot silently change what a stored hash means.
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
# Constant-time comparison of the derived key against the stored one, so a
# wrong-passphrase attempt leaks no information about how wrong it was. Already
# in the graph (argon2 -> blake2 -> digest -> subtle), so naming it directly
# adds **zero** crates; it is named directly rather than reached through a
# dependency's re-export because a `==` on two byte slices is exactly the kind
# of thing that gets reintroduced by a well-meaning simplification, and an
# import at the top of the file is what makes it obvious that it must not be.
subtle = { version = "2.6", default-features = false }

[features]
# Compile the real-GPU dmabuf tests (P1.3.5). Requires a machine with a DRM
# render node + EGL; additionally env-gated at runtime (VITRIN_GPU_TESTS=1)
# and `#[ignore]`d by default. Run:
#   VITRIN_GPU_TESTS=1 cargo test -p vitrin-core --features gpu-tests -- --ignored dmabuf
# CI never enables this feature, so headless builds stay GPU-free and lean.
gpu-tests = ["dep:gbm"]
# Compile the scripted-consent injector (P1.4.3): the build-gated core hook
# through which integration harnesses approve/deny/narrow specific pending
# petitions programmatically. Consent decisions are deliberately not
# protocol-expressible (IDL, vitrin_consent), so this hook is the only test
# seam -- always compiled under cfg(test); this feature additionally exposes
# it to out-of-crate harnesses (P1.9). Never enabled in deployment builds.
scripted-consent = []
# Compile the dead-man test injector (issue #109): a SIGUSR1 handler on the
# HEADLESS backend that synthesizes a completed dead-man chord and applies it
# through the exact same `Runtime::apply_dead_man` entry point the nested
# backend's `DeadManHost::on_trigger` calls for a real one -- against the
# session's real grant table and petition registry, not a second, weaker
# path. It exists because headless has no physical input device to hold a
# real chord on (`crate::deadman`'s module docs), so the M1.4 CI gate for
# hold-Esc revocation against a real app (`tests/integration/
# test_real_deadman.py`) needs a stand-in for the human's hold -- the same
# posture issue #109 asks for explicitly ("a test-only privileged injector...
# clearly test-gated"). Unlike `scripted-consent` above, this is gated on the
# feature ALONE, not `cfg(any(test, feature = ...))`: the property under test
# (a real signal reaching a real running process and revoking a real grant
# table through the real embedder call) has no useful in-process unit-test
# shape, so the feature's only consumer is the out-of-process integration
# suite, which builds `vitrind` with it (`tests/integration/run.sh`) and
# sends the running core SIGUSR1. Never enabled in a deployment build -- same
# posture as `scripted-consent`, and for the same reason: a build that cannot
# even name a test hook cannot be tricked into responding to one.
dead-man-injector = []
# Compile the out-of-process consent injector (issue #138, extended by #139):
# on the HEADLESS backend only, and only when a runtime flag ALSO names it,
# four things a deployment build cannot even mention --
#
#   1. the real interactive consent round (`session::service_consent_round`)
#      driven once per dispatch, so a headless core really raises the front
#      pending petition's prompt and really composites it into the retained
#      human-visible framebuffer;
#   2. an inherited `AF_UNIX`/`SOCK_STREAM` socketpair, adopted from the
#      descriptor number `--consent-injector-fd N` names, on which a harness
#      may `describe` the raised prompt and `decide <token> <button>`. The
#      decision is deposited into that round's `ConsentGrab` -- exactly where
#      a physical click on the card deposits one;
#   3. `HeadlessView::consent_occlusion_window`, which exports the CARD's
#      footprint (and nothing else) of the human-visible framebuffer as a
#      sealed memfd over that same socket;
#   4. the trusted-band witness (issue #139) -- `backend::band_witness::
#      BandWitness` as a field on `HeadlessOutput`, updated on EVERY composite
#      from the two buffers `HeadlessOutput::present` already holds (the realm
#      view and the human-visible output), plus a `band` request on that same
#      socket that reports its ten ASCII counters. What it turns on, stated so
#      this block is a complete answer to "what does an instrumented build
#      expose": running counts of composites evaluated, of composites at which
#      the human-visible band's rows changed (zero in a correct session -- the
#      property), of composites at which the realm view's rows just BELOW the
#      band changed, of composites refused for a malformed buffer; three
#      latest-composite scalars (the band's height and the view's dimensions);
#      two latest-composite booleans (the output below the band tracks the
#      realm view; the band's rows are one opaque colour); and an FNV-1a-64
#      digest of those realm-view rows below the band. No descriptor, no
#      pixels. Each `band` request costs one extra composite, because
#      `answer_band` recomposites first so the reply describes the frame on the
#      virtual display now.
#
# (4) rides #138's channel rather than opening a second one because it is a
# READ that confers nothing: it adds no authority to a socket that already
# carries the power to answer a consent prompt, and a second unnamed socket
# would be a second thing to keep right for no gain. Its *wiring* -- the field,
# the call in `present`, the `band` arm -- is under the feature alone; only the
# `band_witness` module itself is `cfg(any(test, feature = "consent-injector"))`,
# so its arithmetic stays unit-tested in a plain `cargo test`. A shipping
# `vitrind` computes nothing and answers nothing.
#
# The decision goes nowhere near `scripted-consent`'s `resolve_scripted`: it
# is drained by the SAME `service_consent_round` and applied by the SAME
# `PetitionRegistry::resolve_human` the nested backend's real human click
# reaches, so this adds no second authority-checking site -- it feeds the one
# that exists from a socket instead of a pointer. What it cannot prove, and
# only nested mode with a human at a mouse can, is that a real click lands on
# the real button rectangle; `consent::grab`'s own hit-test tests and
# `shim/docs/firefox.md` §9 hold that half.
#
# # Two independent gates, and why the feature is not enough by itself
#
# Everything carrying authority is gated on the feature ALONE, the
# `dead-man-injector` posture: the fd adoption, the calloop source, the
# `service_consent` override, `consent_occlusion_window`. Only the LINE
# PARSER is `cfg(any(test, feature = "consent-injector"))` -- it is a pure
# function with no authority, and its vocabulary is exactly the thing that
# rots if only a Python test ever exercises it.
#
# A feature build is additionally inert until `--consent-injector-fd N` is
# passed: `--headless --consent=interactive` is still REFUSED at startup
# without it, byte-for-byte as a plain build refuses it, and with no flag
# there is no grab, no channel and no prompt machinery at runtime at all.
# That is deliberate (issue #138): a running process must be identifiable as
# instrumented by inspecting how it was INVOKED (`/proc/<pid>/cmdline`), not
# only by knowing how it was built.
#
# # What never leaves the process
#
# The session's trusted indicator (issue #85) is never written to any file or
# log in any build, this one included. The exported occlusion window is the
# consent card's own footprint, which `consent::ConsentSurface::composite_over`
# paints with an opaque `blit_opaque` AFTER the indicator-coloured ring that
# hugs its outside edge -- so the ring, the scrim and the trust band are never
# even read back. `HeadlessView::latest_output_rgba` stays `#[cfg(test)]`: no
# shipping build and no instrumented build can obtain a whole human-visible
# frame.
#
# The band witness (4) holds to a rule that is STRICTER than "export no
# pixels", and the difference is the whole reason it is safe: a single boolean
# "the band's rows equal the client's rows beneath them" exports no pixel and
# is still an oracle -- a confined app paints candidate colour C, reads the
# bit, and has `S == C` over a 22.8-bit space it can exhaust. So the rule is
# that every field it exports must be a constant function of the run,
# independent of the indicator's VALUE. Checked mechanically by
# `band_witness.rs`'s `a_report_does_not_depend_on_the_bands_colour`, and again
# over prompt-up composites (scrim, card and the indicator-coloured trusted
# ring) by `..._with_a_card_up`: two runs identical but for the secret must
# produce byte-identical reports. The one field derived from real pixels,
# `probe_fnv`, digests REALM-VIEW rows, which the indicator is never in.
#
# Never enabled in a deployment build -- same posture as the two features
# above, and for the same reason: a build that cannot even name a test hook
# cannot be tricked into responding to one.
consent-injector = []
# Compile the physical-input test injector (issue #212, WS-E.1.6): on the
# HEADLESS backend only, and only when `--physical-input-fd N` also names an
# inherited socketpair, a channel on which a harness may say `key`, `button`,
# `motion` and `scroll` -- and have those become `Origin::Physical` seat input
# through the SAME entry points the nested backend's winit event handler uses
# (`input::intake_physical` for the pointer, `input::physical_key` for keys),
# routed by the SAME `session::route_physical_turn`.
#
# # Why it has to exist for WS-E.1.6 to be testable at all
#
# `SeatInput::physical` is private to `crate::input` by design, `intake_physical`
# is the nested backend's only caller, headless has no input device, and
# headless is the only backend CI runs (D-019(4)). So "physical input follows
# the bound realm, an agent's actuation follows its grant" -- the whole of
# issue #212 -- has no mock-free gate without a way to make physical-tagged
# input happen in a headless process. This is that way, and it is the same
# posture `dead-man-injector` and `consent-injector` already established: gated
# on the feature ALONE for everything carrying authority (the fd adoption, the
# calloop source, the application), inert without the runtime flag, never
# enabled in a deployment build.
#
# # What it costs, stated rather than implied
#
# `crate::input`'s module docs lean heavily on `SeatInput::physical`'s privacy
# being a **compile-time** guarantee: "no phantom physical-input path can
# exist" in a headless build, structurally, not by a runtime check. A build
# with this feature is a build in which that sentence is weaker -- something
# that is not a human can mint physical-tagged input, on the say-so of whoever
# holds a descriptor. The mitigation is the same as the other two injectors'
# (feature-gated, flag-gated, routed through the real entry point rather than a
# second weaker one) and the honest statement is that a `physical-input-injector`
# build has a *runtime* guarantee where a shipping build has a compile-time
# one. `crate::input`'s docs say so where they make the claim.
#
# One further asymmetry, deliberate: the headless router stacks `NoopHook`, so
# an injected event passes no consent grab and no dead-man watcher. The
# injector does not stack them either -- it would be inventing a hook stack no
# backend actually runs -- so what this gate proves is *routing*, and the
# trusted-path properties (a prompt consumes input for every realm; a held
# chord revokes across realms) are proved in-crate against the real
# `ConsentGate`/`DeadManHook` instead, where a real stack exists to drive.
physical-input-injector = []

[dev-dependencies]
# The permanent mock-shim fixture (issue #21): a compliant peer speaking the
# real shim wire protocol over a socketpair, used to exercise the shim-facing
# server (`shim`, P1.3.4) end-to-end until — and alongside — the real C shim
# (P1.6.2). Test-only: it must never enter the vitrind runtime dependency
# tree. Its deterministic frame generator keeps pixel assertions in-process
# (plan risk R7: no image codec in the core, in any dependency class).
vitrin-mock-shim = { path = "../vitrin-mock-shim" }
# The golden-frame comparison harness (P1.9.2): the shared pixel-assertion
# library the headless test-pattern image golden runs through
# (`capture::tests`). Test-only, and itself dependency-free — its SSIM and PNG
# artifact encoder are hand-rolled, so this adds no image codec to the tree
# (plan risk R7), same posture as the mock shim above.
vitrin-golden = { path = "../vitrin-golden" }
